name: Intersolar 2026 - aviso aos clientes

# ONE-SHOT com prazo: a feira é 25–27/08/2026 e são 69 clientes pagantes.
#
# Por que um workflow próprio: o master cron roda de HORA em hora e cada tick
# manda 1 mensagem — 69 clientes levariam 6 dias e a feira acaba em 3. Batendo
# de 10 em 10 min a fila escoa em ~2 dias.
#
# Isso NÃO afrouxa nada: quem decide se a mensagem sai é o gate da linha
# (dentroDoTetoCarla), que segura 4/h e 10–15 min sorteados entre um envio e o
# seguinte. Mais ticks só param de desperdiçar o intervalo entre eles — o teto
# anti-ban continua exatamente o mesmo.
#
# 12–23h UTC = 9h–20h BRT, a mesma janela diurna que o serviço já exige. Fora
# dela o tick seria no-op, então nem chama.
#
# APAGAR ESTE ARQUIVO depois de 27/08/2026. Se ficar, vira no-op barato (a fila
# esvazia e dispararIntersolar devolve "ninguém pendente"), mas é lixo batendo
# na API a cada 10 min.
on:
  schedule:
    - cron: '*/10 12-23 * * *'
  workflow_dispatch:

jobs:
  drenar:
    runs-on: ubuntu-latest
    steps:
      - name: Manda a proxima da fila (1 msg, se a linha deixar)
        run: |
          curl -X GET "https://api.solardoc.app/cron/intersolar?enviar=1" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120 -sS -w "\nHTTP %{http_code}\n"
