name: Segurança

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # o histórico inteiro: segredo antigo continua sendo segredo

      # gitleaks — pega o padrão E a regra nossa de "segredo escrito em documentação",
      # que foi como o CRON_SECRET foi parar num arquivo público em 10/09/2026.
      # Os 42 achados já rotacionados em 26/06 vivem no .gitleaksignore por fingerprint,
      # então QUALQUER achado aqui é vazamento novo.
      - name: gitleaks
        run: |
          V=8.30.1
          # Confere o checksum antes de rodar: download adulterado nao executa.
          SHA=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${SHA}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . -c .gitleaks.toml --redact --no-banner --exit-code 1

      # trufflehog — a diferença que importa: ele VERIFICA se a credencial ainda
      # está viva, em vez de só dizer que parece uma chave.
      # Pinado em release, nao @main: @main roda no seu CI o que estiver no branch
      # deles a cada push, com acesso de leitura ao repo. v3.97.4 e a estavel de 03/09.
      - name: trufflehog
        uses: trufflesecurity/trufflehog@v3.97.4
        with:
          extra_args: --results=verified,unknown
