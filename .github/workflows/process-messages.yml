name: Process Messages (lembretes agenda + fila Z-API)

# A cada 5 minutos: dispara as 3 mensagens da agenda (confirmação ao marcar,
# lembrete 1h e 5min antes), pra cliente E consultor, além de processar a fila Z-API.
# GitHub Actions tem piso de ~5min e pode atrasar; as janelas no código são
# alargadas (5min: -3..12 / 1h: 45..75) pra tolerar ticks atrasados sem perder envio.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Processar mensagens
        run: |
          curl -X GET "https://api.solardoc.app/cron/process-messages" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120 -sS -w "\nHTTP %{http_code}\n"
      - name: Tick de disparo do Gerador (Central de Automacao)
        run: |
          curl -X GET "https://api.solardoc.app/cron/gerador-broadcast-tick" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120 -sS -w "\nHTTP %{http_code}\n"
      # Menu de Avisos (Eletroposto): UM contato por tick. Nao e blast — o tick
      # manda uma mensagem e volta, respeitando janela, espacamento e teto da linha.
      - name: Tick do Menu de Avisos (base de parceria)
        run: |
          curl -X GET "https://api.solardoc.app/cron/avisos-tick" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120 -sS -w "\nHTTP %{http_code}\n"
      # Busca de lead na Apify (Prospeccao). A tela enfileira o pedido e da um kick;
      # este tick e a rede de seguranca (aba fechada, kick perdido, run demorada).
      - name: Tick de busca de lead (Prospeccao/Apify)
        run: |
          curl -X GET "https://api.solardoc.app/cron/prospeccao-tick" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120 -sS -w "\nHTTP %{http_code}\n"
      # Estudo do local do eletroposto: acha o terreno, monta o estudo antes da
      # reuniao e avisa o dono. Este passo e o UNICO chamador do tick.
      - name: Tick do estudo do local (Eletroposto)
        run: |
          curl -X GET "https://api.solardoc.app/cron/eletroposto-estudo" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120 -sS -w "\nHTTP %{http_code}\n"
