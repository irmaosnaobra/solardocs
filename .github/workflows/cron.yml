name: Hourly Master Cron

on:
  schedule:
    - cron: '0 * * * *' # Executa a cada hora no minuto zero
  workflow_dispatch: # Permite disparar manualmente via GitHub

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel API Master Cron
        run: |
          curl -X GET "https://api.solardoc.app/cron/master" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
      - name: Refresh do token do Instagram (renova quando falta <14d)
        run: |
          curl -X GET "https://api.solardoc.app/cron/instagram-refresh-token" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" -sS -w "\nHTTP %{http_code}\n"
