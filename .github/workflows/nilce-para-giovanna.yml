name: Fim do dia da Nilce (19h) - passa pra Giovanna

# AGENDAMENTO DESLIGADO EM 15/09/2026. Ordem do Thiago: a Nilce passou a seguir
# as mesmas regras da Giovanna, e a principal delas é que cliente sai da carteira
# por VENDA ou por PERDIDO, nunca por robô. No mesmo dia, 52 fichas da Giovanna
# (21 a 29/09) viraram da Nilce. Com esta passagem ligada, cada uma voltaria pra
# Giovanna às 19h do dia do próprio horário, e a divisão se desfazia sozinha.
#
# O disparo manual ficou, mas ele MOVE de verdade. Pra só olhar o que seria
# passado, chame /cron/nilce-para-giovanna?dry=1.
#
# (Quando estava ligado: 22:00 UTC = 19:00 em Brasília, todo dia, e a própria
# varredura ignorava sábado, domingo e feriado na hora de escolher o destino.)
on:
  # schedule:
  #   - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  varredura:
    runs-on: ubuntu-latest
    steps:
      - name: Passa pra Giovanna o que a Nilce deixou sem acao
        run: |
          curl -X GET "https://api.solardoc.app/cron/nilce-para-giovanna" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" -sS -w "\nHTTP %{http_code}\n"
