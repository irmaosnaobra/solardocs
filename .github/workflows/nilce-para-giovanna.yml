name: Varredura das 18h (Nilce)

# 21:00 UTC = 18:00 em Brasília. O Brasil não tem horário de verão, então o
# offset é fixo o ano inteiro. Roda todo dia — a própria varredura ignora
# sábado, domingo e feriado na hora de escolher o dia de destino.
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  varredura:
    runs-on: ubuntu-latest
    steps:
      - name: Fecha o dia da Nilce e empacota o que ficou sem ação
        run: |
          curl -X GET "https://api.solardoc.app/cron/nilce-18h" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" -sS -w "\nHTTP %{http_code}\n"
