name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: api — typecheck e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci

      # BLOQUEIA. Baseline em 10/09/2026 é 0 erro — então qualquer erro aqui é novo.
      # É o gate que faltava: `tsc` verde na sua máquina não prova que o COMMIT compila,
      # porque commit parcial deixa a dependência de fora.
      - name: tsc --noEmit
        run: npx tsc --noEmit

      # BLOQUEIA desde 03/11/2026: a suíte inteira está verde (367 arquivos, 11.010
      # testes), então vermelho aqui é regressão nova. Tempo estourado em máquina
      # carregada tem folga em api/vitest.config.ts; não afrouxe asserção.
      - name: vitest
        run: npx vitest run

  dashboard:
    name: dashboard — lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci

      # BLOQUEIA. Erro de lint derruba o CI. O backlog de erros do dashboard
      # fechou em 05/11/2026 (restam só avisos, que não falham). Regra que parecer
      # errada num caso pontual leva eslint-disable-next-line com o motivo escrito.
      - name: eslint
        run: npx eslint .
