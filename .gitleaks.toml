# Config do gitleaks para o solardocs.
#
# Além das regras padrão, cobre o buraco que o padrão NÃO pega: segredo escrito
# como INSTRUÇÃO dentro de documentação. Foi assim que o CRON_SECRET foi parar
# num arquivo público (SECURITY-RUNBOOK.md, achado em 10/09/2026).

[extend]
useDefault = true

# Gate que grita à toa é gate que ninguém lê. Fixture de teste nunca foi
# credencial, e `gitleaks dir` varre node_modules inteiro se deixarem.
[allowlist]
paths = [
  '''(^|/)__tests__/''',
  '''\.test\.ts$''',
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)\.next/''',
  '''(^|/)coverage/''',
]

[[rules]]
id = "segredo-em-documentacao"
description = "Valor de segredo escrito em texto puro dentro de doc/markdown"
# Palavra-chave + ate 2 palavras + ":" ou "=" + valor. Pega "Valor:", "valor novo:",
# "token atual =", "MCP_TOKEN novo:" e "secret (girado):". A regra antiga so casava
# "valor:" colado, e foi assim que o MCP_TOKEN ("valor novo:") passou.
regex = '''(?i)(valor|value|secret|token|senha|password|key)(?:[ \t]+[\p{L}_\-]+){0,2}[ \t]*[:=][ \t]*`?["']?([A-Za-z0-9+/_\-]{24,})["']?`?'''
secretGroup = 2
path = '''\.(md|txt|mdx)$'''
  [rules.allowlist]
  regexes = [
    '''\$\{\{''',
    '''process\.env''',
    '''(?i)(xxx|exemplo|example|placeholder|seu[-_]?token|cole[-_]?aqui|substituir|<.*>)''',
    '''(?i)sk_test_|pk_test_|rk_test_|whsec_test''',
  ]

[[rules]]
id = "segredo-de-cron-e-mcp-em-codigo"
description = "Valor literal atribuido a CRON_SECRET, MCP_TOKEN, JWT_SECRET ou GITHUB_CRON_SECRET em codigo"
# Atribuicao com valor literal entre aspas. Leitura de env pura (process.env.X, env.X) nao casa
# porque nao tem aspas logo depois do = / :. De proposito NAO ha allowlist para process.env:
# `process.env.X || 'literal'` e justamente o fallback hardcoded que vazou o segredo antes.
regex = '''(?i)\b(?:CRON_SECRET|MCP_TOKEN|JWT_SECRET|GITHUB_CRON_SECRET)\b["']?[ \t]*(?:=|:|\|\|)[ \t]*["'`]([^"'`\s]{8,})["'`]'''
secretGroup = 1
path = '''\.(js|ts|mjs|sh|yml|yaml)$'''
  [rules.allowlist]
  regexTarget = "line"
  regexes = [
    '''(?i)(falso-|fake|exemplo|example|xxx|placeholder)''',
    '''\$\{\{''',
  ]

[[rules]]
id = "url-supabase-com-chave"
description = "Chave publishable do Supabase fora dos lugares onde ela e publica de proposito"
regex = '''sb_publishable_[A-Za-z0-9_\-]{20,}'''
  [rules.allowlist]
  paths = [
    # Chave de navegador: ali ela e publica por natureza. O problema e RLS, nao a chave.
    '''dashboard/public/''',
    # A sonda PRECISA da chave: o ponto dela e perguntar de fora, como um estranho.
    '''api/scripts/conferir-rls-gerador\.ts''',
    # Scripts locais do consultor, nao rodam no servidor.
    '''worker-prospeccao/''',
    # O fallback documentado, ate a SUPABASE_GERADOR_SERVICE_KEY entrar na Vercel.
    '''api/src/utils/supabaseGerador\.ts''',
    '''api/src/services/agenda/criativoCompositor\.ts''',
  ]
