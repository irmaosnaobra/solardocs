<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="robots" content="noindex">
<title>SolarDoc Pro — Demonstração</title>

<!-- Vídeo no Cloudinary (conta v755hoio), não no Panda. Em 15/09/2026 o player
     do Panda estava entregando "Video playback not allowed" pra todo mundo que
     abria esta página, e o vídeo real não saía mais de lá. -->
<link rel="preconnect" href="https://res.cloudinary.com" crossorigin>

<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: #0a0a0a;
    color: #fff;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    min-height: 100vh;
    min-height: 100dvh;
  }

  .stage {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%, rgba(245,158,11,0.12) 0%, transparent 60%),
      #0a0a0a;
  }

  .player-col {
    width: 100%;
    /* Cap pela altura também: 9/16 ≈ 0.5625 → largura máxima = (vh − padding) × 0.5625 */
    max-width: min(420px, calc((100dvh - 48px) * 0.5625));
  }

  .player {
    position: relative;
    width: 100%;
    aspect-ratio: 9 / 16;
    background: #000;
    border-radius: 18px;
    overflow: hidden;
    box-shadow:
      0 25px 50px -10px rgba(0,0,0,0.8),
      0 0 0 1px rgba(245,158,11,0.18);
  }

  .player video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }

  /* Botão grande de play por cima da capa. O play nativo do iPhone é um
     triângulo pequeno no canto; aqui o toque é o quadro inteiro. Some no
     primeiro play e daí em diante valem os controles nativos. */
  .play {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    border: 0;
    padding: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 100%);
    color: #fff;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    font: inherit;
  }
  .play[hidden] { display: none; }
  .play-icon {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: linear-gradient(180deg, #F5A623 0%, #E8910F 100%);
    box-shadow: 0 12px 34px -8px rgba(245,158,11,0.7), inset 0 1px 0 rgba(255,255,255,0.35);
    transition: transform .15s ease;
  }
  .play-icon svg { width: 34px; height: 34px; margin-left: 5px; fill: #1a1205; }
  .play:active .play-icon { transform: scale(.94); }
  .play-label {
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.2px;
    padding: 7px 14px;
    border-radius: 999px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }

  @media (min-width: 760px) {
    .player-col { max-width: min(460px, calc((100dvh - 48px) * 0.5625)); }
  }

  /* CTA próprio (parent document) — navegação same-tab, funciona em iPhone/WhatsApp */
  .cta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 16px;
    padding: 16px 20px;
    width: 100%;
    border-radius: 14px;
    background: linear-gradient(180deg, #F5A623 0%, #E8910F 100%);
    color: #1a1205;
    font-weight: 800;
    font-size: 17px;
    letter-spacing: 0.2px;
    text-decoration: none;
    box-shadow: 0 10px 30px -8px rgba(245,158,11,0.55), inset 0 1px 0 rgba(255,255,255,0.35);
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s ease, box-shadow .12s ease, opacity .5s ease;
    /* Escondido até o vídeo chegar em ~02:40 (revelado via JS pela timeline) */
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
    /* Ocupa espaço só quando revelado */
    display: none;
  }
  .cta.is-visible {
    display: flex;
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
    animation: ctaIn .5s ease forwards;
  }
  .cta:active { transform: scale(.98); }
  .cta .arrow { font-size: 18px; line-height: 1; transition: transform .15s ease; }
  .cta:hover .arrow { transform: translateX(3px); }
  @keyframes ctaIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @media (hover: none) { .cta:hover .arrow { transform: none; } }
</style>
</head>
<body>

<main class="stage">
  <div class="player-col">
    <div class="player">
      <!-- preload="metadata": a página existe só pra este vídeo, então vale
           buscar o cabeçalho (duração, primeiro quadro) já na chegada. O mp4
           tem faststart, é pouco byte. O vídeo inteiro só desce no play. -->
      <video
        id="vsl"
        src="https://res.cloudinary.com/v755hoio/video/upload/v1789501262/solardoc/vsl-apresentacao.mp4"
        poster="https://res.cloudinary.com/v755hoio/image/upload/f_auto,q_auto/v1789501266/solardoc/vsl-apresentacao-capa.jpg"
        preload="metadata"
        controls
        playsinline
        webkit-playsinline
        controlslist="nodownload noplaybackrate"
        disablepictureinpicture></video>
      <!-- Nasce escondido e com o vídeo em controles nativos: se o JS não
           rodar, a pessoa ainda assiste. O script liga o botão grande. -->
      <button class="play" id="play" type="button" aria-label="Assistir a demonstração" hidden>
        <span class="play-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.6-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14z"/></svg></span>
        <span class="play-label">Assistir a demonstração · 7 min</span>
      </button>
    </div>

    <!-- CTA próprio: navegação same-tab (funciona em iPhone/WhatsApp).
         Destino = seção de planos da LP (#planos), onde a pessoa escolhe
         mensal ou anual e já cai no checkout. Não é /assinar: aquela tela só
         tem o mensal e é a do link com cupom. -->
    <a class="cta" id="cta" href="/#planos">
      Quero começar agora <span class="arrow">→</span>
    </a>
  </div>
</main>

<script>
  // ===== Tracking de visita na VSL =====
  (function () {
    try {
      const STORAGE_KEY = 'solardoc_session_id';
      let sid = localStorage.getItem(STORAGE_KEY);
      if (!sid) {
        sid = (crypto.randomUUID && crypto.randomUUID()) || (Date.now() + '-' + Math.random().toString(36).slice(2));
        localStorage.setItem(STORAGE_KEY, sid);
      }
      const qs = new URLSearchParams(location.search);

      // Repassa UTMs/parâmetros da VSL pro CTA, sem perder mode/plano nem o #planos
      try {
        const cta = document.getElementById('cta');
        if (cta && [...qs.keys()].length) {
          const url = new URL(cta.getAttribute('href'), location.origin);
          qs.forEach((v, k) => { if (!url.searchParams.has(k)) url.searchParams.set(k, v); });
          cta.setAttribute('href', url.pathname + url.search + url.hash);
        }
      } catch {}

      fetch('/_api/_t/v', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: sid,
          landing_url: '/apresentacao',
          referrer: document.referrer || null,
          utm_source: qs.get('utm_source'),
          utm_medium: qs.get('utm_medium'),
          utm_campaign: qs.get('utm_campaign'),
          utm_content: qs.get('utm_content'),
          utm_term: qs.get('utm_term'),
        }),
        keepalive: true,
      }).catch(() => {});
    } catch {}
  })();
</script>

<script>
  // ===== Player nativo: play, CTA aos 02:40 e ida pra oferta no fim =====
  // REVEAL_AT é o segundo em que o botão aparece. Ajustado pra este vídeo em
  // 30d94fb2 (era 04:30). Pra mudar, é só este número.
  (function () {
    const REVEAL_AT = 160;      // 02:40
    const IR_NO_FIM_MS = 1200;  // pausa curta pra pessoa ver pra onde vai

    const video = document.getElementById('vsl');
    const play = document.getElementById('play');
    const cta = document.getElementById('cta');
    if (!video || !cta) return;

    function sid() {
      try { return localStorage.getItem('solardoc_session_id'); } catch { return null; }
    }

    // Mesmo endpoint e mesmo formato da LP (lp_events). `lp` separa esta
    // página do vídeo do eletroposto na mesma tabela. keepalive porque o
    // clique no CTA sai da página logo em seguida.
    function evento(tipo, dados) {
      const s = sid();
      if (!s) return;
      try {
        fetch('/_api/_t/e', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: s, event_type: tipo, event_data: Object.assign({ lp: 'apresentacao' }, dados) }),
          keepalive: true,
        }).catch(() => {});
      } catch {}
    }

    const marcos = {};
    function marco(acao) {
      if (marcos[acao]) return;
      marcos[acao] = true;
      evento('vsl', { acao: acao });
    }

    let revelado = false;
    function revelar() {
      if (revelado) return;
      revelado = true;
      cta.classList.add('is-visible');
    }

    // Play com som, no toque. Sem autoplay: ele só funciona mudo, e esta
    // demonstração é falada.
    if (play) {
      video.controls = false;
      play.hidden = false;
      play.addEventListener('click', function () {
        video.controls = true;
        const p = video.play();
        if (p && p.catch) p.catch(function () { play.hidden = false; });
      });
    }

    video.addEventListener('play', function () {
      if (play) play.hidden = true;
      video.controls = true;
      marco('play');
    });

    video.addEventListener('timeupdate', function () {
      const t = video.currentTime;
      if (t >= REVEAL_AT) revelar();
      if (video.duration && t >= video.duration / 2) marco('metade');
    });

    // Vídeo que não carrega não pode virar beco sem saída: botão aparece na hora.
    video.addEventListener('error', revelar);

    cta.addEventListener('click', function () {
      evento('vsl_cta', { origem: 'botao', segundo: Math.round(video.currentTime || 0) });
    });

    // Terminou o vídeo → vai sozinho pra oferta, com as UTMs que o CTA já leva.
    video.addEventListener('ended', function () {
      marco('fim');
      revelar();
      cta.firstChild.textContent = 'Indo para a oferta… ';
      evento('vsl_cta', { origem: 'fim', segundo: Math.round(video.duration || 0) });
      setTimeout(function () { location.href = cta.getAttribute('href'); }, IR_NO_FIM_MS);
    });
  })();
</script>

  <script src="/lib/telemetria.js" defer></script>
</body>
</html>
