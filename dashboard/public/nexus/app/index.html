<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal do Parceiro NEXUS</title>
<meta name="description" content="Portal do Parceiro NEXUS Eletropostos: propostas de carregadores rápidos com o logo da sua empresa.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1A2B">
<link rel="icon" href="/nexus/favicon.ico">
<link rel="apple-touch-icon" href="/nexus/img/icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<noscript><p style="padding:24px">Ative o JavaScript para usar o Portal do Parceiro NEXUS.</p></noscript>

<script src="/nexus/app/js/calc.js" defer></script>
