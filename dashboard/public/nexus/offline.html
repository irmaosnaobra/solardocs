<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1A2B">
<title>Sem conexão · NEXUS Parceiro</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #0B1A2B; color: #fff; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
  h1 { margin: 0; font-size: 22px; line-height: 1.25; }
  p { margin: 0; max-width: 320px; font-size: 15px; line-height: 1.5; color: #C9D3E0; }
  button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 10px; background: #39FF14; color: #0B1A2B; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Você está sem conexão</h1>
  <p>O portal precisa da internet para mostrar os seus dados. Confira o sinal e tente de novo.</p>
  <button type="button" onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
