<!-- Acesso de teste do dono: utm_source=raio-x-teste no primeiro toque. Nesse caso a página NÃO carrega o pixel do Meta nem manda os
     beacons /_t/v e /_t/e (o POST do quiz segue igual; o servidor grava teste=sim e não manda o CAPI). Esta é a ÚNICA função que decide,
     lida pelos três pontos de rastreio (pixel aqui, post() e fb() no script "rastreio"). Lê o primeiro toque como o "rastreio" captura:
     o valor guardado na sessão (sd_lp_utms) E a URL de agora: com raio-x-teste em qualquer um dos dois é teste, e erro no sessionStorage não muda isso. -->
<script>
function ehTeste(){
  var TESTE = 'raio-x-teste';
  /* Dois blocos separados: erro na leitura da URL nao muda o resultado da sessao, e erro do sessionStorage nao muda o da URL. */
  var daUrl = false, guardado = false;
  try { daUrl = String(new URLSearchParams(location.search).get('utm_source') || '').toLowerCase() === TESTE; } catch (e) { daUrl = false; }
  try {
    var salvo = sessionStorage.getItem('sd_lp_utms');
    if (salvo) { var j = JSON.parse(salvo); guardado = !!j && typeof j === 'object' && String(j.utm_source || '').toLowerCase() === TESTE; }
  } catch (e) { guardado = false; }
  return daUrl || guardado;
}
</script>

<script id="rastreio">
(function () {
'use strict';
/* Rastreio da página do vídeo. Mesmas chaves de sessão da landing (useLpTracking.ts), para a venda voltar para esta página. */
var API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://localhost:3001' : '/_api';
var SK_SESSION = 'sd_lp_session', SK_VISIT = 'sd_vsl_visit_sent', SK_UTMS = 'sd_lp_utms', SK_FBC = 'sd_lp_fbc', SK_FBP = 'sd_lp_fbp';
var UTM_KEYS = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'];
function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch (e) { /* sem armazenamento: segue sem */ } return null; }
function uuid() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) { var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3) | 8).toString(16); });
}
var sid = ss(SK_SESSION);
if (!sid) { sid = uuid(); ss(SK_SESSION, sid); }
/* UTM do primeiro toque da sessão */
var utm = {};
(function () {
  try {
    var salvo = ss(SK_UTMS);
    if (salvo) { var j = JSON.parse(salvo); if (j && typeof j === 'object') { utm = j; return; } }
    var p = new URLSearchParams(location.search);
    UTM_KEYS.forEach(function (k) { var v = p.get(k); if (v) utm[k] = v.slice(0, 200); });
    if (Object.keys(utm).length) ss(SK_UTMS, JSON.stringify(utm));
  } catch (e) { utm = {}; }
})();
function cookie(n) { var m = document.cookie.match(new RegExp('(?:^|; )' + n + '=([^;]*)')); return m ? decodeURIComponent(m[1]) : ''; }
function metaIds() {
  var o = {};
  try {
    var fbc = cookie('_fbc'), fbp = cookie('_fbp');
    var fbclid = new URLSearchParams(location.search).get('fbclid');
    if (!fbc && fbclid) fbc = 'fb.1.' + Date.now() + '.' + fbclid.slice(0, 300);
    if (fbc) { o.fbc = fbc; ss(SK_FBC, fbc); } else { var c = ss(SK_FBC); if (c) o.fbc = c; }
    if (fbp) { o.fbp = fbp; ss(SK_FBP, fbp); } else { var p = ss(SK_FBP); if (p) o.fbp = p; }
  } catch (e) { /* cookie indisponível */ }
  return o;
}
function post(path, body) {
  if (ehTeste()) return;   /* acesso de teste: nenhum beacon (/_t/v, /_t/e) */
  try { fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), keepalive: true }).catch(function () {}); } catch (e) { /* o rastreio nunca derruba a página */ }
}
if (!ss(SK_VISIT)) {
  var v = { session_id: sid, landing_url: location.href, referrer: document.referrer || null };
  UTM_KEYS.forEach(function (k) { if (utm[k]) v[k] = utm[k]; });
  post('/_t/v', v);
  ss(SK_VISIT, '1');
}
var PL = Date.now(), SEQ = 0;
function evento(tipo, dados) {
  post('/_t/e', { session_id: sid, event_type: tipo, event_data: Object.assign({ lp: 'solardoc_vsl', caminho: 'vsl', pl: PL, seq: ++SEQ }, dados || {}) });
}
function fb(tipo, nome, params, opcoes) {
  try { if (ehTeste() || !window.fbq) return; if (opcoes) window.fbq(tipo, nome, params || {}, opcoes); else window.fbq(tipo, nome, params || {}); } catch (e) { /* pixel bloqueado */ }
}
var ALFA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function codigoLocal() {
  var b = new Uint8Array(4), s = '';
  try { crypto.getRandomValues(b); } catch (e) { for (var i = 0; i < 4; i++) b[i] = Math.random() * 256; }
  for (var k = 0; k < 4; k++) s += ALFA.charAt(b[k] % ALFA.length);
  return 'SD-' + s;
}
/* Guarda a saída do checkout como src/lib/saidaCheckout.ts (só o caminho; 2 h de validade lá) */
function marcarSaida(destino) {
  if (!destino) return;
  try { var u = new URL(destino, location.origin); sessionStorage.setItem('sd-saida-checkout', JSON.stringify({ destino: u.pathname + u.search, em: Date.now() })); } catch (e) { /* segue sem o resgate */ }
}
window.SDR = { api: API, sid: sid, utm: function () { return utm; }, meta: metaIds, evento: evento, fb: fb, novoId: function () { return 'sd_' + uuid(); }, codigoLocal: codigoLocal, marcarSaida: marcarSaida, utmKeys: UTM_KEYS };
})();
</script>
<script id="vsl-pagina">
(function () {
'use strict';
const $ = (id) => document.getElementById(id);
const SDR = window.SDR;
const ESPERA_FIM = 5000;

/* Destino: a LP da raiz, na seção de planos (id="planos" em Landing.tsx), com a query ORIGINAL da chegada.
   A query é guardada na 1ª chegada da sessão; o sd_dest sai, porque /?sd_dest=quiz redireciona para o /diagnostico. */
const SK_QUERY = 'sd_vsl_query';
function queryOriginal() {
  let q = '';
  try { q = location.search || ''; } catch (e) { q = ''; }
  try {
    if (q) sessionStorage.setItem(SK_QUERY, q);
    else q = sessionStorage.getItem(SK_QUERY) || '';
  } catch (e) { /* sem armazenamento: vale a URL de agora */ }
  return q;
}
const QUERY_CHEGADA = queryOriginal();
function destinoLP() {
  let qs = '';
  try { const p = new URLSearchParams(QUERY_CHEGADA); p.delete('sd_dest'); qs = p.toString(); } catch (e) { qs = ''; }
  return '/' + (qs ? '?' + qs : '') + '#planos';
}

let espera = 0;
function cancelaFaixa() {
  if (espera) { clearTimeout(espera); espera = 0; }
  const fx = $('faixa'); if (fx) fx.hidden = true;
}
/* Vai para a LP. A LP dispara o Lead e o InitiateCheckout dela: aqui não. */
function irLP(origem) {
  if (espera) { clearTimeout(espera); espera = 0; }
  SDR.evento('clique_lp', { origem });
  window.location.href = destinoLP();
}

const v = $('vsl-v');
const feitos = {};
const marco = (nome) => { if (feitos[nome]) return; feitos[nome] = 1; SDR.evento(nome, {}); };
v.addEventListener('play', () => {
  if (!feitos.vsl_play) SDR.fb('track', 'ViewContent', { content_name: 'vsl_solardoc' });
  marco('vsl_play'); v.controls = true;
  const b = $('vsl-play'); if (b) b.hidden = true;
  cancelaFaixa();
});
/* Cada marco usa >=: um salto de busca dispara os que ficaram para trás, uma vez só */
v.addEventListener('timeupdate', () => {
  if (!v.duration || !isFinite(v.duration)) return;
  const p = v.currentTime / v.duration * 100;
  if (p >= 25) marco('vsl_25');
  if (p >= 50) marco('vsl_50');
  if (p >= 75) marco('vsl_75');
});
/* Arrastar a barra depois do fim cancela a ida automática */
v.addEventListener('seeking', cancelaFaixa);
let ficou = false;
v.addEventListener('ended', () => {
  marco('vsl_25'); marco('vsl_50'); marco('vsl_75'); marco('vsl_fim');
  if (ficou) return; /* Quem tocou "Ficar aqui" não é levado de novo */
  const fx = $('faixa'); if (fx) fx.hidden = false;
  if (espera) clearTimeout(espera);
  espera = setTimeout(() => { espera = 0; irLP('fim_video'); }, ESPERA_FIM);
});
function tocarVideo() {
  v.muted = false; v.volume = 1;
  try { const p = v.play(); if (p && p.catch) p.catch(() => { const b = $('vsl-play'); if (b) b.hidden = false; v.controls = true; }); } catch (e) { v.controls = true; }
}

/* Botão fixo do rodapé: só aparece depois que o botão principal sai da tela */
const alvo = $('btn-lp'), rod = $('rodape');
if (typeof IntersectionObserver !== 'undefined') {
  new IntersectionObserver((es) => { es.forEach((e) => { rod.hidden = e.isIntersecting; }); }, { root: $('corpo'), threshold: 0.6 }).observe(alvo);
}

$('app').addEventListener('click', (e) => {
  const t = e.target.closest('[data-a]');
  if (!t) return;
  const a = t.getAttribute('data-a');
  if (a === 'play') tocarVideo();
  else if (a === 'lp') irLP(t.id === 'btn-fixo' ? 'rodape' : 'botao');
  else if (a === 'ficar') { ficou = true; cancelaFaixa(); }
});
/* Voltou da LP pelo botão do navegador: a página pode vir do cache com a faixa ligada */
window.addEventListener('pageshow', (e) => { if (e.persisted) cancelaFaixa(); });
})();
</script>
