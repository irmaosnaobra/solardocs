<!-- Acesso de teste do dono: utm_source=raio-x-teste no primeiro toque. Nesse caso a página NÃO carrega o pixel do Meta nem manda os
     beacons /_t/v e /_t/e (o POST do quiz segue igual; o servidor grava teste=sim e não manda o CAPI). Esta é a ÚNICA função que decide,
     lida pelos três pontos de rastreio (pixel aqui, post() e fb() no script "rastreio"). Lê o primeiro toque como o "rastreio" captura:
     o valor guardado na sessão (sd_lp_utms) E a URL de agora: com raio-x-teste em qualquer um dos dois é teste, e erro no sessionStorage não muda isso. -->
<script>
function ehTeste(){
  var TESTE = 'raio-x-teste';
  /* Dois blocos separados: erro na leitura da URL nao muda o resultado da sessao, e erro do sessionStorage nao muda o da URL. */
  var daUrl = false, guardado = false;
  try { daUrl = String(new URLSearchParams(location.search).get('utm_source') || '').toLowerCase() === TESTE; } catch (e) { daUrl = false; }
  try {
    var salvo = sessionStorage.getItem('sd_lp_utms');
    if (salvo) { var j = JSON.parse(salvo); guardado = !!j && typeof j === 'object' && String(j.utm_source || '').toLowerCase() === TESTE; }
  } catch (e) { guardado = false; }
  return daUrl || guardado;
}
</script>

<script id="rastreio">
(function () {
'use strict';
/* Rastreio da página do vídeo. Mesmas chaves de sessão da landing (useLpTracking.ts), para a venda voltar para esta página. */
var API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://localhost:3001' : '/_api';
var SK_SESSION = 'sd_lp_session', SK_VISIT = 'sd_vsl_visit_sent', SK_UTMS = 'sd_lp_utms', SK_FBC = 'sd_lp_fbc', SK_FBP = 'sd_lp_fbp';
var UTM_KEYS = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term'];
function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch (e) { /* sem armazenamento: segue sem */ } return null; }
function uuid() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) { var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3) | 8).toString(16); });
}
var sid = ss(SK_SESSION);
if (!sid) { sid = uuid(); ss(SK_SESSION, sid); }
/* UTM do primeiro toque da sessão */
var utm = {};
(function () {
  try {
    var salvo = ss(SK_UTMS);
    if (salvo) { var j = JSON.parse(salvo); if (j && typeof j === 'object') { utm = j; return; } }
    var p = new URLSearchParams(location.search);
    UTM_KEYS.forEach(function (k) { var v = p.get(k); if (v) utm[k] = v.slice(0, 200); });
    if (Object.keys(utm).length) ss(SK_UTMS, JSON.stringify(utm));
  } catch (e) { utm = {}; }
})();
function cookie(n) { var m = document.cookie.match(new RegExp('(?:^|; )' + n + '=([^;]*)')); return m ? decodeURIComponent(m[1]) : ''; }
function metaIds() {
  var o = {};
  try {
    var fbc = cookie('_fbc'), fbp = cookie('_fbp');
    var fbclid = new URLSearchParams(location.search).get('fbclid');
    if (!fbc && fbclid) fbc = 'fb.1.' + Date.now() + '.' + fbclid.slice(0, 300);
    if (fbc) { o.fbc = fbc; ss(SK_FBC, fbc); } else { var c = ss(SK_FBC); if (c) o.fbc = c; }
    if (fbp) { o.fbp = fbp; ss(SK_FBP, fbp); } else { var p = ss(SK_FBP); if (p) o.fbp = p; }
  } catch (e) { /* cookie indisponível */ }
  return o;
}
function post(path, body) {
  if (ehTeste()) return;   /* acesso de teste: nenhum beacon (/_t/v, /_t/e) */
  try { fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), keepalive: true }).catch(function () {}); } catch (e) { /* o rastreio nunca derruba a página */ }
}
if (!ss(SK_VISIT)) {
  var v = { session_id: sid, landing_url: location.href, referrer: document.referrer || null };
  UTM_KEYS.forEach(function (k) { if (utm[k]) v[k] = utm[k]; });
  post('/_t/v', v);
  ss(SK_VISIT, '1');
}
var PL = Date.now(), SEQ = 0;
function evento(tipo, dados) {
  post('/_t/e', { session_id: sid, event_type: tipo, event_data: Object.assign({ lp: 'solardoc_vsl', caminho: 'vsl', pl: PL, seq: ++SEQ }, dados || {}) });
}
function fb(tipo, nome, params, opcoes) {
  try { if (ehTeste() || !window.fbq) return; if (opcoes) window.fbq(tipo, nome, params || {}, opcoes); else window.fbq(tipo, nome, params || {}); } catch (e) { /* pixel bloqueado */ }
}
var ALFA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function codigoLocal() {
  var b = new Uint8Array(4), s = '';
  try { crypto.getRandomValues(b); } catch (e) { for (var i = 0; i < 4; i++) b[i] = Math.random() * 256; }
  for (var k = 0; k < 4; k++) s += ALFA.charAt(b[k] % ALFA.length);
  return 'SD-' + s;
}
/* Guarda a saída do checkout como src/lib/saidaCheckout.ts (só o caminho; 2 h de validade lá) */
function marcarSaida(destino) {
  if (!destino) return;
  try { var u = new URL(destino, location.origin); sessionStorage.setItem('sd-saida-checkout', JSON.stringify({ destino: u.pathname + u.search, em: Date.now() })); } catch (e) { /* segue sem o resgate */ }
}
window.SDR = { api: API, sid: sid, utm: function () { return utm; }, meta: metaIds, evento: evento, fb: fb, novoId: function () { return 'sd_' + uuid(); }, codigoLocal: codigoLocal, marcarSaida: marcarSaida, utmKeys: UTM_KEYS };
})();
</script>
<script id="vsl-pagina">
(function () {
'use strict';
const $ = (id) => document.getElementById(id);
const SDR = window.SDR;
const ESPERA_FIM = 5000;
const DURACAO_PADRAO = 383;     /* segundos: vale quando o navegador não informa a duração */
const CTA_ANTES_DO_FIM = 40;    /* o botão da LP só aparece nos últimos 40 s */
const TRAVA_MS = 10000, SEM_PLAY_MS = 30000;   /* vídeo parado 10 s sem andar, ou autoplay barrado 30 s sem play */
const MIN_ASSISTIDO = 5;        /* segundos de reprodução real nesta visita antes de contar vsl_25/50/75 */
const SK_POS = 'sd_vsl3_pos', SK_CTA = 'sd_vsl3_cta';
const lerLS = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const gravarLS = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* sem armazenamento: a página segue funcionando */ } };
const apagarLS = (k) => { try { localStorage.removeItem(k); } catch (e) { /* idem */ } };

/* Destino: a LP da raiz, na seção de planos (id="planos" em Landing.tsx), com a query ORIGINAL da chegada.
   A query é guardada na 1ª chegada da sessão; o sd_dest sai, porque /?sd_dest=quiz redireciona para o /diagnostico. */
const SK_QUERY = 'sd_vsl_query';
function queryOriginal() {
  let q = '';
  try { q = location.search || ''; } catch (e) { q = ''; }
  try {
    if (q) sessionStorage.setItem(SK_QUERY, q);
    else q = sessionStorage.getItem(SK_QUERY) || '';
  } catch (e) { /* sem armazenamento: vale a URL de agora */ }
  return q;
}
const QUERY_CHEGADA = queryOriginal();
function destinoLP() {
  let qs = '';
  try { const p = new URLSearchParams(QUERY_CHEGADA); p.delete('sd_dest'); qs = p.toString(); } catch (e) { qs = ''; }
  return '/' + (qs ? '?' + qs : '') + '#planos';
}

let espera = 0;
function cancelaFaixa() {
  if (espera) { clearTimeout(espera); espera = 0; }
  const fx = $('faixa'); if (fx) fx.hidden = true;
}
/* Vai para a LP. A LP dispara o Lead e o InitiateCheckout dela: aqui não. */
function irLP(origem) {
  if (espera) { clearTimeout(espera); espera = 0; }
  SDR.evento('clique_lp', { origem });
  window.location.href = destinoLP();
}

const v = $('vsl-v');
const feitos = {};
const marco = (nome, dados) => { if (feitos[nome]) return; feitos[nome] = 1; SDR.evento(nome, dados || {}); };
const duracao = () => (isFinite(v.duration) && v.duration > 0 ? v.duration : DURACAO_PADRAO);

/* Camadas do player. estado: mudo (autoplay mudo), bloqueado (navegador barrou o autoplay), som, pausado, pergunta (retomada), fim */
const cam = { som: $('cam-som'), play: $('cam-play'), pausa: $('cam-pausa'), retoma: $('cam-retoma') };
let estado = 'mudo';
function camadas(qual) { Object.keys(cam).forEach((k) => { cam[k].hidden = k !== qual; }); }

/* Barra de progresso: 1 - (1 - p)^2 anda rápido no começo e devagar no fim. Não é clicável. */
const barra = $('vsl-barra-i');
function pintaBarra() {
  const p = Math.min(1, Math.max(0, v.currentTime / duracao()));
  barra.style.width = ((1 - Math.pow(1 - p, 2)) * 100).toFixed(2) + '%';
}

/* Botão da LP e botão fixo: escondidos até 40 s antes do fim */
const alvo = $('btn-lp'), rod = $('rodape'), acao = $('acao');
let ctaVisivel = false, alvoNaTela = false;
function atualizaRodape() { rod.hidden = !ctaVisivel || alvoNaTela; }
/* motivo: tempo (40 s antes do fim), erro (o vídeo falhou), travou (parado 10 s sem andar) ou sem_play (autoplay barrado e ninguém tocou em 30 s) */
function mostrarCta(motivo, restaurado) {
  if (ctaVisivel) return;
  ctaVisivel = true;
  acao.hidden = false;
  if (!restaurado) { acao.classList.add('entra'); rod.classList.add('entra'); }
  gravarLS(SK_CTA, '1');
  marco('vsl_cta_mostrou', restaurado ? { motivo, restaurado: true } : { motivo });
  atualizaRodape();
}
if (typeof IntersectionObserver !== 'undefined') {
  new IntersectionObserver((es) => { es.forEach((e) => { alvoNaTela = e.isIntersecting; atualizaRodape(); }); }, { root: $('corpo'), threshold: 0.6 }).observe(alvo);
}
if (lerLS(SK_CTA) === '1') mostrarCta('tempo', true);

/* Continuar de onde parou */
let ultimoSalvo = 0;
function salvaPos() {
  const t = v.currentTime;
  if (!(t > 0) || v.ended) return;
  ultimoSalvo = t;
  gravarLS(SK_POS, String(Math.floor(t)));
}
const posSalva = Number(lerLS(SK_POS)) || 0;
let retomar = posSalva > 20 && posSalva < DURACAO_PADRAO - 3;

/* Toque que liga o som: volta ao 0 (autoplay mudo) ou segue do ponto atual (retomada) */
function ligarSom(de) {
  if (typeof de === 'number') v.currentTime = de;
  v.muted = false; v.volume = 1;
  estado = 'som';
  camadas('');
  const p = v.play();
  if (p && p.then) p.then(somAceito, () => { estado = 'bloqueado'; camadas('play'); armaSemPlay(); });
  pintaBarra();
}
/* O play com som foi aceito: só agora saem o ViewContent do pixel e o vsl_som */
function somAceito() {
  if (v.muted) return;
  if (!feitos.vc) { feitos.vc = 1; SDR.fb('track', 'ViewContent', { content_name: 'vsl_solardoc' }); }
  marco('vsl_som');
}
/* Autoplay barrado e ninguém deu play em 30 s: o botão da LP aparece. Pausa feita pela pessoa (estado pausado) não entra aqui. */
let semPlay = 0;
function armaSemPlay() {
  if (semPlay) clearTimeout(semPlay);
  semPlay = setTimeout(() => { semPlay = 0; if (estado === 'bloqueado') mostrarCta('sem_play'); }, SEM_PLAY_MS);
}
function bloqueado() { if (estado !== 'mudo') return; estado = 'bloqueado'; camadas('play'); armaSemPlay(); }
let iniciou = false;
function iniciar() {
  iniciou = true;
  if (retomar) { estado = 'pergunta'; camadas('retoma'); try { v.pause(); } catch (e) { /* segue */ } return; }
  camadas('som');
  const p = v.play(); if (p && p.catch) p.catch(bloqueado);
  setTimeout(() => { if (v.paused && estado === 'mudo' && !v.ended) bloqueado(); }, 2500);
}

/* Posição guardada perto do fim não vale: começa do zero. Roda quando a duração chega, ou já, se o vídeo veio do cache. */
function checaRetomada() {
  if (!retomar || !(posSalva >= duracao() - 3)) return;
  retomar = false; apagarLS(SK_POS);
  if (iniciou) { estado = 'mudo'; v.currentTime = 0; iniciar(); }
}
v.addEventListener('loadedmetadata', checaRetomada);
if (v.readyState >= 1) checaRetomada();
v.addEventListener('play', () => {
  if (estado === 'pergunta') { try { v.pause(); } catch (e) { /* segue */ } return; }  /* o autoplay não pode andar atrás da pergunta */
  marco('vsl_play');
  if (estado === 'pausado') estado = 'som';
  if (estado === 'bloqueado' && v.muted) { estado = 'mudo'; camadas('som'); }   /* o vídeo andou mudo: a camada do som volta */
  else { cam.pausa.hidden = true; cam.play.hidden = true; }
  cancelaFaixa();
});
v.addEventListener('pause', () => {
  if (estado === 'som' && !v.ended) { estado = 'pausado'; camadas('pausa'); }
});
/* Falha do vídeo: sem caminho para a LP a pessoa ficaria presa. O botão aparece quando o vídeo dá erro, ou fica 10 s parado esperando dados. */
v.addEventListener('error', () => mostrarCta('erro'));
let travaTimer = 0, travaT = 0;
function limpaTrava() { if (travaTimer) { clearTimeout(travaTimer); travaTimer = 0; } }
function armaTrava() {
  if (travaTimer) return;
  travaT = v.currentTime;
  travaTimer = setTimeout(() => {
    travaTimer = 0;
    if (!v.ended && Math.abs(v.currentTime - travaT) < 0.5 && estado !== 'pausado' && estado !== 'pergunta') mostrarCta('travou');  /* pausa da própria pessoa não conta */
  }, TRAVA_MS);
}
v.addEventListener('waiting', armaTrava);
v.addEventListener('stalled', armaTrava);
['playing', 'pause', 'ended'].forEach((n) => v.addEventListener(n, limpaTrava));
/* Sem nenhum dado depois de 10 s (requisição pendurada nem sempre dispara waiting): conta como travado */
setTimeout(() => { if (v.readyState === 0 && !v.error) mostrarCta('travou'); }, TRAVA_MS);
v.addEventListener('playing', () => { if (!v.muted) somAceito(); });
/* Os marcos contam pelo tempo REAL do vídeo, não pela barra, e só depois de MIN_ASSISTIDO s de reprodução contínua nesta visita
   (quem retoma do meio não dispara os marcos que já tinha passado). Cada um usa >=. */
let assistido = 0, ultimoT = 0;
v.addEventListener('seeking', () => { ultimoT = v.currentTime; });
v.addEventListener('timeupdate', () => {
  pintaBarra();
  const d = duracao(), t = v.currentTime, p = t / d * 100;
  const dt = t - ultimoT; ultimoT = t;
  if (dt > 0 && dt < 1.5) assistido += dt;
  if (travaTimer && Math.abs(t - travaT) >= 0.5) limpaTrava();
  if (assistido >= MIN_ASSISTIDO) {
    if (p >= 25) marco('vsl_25');
    if (p >= 50) marco('vsl_50');
    if (p >= 75) marco('vsl_75');
  }
  if (t >= d - CTA_ANTES_DO_FIM) mostrarCta('tempo');
  if (Math.abs(t - ultimoSalvo) >= 5) salvaPos();
});
/* Arrastar a barra depois do fim cancela a ida automática */
v.addEventListener('seeking', cancelaFaixa);
let ficou = false;
v.addEventListener('ended', () => {
  estado = 'fim'; camadas('');
  apagarLS(SK_POS); ultimoSalvo = 0;
  barra.style.width = '100%';
  mostrarCta('tempo');
  if (assistido >= MIN_ASSISTIDO) { marco('vsl_25'); marco('vsl_50'); marco('vsl_75'); }
  marco('vsl_fim');
  if (ficou) return; /* Quem tocou "Ficar aqui" não é levado de novo */
  const fx = $('faixa'); if (fx) fx.hidden = false;
  if (espera) clearTimeout(espera);
  espera = setTimeout(() => { espera = 0; irLP('fim_video'); }, ESPERA_FIM);
});
/* Um toque no vídeo pausa; depois do fim, toca de novo */
v.addEventListener('click', () => {
  if (estado === 'som' && !v.paused) v.pause();
  else if (estado === 'fim') { estado = 'som'; v.muted = false; v.volume = 1; v.currentTime = 0; v.play(); }
});
/* Sem busca pelo teclado: só com o foco dentro do player */
$('vsl').addEventListener('keydown', (e) => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End', 'PageUp', 'PageDown', 'j', 'J', 'l', 'L', 'k', 'K'].indexOf(e.key) >= 0 || /^[0-9]$/.test(e.key)) e.preventDefault();
});
window.addEventListener('pagehide', salvaPos);

$('app').addEventListener('click', (e) => {
  const t = e.target.closest('[data-a]');
  if (!t) return;
  const a = t.getAttribute('data-a');
  if (a === 'som') ligarSom(0);
  else if (a === 'tocar') ligarSom();
  else if (a === 'retomar') { estado = 'som'; v.play(); }
  else if (a === 'continuar') { SDR.evento('vsl_retomou', { de: Math.floor(posSalva) }); retomar = false; ligarSom(posSalva); }
  else if (a === 'inicio') { retomar = false; apagarLS(SK_POS); ligarSom(0); }
  else if (a === 'lp') irLP(t.id === 'btn-fixo' ? 'rodape' : 'botao');
  else if (a === 'ficar') { ficou = true; cancelaFaixa(); }
});
/* Voltou da LP pelo botão do navegador: a página pode vir do cache com a faixa ligada */
window.addEventListener('pageshow', (e) => { if (e.persisted) cancelaFaixa(); });
iniciar();
})();
</script>
</body>
