<!--
  QUIZ SOLAR (07/10/2026). O molde do quiz do eletroposto aplicado ao solar.

  A página PERGUNTA. Quem decide o caminho (vistoria, videochamada ou ligação),
  quem atende e quais horários aparecem é o servidor (api/src/services/io/
  solarQuiz.ts + solarRota.ts), no passo do WhatsApp. Por isso não existe aqui
  cópia de grade, de corte de kWh nem de raio: a vitrine e a gravação são a mesma
  conta e não têm como discordar.

  O que ficou no navegador é o que é da página: a ordem das perguntas (PASSOS),
  o desenho, o portão de presença e o rastreio por pergunta (lp_events com
  lp:'solar', o mesmo formato do eletroposto). O simulador antigo mora em
  /io/solar/simulador.

  Regras herdadas do eletroposto que já custaram teste: uma pergunta por tela,
  escolher não avança (avança o Continuar), o telefone vem antes do horário (é
  ele que acha o dono do cliente), o horário é o último passo e só dois dias
  aparecem na vitrine.
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  /* Fundo azul escuro, invertido (09/10/2026, pedido do Thiago): fundo marinho,
     texto claro, e o dourado da marca nos destaques e no botão principal. */
  :root{
    --bg:#0A1A33; --bg-2:#0F2A52; --surface:#122E58; --surface-2:#173765;
    --linha:rgba(255,255,255,.14); --linha-forte:rgba(255,255,255,.26);
    --text:#EEF3FB; --mut:#B6C3DA; --soft:#8EA0C0;
    --gold:#E3AE45; --gold-2:#F0C163; --tinta:#0A1A33;
    --sel:rgba(227,174,69,.14); --ok:#5FD39A; --danger:#FFB59E;
  }
  html,body{height:100%}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;color:var(--text);background:radial-gradient(1200px 700px at 50% -10%,var(--bg-2) 0%,var(--bg) 62%) fixed,var(--bg);-webkit-font-smoothing:antialiased;line-height:1.5}
  button{font-family:inherit}
  .app{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:0 16px env(safe-area-inset-bottom,0)}
  .topo{width:100%;max-width:560px;display:flex;align-items:center;gap:11px;padding:18px 2px 14px}
  .topo img{width:42px;height:42px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px rgba(227,174,69,.55),0 6px 16px rgba(0,0,0,.35)}
  .topo .l1{font-weight:800;font-size:15px;color:#fff;line-height:1.1}
  .topo .l2{font-size:9.5px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-top:2px}
  .quadro{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--linha);border-radius:22px;box-shadow:0 24px 60px -20px rgba(0,0,0,.55);overflow:hidden;display:flex;flex-direction:column}
  .prog{height:4px;background:rgba(255,255,255,.1)}
  .prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
  .corpo{padding:26px 22px 8px;display:flex;flex-direction:column;gap:14px;min-height:340px}
  .hl{font-weight:800;font-size:clamp(28px,6.4vw,40px);line-height:1.06;letter-spacing:-.025em;color:#fff}
  .hl em{font-style:normal;color:var(--gold)}
  .q{font-weight:800;font-size:clamp(22px,5vw,27px);line-height:1.16;letter-spacing:-.015em;color:#fff}
  .sub{font-size:15px;color:var(--mut)}
  .ops{display:flex;flex-direction:column;gap:10px}
  .op{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-weight:600;font-size:16px;color:var(--text);background:rgba(255,255,255,.04);border:1.5px solid var(--linha);border-radius:14px;padding:15px 16px;cursor:pointer;min-height:54px;transition:border-color .15s,background .15s}
  .op:hover{border-color:var(--gold)}
  .op .dot{width:19px;height:19px;border-radius:50%;border:2px solid var(--linha-forte);flex:none}
  .op.sel{border-color:var(--gold);background:var(--sel);color:#fff}
  .op.sel .dot{border-color:var(--gold);background:radial-gradient(circle,var(--gold) 0 4px,transparent 5px)}
  .op:focus-visible,.cta:focus-visible,.dia:focus-visible,.hora:focus-visible,.inp:focus-visible,.link:focus-visible{outline:3px solid rgba(227,174,69,.6);outline-offset:2px}
  .inp{width:100%;font:500 17px 'Inter',system-ui,sans-serif;color:#fff;background:rgba(255,255,255,.06);border:1.5px solid var(--linha-forte);border-radius:12px;padding:14px}
  .inp::placeholder{color:var(--soft)}
  .inp:focus{outline:none;border-color:var(--gold)}
  .linha2{display:grid;grid-template-columns:1fr 110px;gap:10px}
  .aviso{font-size:14px;line-height:1.45;border-radius:12px;padding:12px 14px;background:rgba(255,255,255,.07);color:#DCE5F4}
  .aviso.erro{background:rgba(180,65,31,.22);color:var(--danger)}
  .link{font-size:13.5px;color:var(--mut);text-align:center}
  .link a,.link button{color:#fff;font-weight:700;background:none;border:0;text-decoration:underline;cursor:pointer;font-size:13.5px}
  .rodape{padding:14px 22px 22px;display:flex;flex-direction:column;gap:6px}
  .cta{width:100%;font-weight:800;font-size:17px;color:var(--tinta);background:var(--gold);border:0;border-radius:14px;padding:17px;min-height:56px;cursor:pointer;transition:background .15s}
  .cta:hover{background:var(--gold-2)}
  .cta:disabled{background:rgba(255,255,255,.14);color:rgba(255,255,255,.45);cursor:not-allowed}
  .voltar{background:none;border:0;color:var(--mut);font-weight:600;font-size:14px;padding:8px;cursor:pointer}
  .modo{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:6px 11px;border-radius:999px;background:rgba(255,255,255,.08);color:#fff}
  .modo i{width:8px;height:8px;border-radius:50%;background:var(--gold)}
  .modo.vistoria i{background:#2fd08f}.modo.video i{background:#5aa2f0}.modo.ligacao i{background:#f2b52c}
  .dias{display:flex;gap:10px}
  .dia{flex:1;font-weight:700;font-size:15px;color:#fff;background:rgba(255,255,255,.04);border:1.5px solid var(--linha);border-radius:12px;padding:11px 6px;cursor:pointer;line-height:1.25}
  .dia small{display:block;font-weight:500;color:var(--mut);font-size:12.5px}
  .dia.sel{border-color:var(--gold);background:var(--sel)}
  .horas{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .hora{font-weight:700;font-size:16px;color:#fff;background:rgba(255,255,255,.04);border:1.5px solid var(--linha);border-radius:12px;padding:13px 4px;cursor:pointer}
  .hora:hover{border-color:var(--gold)}
  .hora.sel{border-color:var(--gold);background:var(--gold);color:var(--tinta)}
  .ok{width:58px;height:58px;border-radius:50%;background:rgba(95,211,154,.16);color:var(--ok);display:grid;place-items:center}
  .passos{display:flex;flex-direction:column;gap:11px;font-size:15px;color:var(--text)}
  .passos div{display:grid;grid-template-columns:24px 1fr;gap:11px;align-items:start}
  .passos .n{width:24px;height:24px;border-radius:50%;background:var(--gold);color:var(--tinta);font-weight:800;font-size:12px;display:grid;place-items:center}
  .passos b{color:#fff}
  .ig{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1.5px solid var(--linha);border-radius:14px;padding:13px 15px;font-size:14.5px;color:var(--text)}
  .ig a{font-weight:700;font-size:14px;background:var(--gold);color:var(--tinta);text-decoration:none;border-radius:10px;padding:10px 14px;white-space:nowrap}
  .carregando{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:15px}
  .carregando i{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.18);border-top-color:var(--gold);animation:gira .8s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  .portao{position:fixed;inset:0;background:rgba(3,9,20,.72);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0 0 env(safe-area-inset-bottom,0)}
  .portao[hidden]{display:none}
  .portao .caixa{background:var(--surface-2);border:1px solid var(--linha);border-bottom:0;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:24px 22px 26px;display:flex;flex-direction:column;gap:12px}
  .portao .alt{font-weight:700;font-size:15px;color:#fff;background:transparent;border:1.5px solid var(--linha-forte);border-radius:14px;padding:15px;cursor:pointer}
  .pe{width:100%;max-width:560px;text-align:center;font-size:12.5px;color:var(--soft);padding:18px 0 26px;display:flex;flex-direction:column;gap:6px}
  .pe a{color:var(--mut)}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
(function(){
'use strict';
const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://localhost:3001' : '/_api';
const WHATS_CENTRAL = '5534998165040';
const $ = id => document.getElementById(id);
const corpo = $('corpo'), rodape = $('rodape'), portao = $('portao');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ── Origem do lead: primeiro toque da sessão, como no eletroposto ─────────────
const UTM_KEYS = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term'];
function utmPrimeiroToque(){
  try{
    const salvo = sessionStorage.getItem('sq_utm'); if (salvo) return JSON.parse(salvo);
    const p = new URLSearchParams(location.search), u = {};
    UTM_KEYS.forEach(k => { const v = p.get(k); if (v) u[k] = v.slice(0, 200); });
    if (Object.keys(u).length) sessionStorage.setItem('sq_utm', JSON.stringify(u));
    return u;
  }catch(e){ return {}; }
}
const UTM = utmPrimeiroToque();
const SRC = (() => { try{ const s = (new URLSearchParams(location.search).get('src')||'').trim().toLowerCase(); return /^[a-z0-9_-]{1,20}$/.test(s) ? s : ''; }catch(e){ return ''; } })();

// ── Funil por pergunta (lp_events), o mesmo formato do eletroposto ────────────
const PL = Date.now(); let SEQ = 0;
const vistos = new Set(), errosVistos = new Set(); let fimMandado = false;
function lpFunil(tipo, dados){
  const corpoEv = Object.assign({ lp: 'solar', modo: 'quiz', caminho: caminhoAtual(), pl: PL, seq: ++SEQ }, dados || {});
  try { if (window.lpEvt) window.lpEvt(tipo, corpoEv); else (window.__lpFila = window.__lpFila || []).push([tipo, corpoEv]); } catch(e){}
}

// ── Estado ────────────────────────────────────────────────────────────────────
const R = {};                      // respostas
let nome = '', tel = '', endereco = { cep:'', rua:'', numero:'', bairro:'' };
let srv = null;                    // o que o servidor decidiu no passo do WhatsApp
let idx = 0, diaSel = null, horaSel = null, fim = null, ocupado = false, avisoHorario = '';

const CONTAS = [
  ['ate300','Até R$ 300'], ['300_600','R$ 300 a R$ 600'], ['600_1050','R$ 600 a R$ 1.050'],
  ['1050_2000','R$ 1.050 a R$ 2.000'], ['2000_5000','R$ 2.000 a R$ 5.000'], ['5000_mais','Mais de R$ 5.000'],
];
const CIDADES_SUGERIDAS = ['Uberlândia','Araguari','Uberaba','Catalão','Ituiutaba','Patrocínio','Monte Carmelo','Itumbiara','Tupaciguara','Prata','Monte Alegre de Minas','Caldas Novas','Ipameri','Araporã','Centralina','Canápolis','Indianópolis','Nova Ponte','Santa Juliana','Estrela do Sul','Cascalho Rico','Romaria','Iraí de Minas','Coromandel'];

const PASSOS = [
  { id:'conta', campo:'conta', q:'Quanto vem a sua conta de luz por mês?', ops: CONTAS, topo:true },
  { id:'tipo', campo:'tipo', q:'Onde vai ficar a energia solar?', ops:[['casa','Na minha casa'],['empresa','No meu comércio ou empresa'],['rural','Na fazenda, chácara ou agro']] },
  { id:'cidade', tipo:'cidade', q:'Em qual cidade fica o imóvel?' },
  { id:'imovel', campo:'imovel', q:'O imóvel é seu?', ops:[['proprio','Sim, é meu'],['alugado','É alugado'],['construcao','Está em construção']] },
  { id:'urgencia', campo:'urgencia', q:'Quando você quer o sistema funcionando?', ops:[['ja','O quanto antes, este mês'],['3meses','Nos próximos 3 meses'],['pesquisando','Ainda estou pesquisando preços']] },
  { id:'concorrente', campo:'concorrente', q:'Já fez orçamento com outra empresa?', ops:[['sim','Sim, quero comparar'],['nao','Não, este é o primeiro']] },
  { id:'pagamento', campo:'pagamento', q:'Como pretende pagar?', ops:[['vista','À vista'],['financiamento','Financiamento'],['cartao','Cartão em até 21x'],['naosei','Ainda não sei']] },
  { id:'decisor', campo:'decisor', q:'Quem decide a compra?', ops:[['eu','Eu decido'],['junto','Eu e mais alguém'],['outro','Outra pessoa']] },
  { id:'grupoa', campo:'grupoa', q:'A sua conta tem a linha "Demanda contratada"?', sub:'Ela aparece na conta de quem é atendido em alta tensão.',
    quando: () => R.tipo && R.tipo !== 'casa' && (R.conta === '2000_5000' || R.conta === '5000_mais'),
    ops:[['sim','Sim, tem'],['nao','Não tem'],['naosei','Não sei']] },
  { id:'nome', tipo:'nome', q:'Como podemos te chamar?' },
  { id:'whatsapp', tipo:'whatsapp', q:'Qual é o seu WhatsApp?', sub:'É por ele que chega a confirmação.' },
  { id:'endereco', tipo:'endereco', q:'Onde fica o imóvel?', sub:'É para lá que o consultor vai.', quando: () => srv && srv.caminho === 'vistoria' },
  { id:'horario', tipo:'horario', quando: () => srv && srv.dias && srv.dias.length },
];
const vivos = () => PASSOS.filter(p => !p.quando || p.quando());
function caminhoAtual(){ return srv ? srv.caminho : (R.conta ? 'respondendo' : 'inicio'); }

// Qualquer resposta que muda depois do WhatsApp invalida a decisão do servidor.
function responder(campo, v){ if (R[campo] !== v){ R[campo] = v; srv = null; diaSel = null; horaSel = null; } }

// ── Validações ────────────────────────────────────────────────────────────────
const digitos = s => String(s || '').replace(/\D/g, '');
const telOk = () => { const d = digitos(tel); return d.length === 10 || d.length === 11; };
const telBanco = () => { const d = digitos(tel); return d.length >= 12 && d.startsWith('55') ? d : '55' + d; };
function respondido(p){
  if (p.ops) return !!R[p.campo];
  if (p.tipo === 'cidade') return (R.cidade || '').trim().length >= 3;
  if (p.tipo === 'nome') return nome.trim().length >= 3;
  if (p.tipo === 'whatsapp') return telOk();
  if (p.tipo === 'endereco') return digitos(endereco.cep).length === 8 && endereco.rua.trim().length >= 3 && endereco.numero.trim().length >= 1;
  if (p.tipo === 'horario') return diaSel !== null && !!horaSel;
  return false;
}
function mensagemDoErro(p){
  if (p.ops) return 'Escolha uma das opções para continuar.';
  if (p.tipo === 'cidade') return 'Digite o nome da cidade.';
  if (p.tipo === 'nome') return 'Digite o seu nome.';
  if (p.tipo === 'whatsapp') return 'Confira o número com DDD.';
  if (p.tipo === 'endereco') return 'Preencha o CEP, a rua e o número.';
  return 'Escolha o dia e o horário.';
}

// ── Desenho ───────────────────────────────────────────────────────────────────
const SEMANA = ['dom','seg','ter','qua','qui','sex','sáb'];
const rotDia = ymd => { const d = new Date(ymd + 'T12:00:00-03:00'); return { s: SEMANA[d.getUTCDay()], n: ymd.slice(8,10) + '/' + ymd.slice(5,7) }; };
const MODO = { vistoria:'Visita técnica no endereço', video:'Atendimento online', ligacao:'Ligação' };

function render(){
  portao.hidden = true;
  if (fim) return renderFim();
  const lista = vivos();
  if (idx >= lista.length) idx = lista.length - 1;
  const p = lista[idx];
  $('prog').style.width = Math.round(idx / lista.length * 100) + '%';
  if (!vistos.has(p.id)){ vistos.add(p.id); lpFunil('quiz_passo', { passo: p.id, n: idx + 1, de: lista.length }); }

  let h = '';
  if (p.topo) h += '<h1 class="hl">Veja quanto a sua conta <em>pode cair</em></h1>';
  if (p.tipo === 'horario') h += desenhoHorario();
  else {
    h += '<h2 class="q">' + esc(p.q) + '</h2>';
    if (p.sub) h += '<p class="sub">' + esc(p.sub) + '</p>';
    if (p.ops) h += '<div class="ops" role="radiogroup">' + p.ops.map(([v,l]) =>
      '<button type="button" role="radio" aria-checked="' + (R[p.campo] === v) + '" class="op' + (R[p.campo] === v ? ' sel' : '') + '" data-v="' + v + '"><span class="dot"></span>' + esc(l) + '</button>').join('') + '</div>';
    if (p.tipo === 'cidade') h += '<input class="inp" id="in-cidade" list="dl-cid" placeholder="Ex.: Uberlândia" autocomplete="address-level2" value="' + esc(R.cidade || '') + '"><datalist id="dl-cid">' + CIDADES_SUGERIDAS.map(c => '<option value="' + c + '">').join('') + '</datalist>';
    if (p.tipo === 'nome') h += '<input class="inp" id="in-nome" placeholder="Seu nome" autocomplete="name" value="' + esc(nome) + '">';
    if (p.tipo === 'whatsapp') h += '<input class="inp" id="in-tel" inputmode="tel" autocomplete="tel-national" placeholder="(34) 9 9999-9999" value="' + esc(tel) + '">';
    if (p.tipo === 'endereco') h += '<div class="linha2"><input class="inp" id="in-cep" inputmode="numeric" placeholder="CEP" value="' + esc(endereco.cep) + '"><input class="inp" id="in-num" placeholder="Nº" value="' + esc(endereco.numero) + '"></div>'
      + '<input class="inp" id="in-rua" placeholder="Rua" autocomplete="address-line1" value="' + esc(endereco.rua) + '">'
      + '<input class="inp" id="in-bairro" placeholder="Bairro" value="' + esc(endereco.bairro) + '">';
    if (p.topo) h += '<p class="link">Trabalha com energia solar? <a href="https://solardoc.app/" id="link-int" rel="noopener">Conheça o SolarDoc</a></p>';
  }
  h += '<div id="erro" class="aviso erro" hidden></div>';
  corpo.innerHTML = h;

  const ultimo = p.tipo === 'horario';
  const rot = ocupado ? (p.tipo === 'whatsapp' ? 'Buscando os horários...' : 'Marcando...')
    : ultimo ? ({ vistoria:'Marcar visita', video:'Marcar atendimento', ligacao:'Marcar ligação' }[srv.caminho]) : 'Continuar';
  rodape.innerHTML = '<button class="cta" id="btn" type="button"' + ((respondido(p) && !ocupado) ? '' : ' disabled') + '>' + rot + '</button>'
    + (idx > 0 && !ocupado ? '<button class="voltar" id="voltar" type="button">Voltar</button>' : '');
  ligar(p);
}

function desenhoHorario(){
  const c = srv.caminho;
  const titulo = c === 'vistoria' ? 'Escolha o dia da visita' : c === 'video' ? 'Escolha o horário do atendimento' : 'Escolha o horário da ligação';
  let h = '<span class="modo ' + c + '"><i></i>' + MODO[c] + '</span><h2 class="q">' + titulo + '</h2>';
  if (c === 'vistoria') h += '<p class="sub">A visita leva uns 40 minutos.' + (R.decisor === 'junto' ? ' Escolha um horário em que vocês dois possam estar.' : '') + '</p>';
  else if (c === 'video') h += '<p class="sub">Uma chamada de vídeo pelo WhatsApp, com o estudo do seu projeto na tela.</p>';
  else h += '<p class="sub">Uma ligação curta para entender a sua conta.' + (srv.qualifica ? ' Na ligação a gente marca a visita.' : '') + '</p>';
  if (avisoHorario) h += '<div class="aviso">' + esc(avisoHorario) + '</div>';
  h += '<div class="dias">' + srv.dias.map((d, i) => { const r = rotDia(d.ymd); return '<button type="button" class="dia' + (diaSel === i ? ' sel' : '') + '" data-dia="' + i + '">' + r.s + '<small>' + r.n + '</small></button>'; }).join('') + '</div>';
  if (diaSel !== null && srv.dias[diaSel]) h += '<div class="horas">' + srv.dias[diaSel].horas.map(x => '<button type="button" class="hora' + (horaSel === x.h ? ' sel' : '') + '" data-h="' + x.h + '">' + x.h + '</button>').join('') + '</div>';
  return h;
}

function ligar(p){
  corpo.querySelectorAll('.op').forEach(b => b.onclick = () => { responder(p.campo, b.dataset.v); render(); rolarAteBotao(); });
  const ic = $('in-cidade'); if (ic) ic.oninput = () => { responder('cidade', ic.value); habilitar(p); };
  const inn = $('in-nome'); if (inn) inn.oninput = () => { nome = inn.value; habilitar(p); };
  const it = $('in-tel'); if (it) it.oninput = () => {
    let d = digitos(it.value).replace(/^55(?=\d{10,11}$)/, '').slice(0, 11), f = d;
    if (d.length > 2) f = '(' + d.slice(0,2) + ') ' + d.slice(2);
    if (d.length > 7) f = '(' + d.slice(0,2) + ') ' + d.slice(2, d.length - 4) + '-' + d.slice(-4);
    it.value = f; if (tel !== f) { tel = f; srv = null; } habilitar(p);
  };
  const icep = $('in-cep');
  if (icep){
    const ler = () => { endereco.numero = $('in-num').value; endereco.rua = $('in-rua').value; endereco.bairro = $('in-bairro').value; habilitar(p); };
    icep.oninput = () => { let d = digitos(icep.value).slice(0, 8); icep.value = d.length > 5 ? d.slice(0,5) + '-' + d.slice(5) : d; endereco.cep = icep.value; if (d.length === 8) buscaCep(d); habilitar(p); };
    ['in-num','in-rua','in-bairro'].forEach(id => $(id).oninput = ler);
  }
  corpo.querySelectorAll('.dia').forEach(b => b.onclick = () => { diaSel = +b.dataset.dia; horaSel = null; render(); });
  corpo.querySelectorAll('.hora').forEach(b => b.onclick = () => { horaSel = b.dataset.h; track('slot_escolhido'); render(); rolarAteBotao(); });
  const li = $('link-int'); if (li) li.onclick = () => { track('quiz_integrador'); fimDoQuiz('parceiro'); };
  $('btn').onclick = () => avancar(p);
  const v = $('voltar'); if (v) v.onclick = () => { idx = Math.max(0, idx - 1); avisoHorario = ''; render(); };
}
function habilitar(p){ const b = $('btn'); if (b) b.disabled = !respondido(p) || ocupado; }
function rolarAteBotao(){ const b = $('btn'); if (!b) return; const r = b.getBoundingClientRect(); if (r.bottom > window.innerHeight) b.scrollIntoView({ behavior:'smooth', block:'end' }); }
function erro(p, msg){
  const el = $('erro'); if (!el) return;
  el.textContent = msg; el.hidden = false;
  const chave = p.id + '|' + msg; if (!errosVistos.has(chave)) { errosVistos.add(chave); lpFunil('quiz_erro', { passo: p.id, msg: msg.slice(0, 140) }); }
}

let seqCep = 0;
async function buscaCep(cep){
  const meu = ++seqCep;
  try{
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 6000);
    const r = await fetch('https://viacep.com.br/ws/' + cep + '/json/', { signal: ctl.signal }); clearTimeout(t);
    const j = await r.json(); if (meu !== seqCep || !j || j.erro) return;
    if (j.logradouro) { endereco.rua = j.logradouro; const el = $('in-rua'); if (el) el.value = j.logradouro; }
    if (j.bairro) { endereco.bairro = j.bairro; const el = $('in-bairro'); if (el) el.value = j.bairro; }
    const p = vivos()[idx]; if (p) habilitar(p);
    const num = $('in-num'); if (num && !num.value) num.focus();
  }catch(e){}
}

async function avancar(p){
  if (!respondido(p)) return erro(p, mensagemDoErro(p));
  track('quiz_' + p.id);
  if (p.tipo === 'whatsapp' && !srv) return buscarCaminho(p);
  if (p.tipo === 'horario') return abrirPortao();
  idx++; avisoHorario = ''; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
}

function corpoBase(){
  return Object.assign({ respostas: R, nome: nome.trim(), tel: telBanco(), src: SRC || undefined }, UTM);
}
async function postar(caminho, corpoReq){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 15000);
  try{
    const r = await fetch(API + caminho, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(corpoReq), signal: ctl.signal });
    let j = null; try { j = await r.json(); } catch(e){}
    return { status: r.status, j: j || {} };
  } finally { clearTimeout(t); }
}

async function buscarCaminho(p){
  ocupado = true; render();
  try{
    const { status, j } = await postar('/io/solar/quiz', corpoBase());
    ocupado = false;
    if (status >= 400 || !j.ok){ render(); return erro(p, status === 400 ? 'Confira o nome e o WhatsApp.' : 'Não consegui ver os horários agora. Tente de novo em instantes.'); }
    srv = j; track('quiz_whatsapp_ok');
    if (j.jaMarcado) return fimDoQuiz('ja_marcado');
    if (j.caminho === 'curioso') return fimDoQuiz('curioso');
    if (j.semVitrine || !j.dias || !j.dias.length) return fimDoQuiz('sem_vitrine');
    diaSel = 0; horaSel = null; idx++; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
  }catch(e){
    ocupado = false; render(); erro(p, 'Não consegui ver os horários agora. Tente de novo em instantes.');
  }
}

function abrirPortao(){
  if (srv.caminho === 'ligacao') return agendar();
  $('portao-q').textContent = srv.caminho === 'vistoria' ? 'Você vai estar no endereço nesse horário?' : 'Você vai mesmo participar?';
  $('portao-sub').textContent = srv.caminho === 'vistoria' ? 'O consultor sai da base só para essa visita.' : 'O horário fica reservado só para você.';
  portao.hidden = false; track('portao_presenca');
  $('portao-sim').focus();
}
$('portao-sim').onclick = () => { track('presenca_sim'); portao.hidden = true; agendar(); };
$('portao-nao').onclick = () => { track('presenca_nao'); fimDoQuiz('nao_confirmou'); };

let marcado = null;
async function agendar(){
  const p = vivos()[idx];
  const dia = srv.dias[diaSel], hora = dia && dia.horas.find(x => x.h === horaSel);
  if (!hora) return erro(p, mensagemDoErro(p));
  ocupado = true; render();
  try{
    const { status, j } = await postar('/io/solar/quiz/agendar', Object.assign(corpoBase(), { ymd: dia.ymd, h: hora.h, dono: hora.dono, endereco }));
    ocupado = false;
    if (status === 409 && j.error === 'horario tomado' && Array.isArray(j.dias)){
      srv.dias = j.dias; srv.caminho = j.caminho || srv.caminho; diaSel = j.dias.length ? 0 : null; horaSel = null;
      avisoHorario = 'Esse horário acabou de ser tomado. Escolha outro.';
      if (!j.dias.length) return fimDoQuiz('sem_vitrine');
      render(); return;
    }
    if (status === 409 && j.error === 'ja marcado'){ srv.jaMarcado = j.jaMarcado; return fimDoQuiz('ja_marcado'); }
    if (status >= 400 || !j.ok){ render(); return erro(vivos()[idx], 'Não consegui marcar agora. Tente de novo em instantes.'); }
    marcado = { ymd: dia.ymd, h: hora.h, dono: hora.dono, caminho: srv.caminho };
    try { fbq('track', 'Schedule', { content_name: srv.caminho === 'vistoria' ? 'Vistoria Solar' : srv.caminho === 'video' ? 'Atendimento Solar' : 'Ligacao Solar' }); } catch(e){}
    fimDoQuiz(srv.caminho);
  }catch(e){
    ocupado = false; render(); erro(vivos()[idx], 'Não consegui marcar agora. Tente de novo em instantes.');
  }
}

function fimDoQuiz(destino){
  fim = destino;
  if (!fimMandado){ fimMandado = true; lpFunil('quiz_fim', { destino: destino }); }
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderFim(){
  $('prog').style.width = '100%';
  let h = '';
  const ig = '<div class="ig"><span>Siga a gente e veja as obras</span><a href="https://www.instagram.com/irmaosnaobra__/" target="_blank" rel="noopener" data-source="solar_fim">Seguir</a></div>';
  if (fim === 'parceiro'){
    h = '<h2 class="q">Isto aqui é para quem vai instalar no próprio imóvel</h2><p class="sub">Para quem vende e instala energia solar, a gente tem o SolarDoc: proposta, contrato e vistoria no celular.</p>';
    rodape.innerHTML = '<a class="cta" style="text-align:center;text-decoration:none" href="https://solardoc.app/">Conhecer o SolarDoc</a>';
    corpo.innerHTML = h; return;
  }
  // Curioso (abaixo de 40 pontos). Ordem do Thiago em 08/10: o WhatsApp não entra
  // em contato, ele fica no cadastro como curioso e o fim do quiz é o convite para
  // seguir o Instagram. Nada de prometer mensagem nem ligação.
  if (fim === 'curioso'){
    h = '<h2 class="q">Recebemos as suas respostas</h2><p class="sub">Siga a gente no Instagram para ver as obras que a gente entrega e as novidades de energia solar.</p>';
    rodape.innerHTML = '<a class="cta" style="display:block;text-align:center;text-decoration:none" href="https://www.instagram.com/irmaosnaobra__/" target="_blank" rel="noopener" data-source="solar_curioso">Seguir @irmaosnaobra__ no Instagram</a>';
    corpo.innerHTML = h; return;
  }
  if (fim === 'ja_marcado' && srv && srv.jaMarcado){
    const d = new Date(srv.jaMarcado.quando);
    const q = d.toLocaleString('pt-BR', { timeZone:'America/Sao_Paulo', weekday:'long', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
    h = '<h2 class="q">Você já tem um horário marcado</h2><p class="sub">É ' + esc(q) + (srv.jaMarcado.dono ? ', com ' + esc(srv.jaMarcado.dono) : '') + '. Se precisar trocar, responda a mensagem de confirmação no WhatsApp.</p>' + ig;
  } else if (fim === 'nao_confirmou'){
    h = '<h2 class="q">Sem problema</h2><p class="sub">Guardamos as suas respostas. Quando puder, a gente te chama no WhatsApp com novos horários.</p>' + ig;
  } else if (fim === 'sem_vitrine'){
    h = '<h2 class="q">Recebemos as suas respostas</h2><p class="sub">A gente te chama no WhatsApp para combinar o melhor horário.</p>' + ig;
  } else {
    const r = rotDia(marcado.ymd);
    const oque = { vistoria:'Visita técnica', video:'Atendimento online', ligacao:'Ligação' }[marcado.caminho];
    h = '<div class="ok" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>'
      + '<h2 class="q">Está marcado!</h2><p class="sub">' + oque + ' ' + r.s + ', ' + r.n + ', às ' + esc(marcado.h) + ', com ' + esc(marcado.dono) + '.</p>'
      + '<div class="passos"><div><span class="n">1</span><span>Confirme pelo WhatsApp respondendo <b>SIM</b> na mensagem que vai chegar.</span></div>'
      + '<div><span class="n">2</span><span>Mande uma <b>foto da conta de luz</b>' + (marcado.caminho === 'vistoria' ? ' e do padrão de entrada' : '') + ' na mesma conversa. Assim o estudo já chega com o número certo.</span></div>'
      + (marcado.caminho === 'vistoria' ? '<div><span class="n">3</span><span>Na véspera a gente pede a <b>localização</b> do imóvel.</span></div>' : '')
      + '</div>' + ig;
  }
  corpo.innerHTML = h;
  rodape.innerHTML = '<p class="link">Dúvida? Fale com a gente no WhatsApp: <a href="https://wa.me/' + WHATS_CENTRAL + '" data-source="solar_fim">(34) 99816-5040</a></p>';
}

window.__quizSolar = { render, get estado(){ return { R, nome, tel, srv, idx, fim, diaSel, horaSel }; } };
render();
})();
</script>

<!-- Tracking page_visits + lp_events (mesmo beacon do /io). Expõe window.lpEvt
     para o funil por pergunta e descarrega a fila que a página juntou antes. -->
<script>
(() => {
  const KEY = 'io_sd_session', SENT = 'io_sd_visit_sent';
  function uuid() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; const v = c==='x'?r:(r&0x3)|0x8; return v.toString(16); });
  }
  let sid = '';
  try { sid = sessionStorage.getItem(KEY) || ''; if (!sid) { sid = uuid(); sessionStorage.setItem(KEY, sid); } } catch (_) { sid = uuid(); }
  const url = (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') ? '/_api' : 'http://localhost:3001';
  const params = new URLSearchParams(location.search); const utms = {};
  ['utm_source','utm_medium','utm_campaign','utm_content','utm_term'].forEach(k => { const v = params.get(k); if (v) utms[k] = v; });
  function send(path, body) { try { fetch(url + path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body), keepalive: true }).catch(()=>{}); } catch (_) {} }
  try { if (!sessionStorage.getItem(SENT)) { send('/_t/v', { session_id: sid, landing_url: location.href, referrer: document.referrer || null, ...utms }); sessionStorage.setItem(SENT, '1'); } } catch (_) {}
  function evt(type, data) { send('/_t/e', { session_id: sid, event_type: type, event_data: data || null }); }
  window.lpEvt = evt;
  (window.__lpFila || []).splice(0).forEach(([t, d]) => evt(t, d));
  document.addEventListener('click', (e) => { const a = e.target.closest('a[href^="https://wa.me"], a[href^="https://api.whatsapp.com"], a[href*="instagram.com"]'); if (a) evt('cta_click', { label: a.href.includes('instagram') ? 'instagram' : 'whatsapp', source: a.dataset.source || 'solar' }); }, true);
  const start = Date.now();
  window.addEventListener('beforeunload', () => { const s = Math.round((Date.now()-start)/1000); if (s < 3) return; try { navigator.sendBeacon(url + '/_t/e', new Blob([JSON.stringify({ session_id: sid, event_type: 'time_on_page', event_data: { seconds: s } })], { type: 'application/json' })); } catch (_) {} });
})();
</script>
