<!--
  QUIZ SOLAR (24/10/2026). Reescrito sobre o protótipo aprovado.

  A página PERGUNTA e MOSTRA. Todo número do diagnóstico (placas, kWp, área,
  geração, economia, a conta depois) vem do servidor no passo do WhatsApp
  (POST /io/solar/quiz, campo `diagnostico`). Não existe cálculo de preço aqui.
  Também é do servidor: se está dentro do horário de atendimento direto
  (`horario_agora`), se o lead é curioso (`curioso`), a vitrine de horários
  (`dias`) e quem atende (`dono`). Grupo A volta com `conta_depois: null`, e aí a
  página não promete conta menor, só a economia.

  Regras desta página: uma pergunta por tela; resposta única avança no toque, sem
  botão e sem tela de Iniciar; a barra de progresso conta só os passos que vão
  aparecer para este cliente; "CEMIG" só quando a cidade é de MG.

  O botão "agora" chama POST /io/solar/quiz/agora. Qualquer resposta que não
  seja 2xx (ou erro de rede) abre a vitrine, então a página pode ir ao ar antes
  de a rota existir. Quem sai depois de dar o WhatsApp e sem marcar avisa o
  servidor por sendBeacon (POST /io/solar/quiz/saiu), que só grava uma marca.
-->
<style>

  body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--text);background:radial-gradient(1200px 700px at 50% -10%,var(--bg-2) 0%,var(--bg) 62%) fixed,var(--bg);-webkit-font-smoothing:antialiased;line-height:1.5;min-height:100vh;overflow-x:clip}

  [tabindex="-1"]:focus{outline:none}
  [hidden]{display:none!important}

  .app{width:100%;max-width:480px;margin:0 auto;padding:0 0 env(safe-area-inset-bottom,0)}
  .marca{display:flex;align-items:center;gap:11px;padding:16px 20px 6px}

  .prog-wrap{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0}
  .prog-top{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .prog-rot{color:var(--soft)}
  .prog-st{color:var(--gold-2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .prog{position:relative;height:6px;border-radius:3px;background:var(--linha)}
  .prog b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold-2));transition:width .55s cubic-bezier(.2,.8,.2,1)}
  .prog i{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--bg);border:2px solid var(--linha-forte);transition:background .3s,border-color .3s}

  .corpo{padding:6px 20px 28px;display:flex;flex-direction:column;gap:14px;flex:1;animation:entra .28s ease-out both}

  .tit-sec{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);margin:6px 0 -4px}
  .nums{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  .num span{font-size:12px;color:var(--soft)}
  .eco{padding:14px;border-radius:14px;background:var(--sel);border:1px solid rgba(227,174,69,.45);display:flex;flex-direction:column;gap:2px}

  .eco b{color:var(--gold-2);font-size:28px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
  .eco span{font-size:14px;color:var(--mut)}
  .obs{margin:0;font-size:14px;color:var(--mut)}
  .pessoal{margin:0;font-size:15px;padding-left:12px;border-left:3px solid var(--gold)}
  .lista{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}

  .lista svg{flex:none;margin-top:3px;color:var(--ok)}
  .passos{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:8px}

  .car-seta{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:1px solid var(--linha-forte);background:rgba(10,26,51,.78);color:var(--text);display:grid;place-items:center;cursor:pointer}

  .car-pontos{display:flex;justify-content:center;gap:6px;margin-top:10px}

  .luz{position:fixed;inset:0;z-index:50;background:rgba(5,12,26,.94);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
  .luz img{max-width:min(92vw,560px);max-height:86vh;border-radius:12px;object-fit:contain}
  .luz-fechar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);width:44px;height:44px;border-radius:50%;border:1px solid var(--linha-forte);background:var(--bg);color:var(--text);font-size:24px;line-height:1;cursor:pointer}
  .cta{margin-top:6px;padding:16px;border-radius:18px;background:var(--surface-2);border:1px solid var(--linha-forte);display:flex;flex-direction:column;gap:10px}
  .quem{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mut)}
  .quem strong{color:var(--text)}
  .av{width:42px;height:42px;border-radius:50%;background:var(--gold);color:var(--tinta);display:grid;place-items:center;font-weight:800;flex:none;font-size:17px}
  .estim{font-size:12px;color:var(--soft);margin:0;text-align:center}

  /* Telas finais */
  .fim{padding:20px 20px 32px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;flex:1;justify-content:center;animation:entra .28s ease-out both}
  .fim .av{width:76px;height:76px;font-size:30px;position:relative}
  .fim .av.pulsa::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--gold);animation:pulso 1.8s ease-out infinite}
  @keyframes pulso{from{transform:scale(.9);opacity:.9}to{transform:scale(1.3);opacity:0}}
  .fim h2{font-size:23px;line-height:1.2;margin:0;font-weight:800;text-wrap:balance}
  .fim p{margin:0;color:var(--mut)}
  .fim .btn,.fim .ig{width:100%}
  .caixa{padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--linha);font-size:14px}
  .ok-ic{width:64px;height:64px;border-radius:50%;background:rgba(95,211,154,.14);color:var(--ok);display:grid;place-items:center}
  .ig{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1.5px solid var(--linha);border-radius:14px;padding:13px 15px;font-size:14.5px;color:var(--text);text-align:left}
  .ig a{font-weight:700;font-size:14px;background:var(--gold);color:var(--tinta);text-decoration:none;border-radius:10px;padding:10px 14px;white-space:nowrap}
  .dia{font-size:14px;font-weight:700;color:var(--mut);margin:4px 0 -4px}
  .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .slots button{padding:12px 0;border-radius:10px;border:1.5px solid var(--linha-forte);background:transparent;color:var(--text);font-weight:700;font-size:15px;cursor:pointer;font-variant-numeric:tabular-nums}
  .slots button:hover{border-color:var(--gold);background:var(--sel)}
  .slots button:disabled{opacity:.5;cursor:not-allowed}

  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<script>
(function(){
'use strict';
const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'http://localhost:3001' : '/_api';
const WHATS_CENTRAL = '5534998165040';
// Texto pronto que o porteiro da 5040 reconhece como Solar (porteiro.ts, produtoDoBotao).
const WHATS_TEXTO = 'Oi! Acabei de preencher a simulação de energia solar.';
const $ = id => document.getElementById(id);
const tela = $('tela');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const calmo = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

// ── Origem do lead: primeiro toque da sessão, como no eletroposto ─────────────
const UTM_KEYS = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term'];
function utmPrimeiroToque(){
  try{
    const salvo = sessionStorage.getItem('sq_utm'); if (salvo) return JSON.parse(salvo);
    const p = new URLSearchParams(location.search), u = {};
    UTM_KEYS.forEach(k => { const v = p.get(k); if (v) u[k] = v.slice(0, 200); });
    if (Object.keys(u).length) sessionStorage.setItem('sq_utm', JSON.stringify(u));
    return u;
  }catch(e){ return {}; }
}
const UTM = utmPrimeiroToque();

// ── fbc/fbp para a API de Conversões (09/10/2026) ─────────────────────────────
// O servidor repete o Schedule para o Meta com telefone, nome, IP e estes dois
// cookies, que o navegador sozinho nem sempre entrega (bloqueador, Safari). O fbc
// nasce do ?fbclid= quando o pixel ainda não gravou o cookie _fbc, e fica na
// sessão como as UTMs: o clique do anúncio é o primeiro toque, não o último.
function metaCookies(){
  const o = {};
  try{
    const ck = n => { const m = document.cookie.match(new RegExp('(?:^|; )' + n + '=([^;]*)')); return m ? decodeURIComponent(m[1]) : ''; };
    const fbp = ck('_fbp'); if (fbp) o.fbp = fbp;

fetch('/io/solar/municipios.json').then(r => r.ok ? r.json() : []).then(l => {
  MUNI = (Array.isArray(l) ? l : []).filter(s => typeof s === 'string').map(s => { const nome = s.replace(/-[A-Z]{2}$/, ''); return { s, n: norm(nome), nf: norm(s), uf: s.slice(-2) }; });

function ordemUF(a, b){ return (UF_PRIO[a.uf] ?? 3) - (UF_PRIO[b.uf] ?? 3); }
function acharCidades(t){
  const q = norm(t); if (!q || !MUNI) return [];
  const chave = q.indexOf('-') >= 0 ? 'nf' : 'n';
  const comeca = MUNI.filter(m => m[chave].startsWith(q));
  const palavra = MUNI.filter(m => !m[chave].startsWith(q) && m[chave].split(/[\s-]+/).some(w => w.startsWith(q)));
  const contem = MUNI.filter(m => !m[chave].startsWith(q) && !m[chave].split(/[\s-]+/).some(w => w.startsWith(q)) && m[chave].includes(q));
  return [...comeca.sort(ordemUF), ...palavra.sort(ordemUF), ...contem.sort(ordemUF)].slice(0, 6);
}
function sugestoesHtml(t){
  if (!norm(t)) return '';
  const ach = acharCidades(t);
  if (!ach.length) return '<p class="mini">Não achou? Termine de digitar e toque em Continuar.</p>';
  return ach.map(m => `<button type="button" data-sug="${esc(m.s)}">${esc(m.s)}</button>`).join('');
}
// Texto digitado que é exatamente um município vira "Município-UF"; senão fica como está.
function cidadeFinal(t){
  const q = norm(t);
  if (MUNI && q){
    const ex = MUNI.filter(m => m.nf === q || m.n === q).sort(ordemUF);
    if (ex.length) return ex[0].s;
  }
  return t.trim();
}

const curva = t => Math.round(8 + 92 * (1 - Math.pow(1 - t, 1.4)));
function prog(){
  const v = visiveis(), N = v.length, i = fase === 'quiz' ? Math.max(0, v.findIndex(p => p.id === atual)) : N;
  const pct = curva(i / N), falta = fase === 'quiz' ? N - i : 0;
  const marcos = ORDEM_BLOCOS.slice(1).map(b => { const j = v.findIndex(p => p.b === b); return { pos: curva(j / N), feito: i >= j }; });
  return { pct, falta, marcos };
}
function barra(bloco, semVoltar){
  const { pct, falta, marcos } = prog();
  const st = fase !== 'quiz' ? 'Diagnóstico pronto' : falta === 1 ? 'Última pergunta' : falta <= 3 ? `Faltam ${falta}` : `${pct}% do diagnóstico`;
  return `<div class="barra"><button class="voltar${semVoltar ? ' oculto' : ''}" data-acao="voltar" type="button" aria-label="Voltar">${IC.voltar}</button><div class="prog-wrap"><div class="prog-top"><span class="prog-rot">${BLOCO_CLIENTE[bloco]}</span><span class="prog-st">${st}</span></div><div class="prog" role="progressbar" aria-label="Progresso do diagnóstico" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><b data-pct="${pct}" style="width:${ultimoPct}%"></b>${marcos.map(m => `<i class="${m.feito ? 'feito' : ''}" style="left:${m.pos}%"></i>`).join('')}</div></div></div>`;

}

// ── Vitrine de horários ───────────────────────────────────────────────────────
const DSEM = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const rotDia = ymd => { const d = new Date(ymd + 'T12:00:00-03:00'); return DSEM[d.getUTCDay()] + ', ' + ymd.slice(8, 10) + '/' + ymd.slice(5, 7); };
const horaDe = x => (typeof x === 'string' ? { h: x } : x) || {};
function telaHorarios(){
  const dono = (srv && srv.dono) || 'Nilce';
  const dias = (srv && Array.isArray(srv.dias)) ? srv.dias : [];
  let h = barra('diag', false) + `<div class="corpo"><h2 class="q">Escolha o melhor horário</h2><p class="sub">Ligação de 15 minutos com ${esc(dono)}, pelo WhatsApp.</p>`;
  if (avisoHorario) h += `<div class="aviso">${esc(avisoHorario)}</div>`;
  dias.forEach((d, di) => {
    h += `<p class="dia">${esc(rotDia(d.ymd))}</p><div class="slots">${(d.horas || []).map(x => { const o = horaDe(x); return `<button type="button" data-slot="${esc(o.h)}" data-di="${di}" data-dono="${esc(o.dono || '')}">${esc(o.h)}</button>`; }).join('')}</div>`;
  });
  return h + '<p class="erro" id="erro" hidden></p></div>';
}

// ── Desenho ───────────────────────────────────────────────────────────────────
function render(){
  let h, idFunil, n, de;
  const v = visiveis();
  if (fase === 'quiz'){ const p = passo(atual); h = telaPasso(p); idFunil = p.id; n = v.findIndex(x => x.id === p.id) + 1; de = v.length; }
  else if (fase === 'resultado'){ h = telaResultado(); idFunil = 'resultado'; n = v.length + 1; de = v.length + 1; }
  else if (fase === 'horarios'){ h = telaHorarios(); idFunil = 'horarios'; n = v.length + 2; de = v.length + 2; }
  else { h = telaFim(); }
  tela.innerHTML = h;
  const pb = tela.querySelector('.prog b');
  if (pb){ const alvo = pb.dataset.pct; requestAnimationFrame(() => requestAnimationFrame(() => { pb.style.width = alvo + '%'; })); ultimoPct = +alvo; }
  ligarCarrosseis();
  if (idFunil && !vistos.has(idFunil)){ vistos.add(idFunil); lpFunil('quiz_passo', { passo: idFunil, n, de }); }
  if (!primeiraTela){
    window.scrollTo({ top: 0, behavior: 'auto' });
    const alvo = tela.querySelector('input.campo') || tela.querySelector('.q, .res-h, .fim h2');
    if (alvo){ if (!/^(input)$/i.test(alvo.tagName)) alvo.tabIndex = -1; try{ alvo.focus({ preventScroll:true }); }catch(e){} }
  }
  primeiraTela = false;
}

function erro(msg){
  const el = $('erro'); if (!el) return;
  el.textContent = msg; el.hidden = false;
  const id = fase === 'quiz' ? atual : fase;
  const chave = id + '|' + msg; if (!errosVistos.has(chave)){ errosVistos.add(chave); lpFunil('quiz_erro', { passo: id, msg: msg.slice(0, 140) }); }
}

// ── Fluxo das perguntas ───────────────────────────────────────────────────────
function responder(campo, v){ if (R[campo] !== v){ R[campo] = v; srv = null; } }
function proximo(id){ const v = visiveis(), i = v.findIndex(p => p.id === id); return v[i + 1] ? v[i + 1].id : null; }
function avancar(){
  track('quiz_' + atual);
  const nx = proximo(atual); hist.push(atual);
  if (nx) atual = nx; else { fase = 'resultado'; track('quiz_resultado'); }
  render();
}
function voltar(){
  if (fase === 'quiz'){ if (hist.length){ atual = hist.pop(); render(); } return; }
  if (fase === 'resultado'){ fase = 'quiz'; atual = hist.pop(); render(); return; }
  if (fase === 'horarios'){ avisoHorario = ''; fase = 'resultado'; render(); }
}
function continuar(){
  const p = passo(atual);
  if (p.tipo === 'cidade'){
    const t = (R.cidade || '').trim();
    if (t.length < 3) return erro('Digite o nome da cidade.');
    R.cidade = cidadeFinal(t); return avancar();
  }
  if (p.tipo === 'nome'){
    if (NOME.trim().length < 3) return erro('Digite o seu nome.');
    return avancar();
  }
  if (p.tipo === 'whatsapp'){
    if (!telOk()) return erro('Digite o celular com DDD, por exemplo (34) 99999-9999.');
    return verDiagnostico();
  }
}

// ── Servidor ──────────────────────────────────────────────────────────────────
function corpoBase(){
  return Object.assign({ respostas: respostasLimpas(), nome: NOME.trim(), tel: telBanco(), src: SRC || undefined }, UTM, metaCookies());
}
async function postar(caminho, corpoReq){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 15000);
  try{
    const r = await fetch(API + caminho, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(corpoReq), signal: ctl.signal });
    let j = null; try { j = await r.json(); } catch(e){}
    return { status: r.status, j: j || {} };
  } finally { clearTimeout(t); }
}
const novoEventId = () => { try{ return 'agd_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }catch(e){ return ''; } };
function schedule(evId){
  // O servidor manda o mesmo Schedule pela API de Conversões; o Meta junta os dois pelo event_id.
  try { fbq('track', 'Schedule', { content_name: 'Ligacao Solar' }, evId ? { eventID: evId } : undefined); } catch(e){}
}
function botao(id, rot, desligado){ const b = $(id); if (!b) return; if (rot != null) b.textContent = rot; b.disabled = !!desligado; }

// Passo do WhatsApp: o servidor grava o rascunho e devolve o diagnóstico. Sempre
// chama de novo (voltar e avançar refaz a vitrine e o "agora").
async function verDiagnostico(){
  if (ocupado) return;
  track('quiz_whatsapp');
  ocupado = true; botao('btnTel', 'Montando o seu diagnóstico...', true);
  try{
    const { status, j } = await postar('/io/solar/quiz', corpoBase());
    ocupado = false;
    if (status >= 400 || !j.ok){ botao('btnTel', 'Ver meu diagnóstico', false); return erro(status === 400 ? 'Confira o nome e o WhatsApp.' : 'Não consegui montar o seu diagnóstico agora. Tente de novo em instantes.'); }
    srv = j; track('quiz_whatsapp_ok');
    if (j.jaMarcado){ cardMarcado = true; return fimDoQuiz('ja_marcado'); }
    if (j.semVitrine){ cardMarcado = true; return fimDoQuiz('sem_vitrine'); }
    hist.push('whatsapp'); fase = 'resultado'; track('quiz_resultado'); render();
  }catch(e){
    ocupado = false; botao('btnTel', 'Ver meu diagnóstico', false);
    erro('Não consegui montar o seu diagnóstico agora. Tente de novo em instantes.');
  }
}

// Botão "agora": o card nasce no servidor. Qualquer resposta que não seja 2xx
// (rota ainda inexistente, fora do horário, curioso) ou erro de rede abre a vitrine.
async function agora(){
  if (ocupado) return;
  ocupado = true; botao('btnAgora', 'Chamando...', true);
  const evId = novoEventId();
  let ok = false, info = null;
  try{
    const { status, j } = await postar('/io/solar/quiz/agora', Object.assign(corpoBase(), evId ? { event_id: evId } : {}));
    ok = status >= 200 && status < 300 && j.ok !== false; info = j;
  }catch(e){ ok = false; }
  ocupado = false;
  if (!ok){ avisoHorario = 'Não deu para chamar agora. Escolha o melhor horário abaixo.'; return abrirHorarios(); }
  schedule(evId); cardMarcado = true; agoraInfo = info;
  fimDoQuiz('agora');
}

function abrirHorarios(){
  const dias = srv && Array.isArray(srv.dias) ? srv.dias : [];
  if (!dias.length) return fimDoQuiz('sem_vitrine');
  fase = 'horarios'; render();
}

async function agendar(ymd, h, dono){
  if (ocupado) return;
  ocupado = true; tela.querySelectorAll('.slots button').forEach(b => { b.disabled = true; });
  const evId = novoEventId();
  try{
    const { status, j } = await postar('/io/solar/quiz/agendar', Object.assign(corpoBase(), { ymd, h, dono }, evId ? { event_id: evId } : {}));
    ocupado = false;
    if (status === 409 && j.error === 'horario tomado' && Array.isArray(j.dias)){
      srv.dias = j.dias; if (j.caminho) srv.caminho = j.caminho;
      if (!j.dias.length) return fimDoQuiz('sem_vitrine');
      avisoHorario = 'Esse horário acabou de ser tomado. Escolha outro.'; return render();
    }
    if (status === 409 && j.error === 'ja marcado'){ srv.jaMarcado = j.jaMarcado; cardMarcado = true; return fimDoQuiz('ja_marcado'); }
    if (status >= 400 || !j.ok){ render(); return erro('Não consegui marcar agora. Tente de novo em instantes.'); }
    marcado = { ymd, h, dono: dono || j.dono || (srv && srv.dono) || '' };
    schedule(evId); cardMarcado = true;
    fimDoQuiz('marcado');
  }catch(e){
    ocupado = false; render(); erro('Não consegui marcar agora. Tente de novo em instantes.');
  }
}

function fimDoQuiz(tipo){
  fase = 'fim'; fimTipo = tipo;
  if (!fimMandado){ fimMandado = true; lpFunil('quiz_fim', { destino: tipo === 'marcado' ? 'ligacao' : tipo }); }
  render();
}

// ── Saída sem marcar: só avisa o servidor, que grava uma marca ────────────────
// Armado depois de o servidor ter o lead (resposta do passo do WhatsApp) e
// desarmado quando há card (agora, marcação ou "já marcado").
let ultimoSaiu = 0;
function avisarSaida(motivo){
  try{
    if (!srv || cardMarcado || !telOk()) return;
    const agoraMs = Date.now(); if (agoraMs - ultimoSaiu < 3000) return;
    ultimoSaiu = agoraMs;
    const corpoS = Object.assign(corpoBase(), { onde: fase === 'quiz' ? atual : fase, motivo });
    if (navigator.sendBeacon) navigator.sendBeacon(API + '/io/solar/quiz/saiu', new Blob([JSON.stringify(corpoS)], { type:'application/json' }));
  }catch(e){}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') avisarSaida('hidden'); });
window.addEventListener('pagehide', () => avisarSaida('pagehide'));

// ── Carrossel: passa sozinho a cada 4 s, para quando a pessoa mexe ────────────
let carTimers = [];
function moverCar(c, dir){
  const t = c.querySelector('.car-trilho'), n = t.children.length, w = Math.max(1, t.clientWidth);
  let i = Math.round(t.scrollLeft / w) + dir; if (i >= n) i = 0; if (i < 0) i = n - 1;
  t.scrollTo({ left: i * w, behavior: calmo() ? 'auto' : 'smooth' });
}
function ligarCarrosseis(){
  carTimers.forEach(clearInterval); carTimers = [];
  tela.querySelectorAll('.carrossel').forEach(c => {
    const t = c.querySelector('.car-trilho'), pontos = [...c.querySelectorAll('.car-pontos i')];
    t.addEventListener('scroll', () => { const i = Math.round(t.scrollLeft / Math.max(1, t.clientWidth)); pontos.forEach((p, j) => p.classList.toggle('on', j === i)); }, { passive:true });
    const parar = () => { c.dataset.parado = '1'; };
    t.addEventListener('pointerdown', parar, { passive:true });
    t.addEventListener('touchstart', parar, { passive:true });
    // Quem pede menos movimento (prefers-reduced-motion) não recebe o autoplay: só setas, bolinhas e rolagem.
    if (!calmo()) carTimers.push(setInterval(() => { if (c.dataset.parado || !c.isConnected || document.hidden) return; moverCar(c, 1); }, 4000));
  });
}
const luz = $('luz');
function abrirLuz(src, alt){ const im = document.createElement('img'); im.src = src; im.alt = alt || ''; luz.appendChild(im); luz.hidden = false; }
function fecharLuz(){ luz.hidden = true; luz.querySelectorAll('img').forEach(i => i.remove()); }
luz.addEventListener('click', fecharLuz);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !luz.hidden) fecharLuz(); });

// ── Eventos da tela ───────────────────────────────────────────────────────────
tela.addEventListener('click', e => {
  const ir = e.target.closest('[data-car-ir]');
  if (ir){ const c = ir.closest('.carrossel'); c.dataset.parado = '1'; moverCar(c, +ir.dataset.carIr); return; }
  const z = e.target.closest('[data-zoom]');
  if (z){ const im = z.querySelector('img'); abrirLuz(z.dataset.zoom, im ? im.alt : ''); return; }
  const li = e.target.closest('#linkInt');
  if (li){ e.preventDefault(); track('quiz_integrador'); fimDoQuiz('parceiro'); return; }
  const op = e.target.closest('[data-op]');
  if (op){
    if (travado || fase !== 'quiz') return;
    const id = atual, p = passo(id);
    responder(p.campo, op.dataset.op);
    tela.querySelectorAll('[data-op]').forEach(b => { b.classList.toggle('sel', b === op); b.setAttribute('aria-checked', String(b === op)); });
    travado = true;
    setTimeout(() => { travado = false; if (atual === id && fase === 'quiz') avancar(); }, 230);
    return;
  }
  const sg = e.target.closest('[data-sug]'); if (sg){ R.cidade = sg.dataset.sug; avancar(); return; }
  const sl = e.target.closest('[data-slot]');
  if (sl){ const d = srv.dias[+sl.dataset.di]; if (d) agendar(d.ymd, sl.dataset.slot, sl.dataset.dono || (srv.dono || '')); return; }
  const a = e.target.closest('[data-acao]'); if (!a) return;
  if (a.dataset.acao === 'voltar') return voltar();
  if (a.dataset.acao === 'continuar') return continuar();
  if (a.dataset.acao === 'agora') return agora();
  if (a.dataset.acao === 'horarios'){ avisoHorario = ''; return abrirHorarios(); }
});
tela.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'inCidade'){ R.cidade = t.value; srv = null; $('sug').innerHTML = sugestoesHtml(t.value); }
  else if (t.id === 'inNome'){ NOME = t.value; }
  else if (t.id === 'inTel'){ t.value = mascaraTel(t.value); TEL = t.value; }
  const er = $('erro'); if (er) er.hidden = true;
});
tela.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('input')){ e.preventDefault(); continuar(); } });

window.__quizSolar = { render, get estado(){ return { R, NOME, TEL, srv, atual, fase, fimTipo, cardMarcado, hist }; } };
render();
})();
</script>

<!-- Tracking page_visits + lp_events (mesmo beacon do /io). Expõe window.lpEvt
     para o funil por pergunta e descarrega a fila que a página juntou antes. -->
<script>
(() => {
  const KEY = 'io_sd_session', SENT = 'io_sd_visit_sent';
  function uuid() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; const v = c==='x'?r:(r&0x3)|0x8; return v.toString(16); });
  }
  let sid = '';
  try { sid = sessionStorage.getItem(KEY) || ''; if (!sid) { sid = uuid(); sessionStorage.setItem(KEY, sid); } } catch (_) { sid = uuid(); }
  const url = (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') ? '/_api' : 'http://localhost:3001';
  const params = new URLSearchParams(location.search); const utms = {};
  ['utm_source','utm_medium','utm_campaign','utm_content','utm_term'].forEach(k => { const v = params.get(k); if (v) utms[k] = v; });
  function send(path, body) { try { fetch(url + path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body), keepalive: true }).catch(()=>{}); } catch (_) {} }
  try { if (!sessionStorage.getItem(SENT)) { send('/_t/v', { session_id: sid, landing_url: location.href, referrer: document.referrer || null, ...utms }); sessionStorage.setItem(SENT, '1'); } } catch (_) {}
  function evt(type, data) { send('/_t/e', { session_id: sid, event_type: type, event_data: data || null }); }
  window.lpEvt = evt;
  (window.__lpFila || []).splice(0).forEach(([t, d]) => evt(t, d));
  document.addEventListener('click', (e) => { const a = e.target.closest('a[href^="https://wa.me"], a[href^="https://api.whatsapp.com"], a[href*="instagram.com"]'); if (a) evt('cta_click', { label: a.href.includes('instagram') ? 'instagram' : 'whatsapp', source: a.dataset.source || 'solar' }); }, true);
  const start = Date.now();
  window.addEventListener('beforeunload', () => { const s = Math.round((Date.now()-start)/1000); if (s < 3) return; try { navigator.sendBeacon(url + '/_t/e', new Blob([JSON.stringify({ session_id: sid, event_type: 'time_on_page', event_data: { seconds: s } })], { type: 'application/json' })); } catch (_) {} });
})();
</script>
