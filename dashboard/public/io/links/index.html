<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Irmãos na Obra | Links</title>
  <meta name="description" content="Irmãos na Obra — a tecnologia que acelera o setor solar.">

  <link rel="icon" href="/io/img/icon-512.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@700;800&display=swap" rel="stylesheet" />

  <!-- Meta Pixel -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '446093469730871'); // Simulador B2C
    fbq('init', '824905216831401'); // SolarDoc B2B
    fbq('track', 'PageView');
  </script>

  <style>
    :root {
      --bg: #020617;
      --surface: #0f172a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --solar: #f59e0b;
      --solar-glow: rgba(245, 158, 11, 0.4);
      --border: rgba(255, 255, 255, 0.08);
      --radius: 20px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 60px 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Grid de energia */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        linear-gradient(rgba(245, 158, 11, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245, 158, 11, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
      z-index: -1;
    }

    /* Radial glow */
    body::after {
      content: '';
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 150%; height: 150%;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.05) 0%, transparent 70%);
      z-index: -1;
      pointer-events: none;
      animation: pulse 10s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
      to { opacity: 0.7; transform: translate(-50%, -50%) scale(1.1); }
    }

    .container { width: 100%; max-width: 450px; text-align: center; z-index: 10; }

    .header { margin-bottom: 40px; }

    .logo-wrap {
      width: 96px; height: 96px;
      margin: 0 auto 24px;
      background: #fff;
      border-radius: 50%;
      padding: 12px;
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.4);
      display: flex; align-items: center; justify-content: center;
      animation: float 3s ease-in-out infinite;
      position: relative; z-index: 10;
    }
    .logo { width: 100%; object-fit: contain; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .brand-name {
      font-family: 'Lexend', sans-serif;
      font-size: 28px; font-weight: 800;
      letter-spacing: -1px; margin-bottom: 8px;
    }
    .brand-name span { color: var(--solar); }
    .bio { font-size: 15px; color: var(--muted); line-height: 1.5; font-weight: 500; }

    /* Grade de atalhos: 3 colunas de ícone + nome curto */
    .links-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    @media (max-width: 360px) { .links-list { grid-template-columns: repeat(2, 1fr); } }

    .section-title {
      grid-column: 1 / -1;
      font-size: 11px; font-weight: 800; color: var(--muted);
      text-transform: uppercase; letter-spacing: 2px;
      margin: 26px 0 2px;
      display: flex; align-items: center; gap: 12px;
    }
    .section-title:first-child { margin-top: 0; }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .state { grid-column: 1 / -1; }

    /* Mesmo atalho do painel da SolarDoc (quickCard): superfície + borda fina,
       ícone monocromático em cima, nome curto embaixo. Aqui na paleta da IO. */
    .link-item {
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.045));
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      padding: 16px 10px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 12.5px;
      line-height: 1.3;
      text-align: center;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px;
      position: relative; overflow: hidden;
    }

    /* Ícone: SVG de traço num chip âmbar. Monocromático — nada de emoji. */
    .icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 42px; height: 42px; border-radius: 13px;
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.26), rgba(245, 158, 11, 0.10));
      border: 1px solid rgba(251, 191, 36, 0.28);
      color: #fbbf24;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .icon svg { width: 21px; height: 21px; }

    /* Sem lift no hover: a animação de entrada roda com fill forwards e ganha de
       qualquer transform declarado aqui. O toque fica na borda e no fundo. */
    .link-item:hover {
      border-color: rgba(251, 191, 36, 0.6);
      background: linear-gradient(160deg, rgba(251, 191, 36, 0.16), rgba(255, 255, 255, 0.05));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10), 0 8px 20px rgba(0, 0, 0, 0.35);
    }
    .link-item:hover .icon {
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.42), rgba(245, 158, 11, 0.18));
      border-color: rgba(251, 191, 36, 0.55);
      color: #fcd34d;
    }

    /* Destaque (o WhatsApp): ocupa a linha inteira, ícone e nome lado a lado. */
    .link-item.featured {
      grid-column: 1 / -1;
      flex-direction: row; justify-content: center; gap: 10px;
      background: linear-gradient(135deg, #fcd34d, #f59e0b);
      color: #000; border-color: rgba(255, 255, 255, 0.35);
      font-size: 15px; font-weight: 800; padding: 16px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 10px 26px rgba(245, 158, 11, 0.3);
    }
    .link-item.featured .icon {
      width: 34px; height: 34px; border-radius: 11px;
      background: rgba(0, 0, 0, 0.14); border-color: rgba(0, 0, 0, 0.16); color: #000;
    }
    .link-item.featured:hover {
      background: linear-gradient(135deg, #fde68a, #fbbf24);
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 14px 32px rgba(245, 158, 11, 0.45);
    }
    .link-item.featured:hover .icon { background: rgba(0, 0, 0, 0.16); border-color: rgba(0, 0, 0, 0.2); color: #000; }

    /* Verde pra links de WhatsApp que NÃO são o destaque (detecção por URL) */
    .link-item.whats:not(.featured) .icon {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.28), rgba(34, 197, 94, 0.10));
      border-color: rgba(34, 197, 94, 0.32); color: #4ade80;
    }
    .link-item.whats:not(.featured):hover { border-color: rgba(74, 222, 128, 0.6); background: linear-gradient(160deg, rgba(34, 197, 94, 0.16), rgba(255, 255, 255, 0.05)); }
    .link-item.whats:not(.featured):hover .icon { border-color: rgba(74, 222, 128, 0.55); color: #86efac; }

    .social-icons { display: flex; justify-content: center; gap: 24px; margin: 40px 0 24px; }
    .social-link { color: var(--muted); transition: all 0.3s; }
    .social-link:hover { color: var(--solar); transform: scale(1.1); }

    .footer { font-size: 11px; color: var(--muted); opacity: 0.6; font-weight: 600; letter-spacing: 1px; }

    /* Entrada escalonada */
    .link-item { opacity: 0; animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* estado de carregamento / vazio */
    .state { color: var(--muted); font-size: 14px; padding: 24px 0; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="logo-wrap">
        <img src="https://i.postimg.cc/KzBwm9nJ/Whats-App-Image-2025-08-04-at-16-03-01-1-removebg-preview.png" class="logo" alt="Irmãos na Obra">
      </div>
      <h1 class="brand-name">Irmãos na <span>Obra</span></h1>
      <p class="bio">A tecnologia que acelera o setor solar.</p>
    </div>

    <div class="links-list" id="links">
      <div class="state" id="state">Carregando…</div>
    </div>

    <div class="social-icons">
      <a href="https://www.instagram.com/irmaosnaobra__" target="_blank" rel="noopener" class="social-link" title="Instagram">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
      </a>
    </div>

    <p class="footer">© 2026 IRMÃOS NA OBRA SOLAR</p>
  </div>

  <script>
    // Mesma origem em produção (rewrite /_api → api.solardoc.app). Localhost cai na API local.
    const API = (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1')
      ? '/_api' : 'http://localhost:3001';

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // Ícones de traço (estilo Lucide, como os atalhos do painel da SolarDoc).
    // Monocromáticos: herdam a cor do botão via currentColor — nada de emoji colorido.
    const S = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">';
    const ICONS = {
      whats: S + '<path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.5 8.4 8.4 0 0 1-4-1L3 21l2-5.5a8.4 8.4 0 0 1-1-4A8.4 8.4 0 0 1 12.5 3 8.4 8.4 0 0 1 21 11.5z"/></svg>',
      calc:  S + '<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8"/><path d="M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15v3"/></svg>',
      sol:   S + '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
      users: S + '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/></svg>',
      plug:  S + '<path d="M9 2v6M15 2v6"/><path d="M6 8h12v3a6 6 0 0 1-12 0V8z"/><path d="M12 17v5"/></svg>',
      up:    S + '<path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/></svg>',
      gift:  S + '<path d="M20 12v10H4V12"/><rect x="2" y="7" width="20" height="5" rx="1"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>',
      drop:  S + '<path d="M12 2.7l5.7 5.6a8 8 0 1 1-11.4 0z"/></svg>',
      deck:  S + '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
      globe: S + '<circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>',
      box:   S + '<path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/></svg>',
      link:  S + '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>',
    };

    // Escolhe o ícone pelo destino do link. Um ícone gravado no editor (campo
    // `icon`) continua mandando — é a saída manual pra um link novo.
    function iconFor(url, custom) {
      if (custom) return esc(custom);
      const u = String(url || '').toLowerCase();
      if (/wa\.me|whatsapp/.test(u))     return ICONS.whats;
      if (/\/simular/.test(u))           return ICONS.calc;
      if (/\/io\/solar/.test(u))         return ICONS.sol;
      if (/\/io\/indicacao/.test(u))     return ICONS.gift;
      if (/\/io\/eletroposto/.test(u))   return ICONS.up;
      if (/eletroposto/.test(u))         return ICONS.plug;
      if (/limpapro/.test(u))            return ICONS.drop;
      if (/\/apresentacao/.test(u))      return ICONS.deck;
      if (/\/kit/.test(u))               return ICONS.box;
      if (/\/io\/?$/.test(u))            return ICONS.users;
      if (/solardoc\.app\/?$/.test(u))   return ICONS.globe;
      return ICONS.link;
    }

    // Conta o clique server-side (best-effort) e dispara o pixel, sem segurar a navegação.
    function trackClick(id, label) {
      try { fbq('trackCustom', 'ClickLinkBio', { name: label }); } catch (e) {}
      try {
        if (navigator.sendBeacon) navigator.sendBeacon(API + '/io-links/' + id + '/click');
        else fetch(API + '/io-links/' + id + '/click', { method: 'POST', keepalive: true });
      } catch (e) {}
    }

    function render(links) {
      const wrap = document.getElementById('links');
      if (!links.length) {
        wrap.innerHTML = '<div class="state">Em breve, novidades por aqui. 🌞</div>';
        return;
      }
      let html = '';
      let lastSection = '__none__';
      let delay = 0;
      for (const l of links) {
        const section = l.section || null;
        if (section && section !== lastSection) {
          html += '<div class="section-title">' + esc(section) + '</div>';
          lastSection = section;
        } else if (!section) {
          lastSection = '__none__';
        }
        const isWhats = /wa\.me|whatsapp/i.test(l.url || '');
        const cls = 'link-item' + (l.featured ? ' featured' : '') + (isWhats ? ' whats' : '');
        const target = /^https?:\/\//i.test(l.url) ? ' target="_blank" rel="noopener"' : '';
        delay += 0.08;
        // Sem onclick inline: o tracking é ligado via addEventListener depois,
        // lendo data-id/data-label. Evita qualquer quebra com aspas/apóstrofo no texto.
        html +=
          '<a href="' + esc(l.url) + '" class="' + cls + '"' + target +
          ' data-id="' + esc(l.id) + '" data-label="' + esc(l.label) + '"' +
          ' style="animation-delay:' + delay.toFixed(2) + 's">' +
          '<span class="icon">' + iconFor(l.url, l.icon) + '</span>' +
          '<span class="lbl">' + esc(l.label) + '</span>' +
          '</a>';
      }
      wrap.innerHTML = html;
      wrap.querySelectorAll('a[data-id]').forEach(a => {
        a.addEventListener('click', () => trackClick(a.dataset.id, a.dataset.label || ''));
      });
    }

    fetch(API + '/io-links', { headers: { 'Accept': 'application/json' } })
      .then(r => r.json())
      .then(d => render((d && d.links) || []))
      .catch(() => {
        document.getElementById('state').textContent = 'Não consegui carregar os links agora. Tente recarregar.';
      });
  </script>

  <script src="/lib/telemetria.js" defer></script>
</body>
</html>
