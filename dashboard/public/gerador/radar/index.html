<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radar da Prospecção — Irmãos na Obra</title>
<meta name="theme-color" content="#05070D">
<link rel="manifest" href="/gerador/manifest.webmanifest">
<style>
/* ─────────────────────────────────────────────────────────────────────────────
   RADAR — sala de controle da prospecção.
   Só LÊ. Não existe um único botão aqui que dispare mensagem: o disparo mora na
   tela /gerador/prospeccao, com teto e disjuntor. Radar que também atira é radar
   que alguém usa pra passar por cima da régua.
   Tudo sai das views do banco do gerador — nenhum número é calculado aqui.
   ───────────────────────────────────────────────────────────────────────────── */
:root{
  --bg:#05070D; --bg2:#0A0F1A; --card:#0D1424; --linha:rgba(120,160,255,.10);
  --txt:#E8EEFB; --dim:#7C8DB0; --faint:#4A5772;
  --ciano:#22D3EE; --verde:#34D399; --ambar:#FBBF24; --vermelho:#F87171; --azul:#60A5FA; --roxo:#A78BFA;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt); font:14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;
  min-height:100vh; overflow-x:hidden;
  background-image:
    radial-gradient(900px 500px at 15% -10%, rgba(34,211,238,.07), transparent 60%),
    radial-gradient(800px 500px at 85% 0%, rgba(167,139,250,.06), transparent 60%);
}
/* grade de fundo — o "futurista" vem daqui e do brilho dos números, não de emoji */
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.5;
  background-image:linear-gradient(var(--linha) 1px,transparent 1px),linear-gradient(90deg,var(--linha) 1px,transparent 1px);
  background-size:56px 56px;
  mask-image:radial-gradient(ellipse 100% 70% at 50% 0%,#000 30%,transparent 75%);
}
.wrap{position:relative;z-index:1;max-width:1500px;margin:0 auto;padding:20px 18px 60px}

/* ── topo ─────────────────────────────────────────────────────────────────── */
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.marca{display:flex;align-items:center;gap:11px}
.pulso{width:9px;height:9px;border-radius:50%;background:var(--ciano);box-shadow:0 0 0 0 rgba(34,211,238,.6);animation:pulso 2.4s infinite}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(34,211,238,.5)}70%{box-shadow:0 0 0 13px rgba(34,211,238,0)}100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}}
h1{font-size:16px;font-weight:750;letter-spacing:.02em}
.sub{font-size:11.5px;color:var(--faint);letter-spacing:.09em;text-transform:uppercase;font-weight:650}
.spacer{flex:1}
.relogio{font-family:var(--mono);font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.selo{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font-size:11.5px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid}
.selo i{width:7px;height:7px;border-radius:50%;display:block}

/* ── cartões ──────────────────────────────────────────────────────────────── */
.grid{display:grid;gap:13px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{
  background:linear-gradient(160deg,var(--card),var(--bg2));
  border:1px solid var(--linha); border-radius:14px; padding:16px 17px; position:relative; overflow:hidden;
}
.card::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(34,211,238,.35),transparent)}
.ct{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);font-weight:750;margin-bottom:12px}
.big{font-family:var(--mono);font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.unid{font-size:12px;color:var(--dim);margin-top:6px}

/* ── barras ───────────────────────────────────────────────────────────────── */
.barras{display:flex;align-items:flex-end;gap:3px;height:130px;margin-top:4px}
.barra{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}
.barra i{width:100%;border-radius:3px 3px 0 0;display:block;min-height:2px;transition:height .5s cubic-bezier(.4,0,.2,1)}
.barra span{font-size:8.5px;color:var(--faint);font-family:var(--mono)}
.linhaB{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.linhaB b{font-size:12.5px;font-weight:600;color:var(--txt);width:132px;flex:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trilho{flex:1;height:7px;background:rgba(255,255,255,.05);border-radius:4px;overflow:hidden}
.trilho i{display:block;height:100%;border-radius:4px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.linhaB u{font-family:var(--mono);font-size:12.5px;color:var(--dim);width:46px;text-align:right;
  text-decoration:none;font-variant-numeric:tabular-nums}

/* ── medidor do disjuntor ─────────────────────────────────────────────────── */
.medidor{position:relative;height:9px;background:rgba(255,255,255,.05);border-radius:5px;margin:14px 0 7px}
.medidor i{display:block;height:100%;border-radius:5px;transition:width .6s}
.medidor u{position:absolute;top:-5px;width:2px;height:19px;background:var(--vermelho);opacity:.8}
.mleg{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);font-family:var(--mono)}

/* ── feed ─────────────────────────────────────────────────────────────────── */
.feed{max-height:330px;overflow-y:auto;margin:-4px -6px 0}
.ev{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px solid rgba(255,255,255,.04)}
.ev i{width:7px;height:7px;border-radius:50%;flex:none}
.ev .q{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .t{font-family:var(--mono);font-size:11px;color:var(--faint);flex:none}
.vazio{text-align:center;padding:30px 16px;color:var(--faint);font-size:12.5px;line-height:1.7}

.nota{font-size:11.5px;color:var(--faint);line-height:1.65;margin-top:11px}
.erro{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.35);border-radius:11px;
  padding:12px 14px;font-size:12.5px;color:#FECACA;margin-bottom:14px;line-height:1.6}
/* ── sinal de vida ─────────────────────────────────────────────────────────── */
.vida{display:flex;align-items:center;gap:13px;padding:14px 17px;border-radius:13px;
  margin-bottom:16px;border:1px solid}
.vida .ico{width:10px;height:10px;border-radius:50%;flex:none}
.vida .txt{flex:1;font-size:13.5px;line-height:1.55}
.vida b{font-weight:750}

/* ── funil ─────────────────────────────────────────────────────────────────── */
.deg{display:flex;align-items:center;gap:13px;padding:12px 0}
.deg + .deg{border-top:1px solid rgba(255,255,255,.045)}
.deg .rot{width:180px;flex:none;font-size:13px;font-weight:600;color:var(--txt)}
.deg .rot small{display:block;font-size:10.5px;color:var(--faint);font-weight:500;margin-top:2px}
.deg .bar{flex:1;height:26px;background:rgba(255,255,255,.035);border-radius:6px;overflow:hidden;position:relative}
.deg .bar i{display:block;height:100%;border-radius:6px;transition:width .7s cubic-bezier(.4,0,.2,1)}
.deg .val{width:96px;flex:none;text-align:right;font-family:var(--mono);
  font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.deg .val small{display:block;font-size:10px;font-weight:600;color:var(--faint);font-family:inherit}
.deg.zero .val{color:var(--faint)}
@media(max-width:640px){ .deg .rot{width:118px;font-size:12px} .deg .val{width:70px;font-size:15px} }

/* ── abas ──────────────────────────────────────────────────────────────────── */
.abas{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.aba{background:transparent;border:1px solid var(--linha);color:var(--dim);padding:8px 16px;
  border-radius:9px;font-size:12.5px;font-weight:650;cursor:pointer;font-family:inherit;
  display:inline-flex;align-items:center;gap:8px;transition:all .15s}
.aba:hover{color:var(--txt);border-color:rgba(120,160,255,.28)}
.aba.on{background:rgba(34,211,238,.1);border-color:var(--ciano);color:var(--ciano)}
.aba .cnt{font-family:var(--mono);font-size:11px;opacity:.75}

/* ── busca ─────────────────────────────────────────────────────────────────── */
.busca{width:100%;padding:12px 15px;border-radius:11px;border:1px solid var(--linha);
  background:var(--bg2);color:var(--txt);font-size:14px;font-family:inherit;margin-bottom:14px}
.busca:focus{outline:none;border-color:var(--ciano)}
.busca::placeholder{color:var(--faint)}

/* ── linha de cliente ──────────────────────────────────────────────────────── */
.cli{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;
  border:1px solid transparent;transition:background .15s}
.cli:hover{background:rgba(255,255,255,.025);border-color:var(--linha)}
.cli + .cli{border-top:1px solid rgba(255,255,255,.04)}
.cli .nm{flex:1;min-width:0}
.cli .nm b{display:block;font-size:13.5px;font-weight:650;color:var(--txt);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cli .nm span{font-size:11.5px;color:var(--faint)}
.chip{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:3px 8px;border-radius:5px;flex:none;white-space:nowrap}
.cli .qd{font-family:var(--mono);font-size:11.5px;color:var(--dim);flex:none;
  width:74px;text-align:right;font-variant-numeric:tabular-nums}
.abrir{flex:none;width:30px;height:30px;border-radius:8px;border:1px solid var(--linha);
  display:grid;place-items:center;color:var(--dim);text-decoration:none;transition:all .15s}
.abrir:hover{color:var(--ciano);border-color:var(--ciano)}
.abrir svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

@media(max-width:640px){ .big{font-size:31px} .wrap{padding:14px 12px 50px} }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="marca">
      <span class="pulso"></span>
      <div>
        <h1>Radar da Prospecção</h1>
        <div class="sub">Irmãos na Obra · tempo real</div>
      </div>
    </div>
    <div class="spacer"></div>
    <div id="selo-disjuntor"></div>
    <div class="relogio" id="relogio">--:--:--</div>
  </header>

  <div id="vida"></div>

  <div class="abas" id="abas"></div>

  <!-- FUNIL POR PRODUTO -->
  <div id="painel-funil" hidden></div>


  <div id="avisos"></div>

  <!-- ONDE CADA CLIENTE ESTÁ -->
  <div id="painel-clientes" hidden>
    <input class="busca" id="q" placeholder="Buscar empresa ou cidade — digite pra ver onde qualquer cliente está"
           oninput="buscar(this.value)" autocomplete="off">
    <div id="clientes"></div>
  </div>

  <div id="painel-geral">

  <!-- números do dia -->
  <div class="grid g4" style="margin-bottom:13px" id="kpis"></div>

  <div class="grid g2" style="margin-bottom:13px">
    <div class="card">
      <div class="ct">Toques por hora · hoje</div>
      <div class="barras" id="porHora"></div>
      <div class="nota" id="notaHora"></div>
    </div>
    <div class="card">
      <div class="ct">Etapa no funil</div>
      <div id="etapas"></div>
      <div class="nota">Melhor ponto que cada contato já alcançou.</div>
    </div>
  </div>

  <div class="grid g3" style="margin-bottom:13px">
    <div class="card">
      <div class="ct">Estado da conversa</div>
      <div id="canais"></div>
    </div>
    <div class="card">
      <div class="ct">Disjuntor de opt-out · 14 dias</div>
      <div id="disjuntor"></div>
    </div>
    <div class="card">
      <div class="ct">Teto do dia por consultor</div>
      <div id="tetos"></div>
    </div>
  </div>

  <div class="grid g2">
    <div class="card">
      <div class="ct">Últimos toques</div>
      <div class="feed" id="feed"></div>
    </div>
    <div class="card">
      <div class="ct">Carteira e custo</div>
      <div id="custo"></div>
    </div>
  </div>

  </div><!-- /painel-geral -->

  <div class="nota" style="text-align:center;margin-top:22px" id="rodape">carregando…</div>
</div>

<script>
// ── conexão ────────────────────────────────────────────────────────────────
// Mesma origem e mesma chave publishable do resto do /gerador. Esta tela é
// SOMENTE LEITURA: não existe insert, update nem delete em lugar nenhum dela.
const URL_SUPA = 'https://ancecdfqfwlaujknizof.supabase.co/rest/v1';
const KEY = 'sb_publishable_IK5RV-I0PlQNpb7-cXBQFg_-pSYscO6';
const RECARGA_MS = 20000;

const H = { apikey: KEY, Authorization: 'Bearer ' + KEY };
async function ler(q){
  const r = await fetch(`${URL_SUPA}/${q}`, { headers: H });
  if (!r.ok) throw new Error(`${q.split('?')[0]}: ${r.status}`);
  return r.json();
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl = n => 'R$ ' + Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});

// ── vocabulário (espelha as views; a tela não inventa categoria) ───────────
const DESF = {
  enviei:       ['Enviei',        '#60A5FA'],
  respondeu:    ['Respondeu',     '#22D3EE'],
  interessado:  ['Interessado',   '#FBBF24'],
  vendeu:       ['Vendeu',        '#34D399'],
  sem_interesse:['Sem interesse', '#7C8DB0'],
  nao_perturbar:['Não perturbar', '#F87171'],
};
const ETAPAS = [['novo','Nunca abordado','#4A5772'],['abordado','Abordado','#60A5FA'],
  ['respondeu','Respondeu','#22D3EE'],['interessado','Interessado','#FBBF24'],
  ['cliente','Cliente','#34D399'],['encerrado','Encerrado','#3F4A63']];
const CANAIS = [['nunca_tocado','Nunca tocado','#4A5772'],['aguardando','Aguardando resposta','#60A5FA'],
  ['conversa_viva','Conversa viva','#34D399'],['sem_retorno','Sem retorno (7d+)','#FBBF24'],
  ['encerrado','Encerrado','#3F4A63'],['nao_perturbar','Não perturbar','#F87171']];

let dados = null;

async function carregar(){
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const [toquesHoje, estados, saude, tetos, custo, ultimos] = await Promise.all([
    ler(`prospeccao_toques?select=resultado,valor,consultor,criado_em&criado_em=gte.${hoje.toISOString()}`),
    ler('prospeccao_contato_estado?select=etapa,canal&limit=5000'),
    ler('prospeccao_saude?select=*'),
    ler('prospeccao_teto_hoje?select=*'),
    ler('prospeccao_custo?select=*'),
    ler('prospeccao_toques?select=resultado,valor,consultor,criado_em,contato_id&order=criado_em.desc&limit=40'),
  ]);
  // nome da empresa dos últimos toques, numa consulta só
  let nomes = {};
  const ids = [...new Set(ultimos.map(t => t.contato_id))].slice(0, 40);
  if (ids.length){
    const cs = await ler(`prospeccao_contatos?select=id,empresa,cidade&id=in.(${ids.join(',')})`);
    cs.forEach(c => nomes[c.id] = c);
  }
  dados = { toquesHoje, estados, saude, tetos, custo, ultimos, nomes };
}

// ── desenho ────────────────────────────────────────────────────────────────
function desenharKpis(){
  const t = dados.toquesHoje;
  const resp = t.filter(x => ['respondeu','interessado','vendeu'].includes(x.resultado)).length;
  const vendas = t.filter(x => x.resultado === 'vendeu');
  const receita = vendas.reduce((s,x) => s + Number(x.valor||0), 0);
  const cards = [
    ['Toques hoje', t.length, 'mensagens registradas', 'var(--azul)'],
    ['Respostas',   resp,     t.length ? Math.round(100*resp/t.length) + '% dos toques' : 'nenhum toque ainda', 'var(--ciano)'],
    ['Vendas hoje', vendas.length, 'fechadas', 'var(--verde)'],
    ['Receita hoje', brl(receita), 'registrada no toque', 'var(--roxo)'],
  ];
  document.getElementById('kpis').innerHTML = cards.map(([l,v,s,c]) =>
    `<div class="card"><div class="ct">${l}</div>
      <div class="big" style="color:${c}">${v}</div>
      <div class="unid">${s}</div></div>`).join('');
}

function desenharPorHora(){
  const balde = Array.from({length:24}, () => 0);
  dados.toquesHoje.forEach(t => { balde[new Date(t.criado_em).getHours()]++; });
  const teto = Math.max(1, ...balde);
  const agora = new Date().getHours();
  document.getElementById('porHora').innerHTML = balde.map((n,h) => {
    const alt = Math.round(100*n/teto);
    const cor = h === agora ? 'var(--ciano)' : n ? 'var(--azul)' : 'rgba(255,255,255,.05)';
    return `<div class="barra" title="${h}h — ${n} toque(s)">
      <i style="height:${Math.max(2,alt)}%;background:${cor}"></i>
      <span>${h%3===0?String(h).padStart(2,'0'):''}</span></div>`;
  }).join('');
  const total = balde.reduce((a,b)=>a+b,0);
  document.getElementById('notaHora').textContent = total
    ? `${total} toques até agora. Pico às ${balde.indexOf(Math.max(...balde))}h.`
    : 'Nenhum toque registrado hoje — a barra enche conforme a fila é trabalhada.';
}

function barrasDe(defs, campo, alvo){
  const tot = dados.estados.length || 1;
  const html = defs.map(([k,label,cor]) => {
    const n = dados.estados.filter(e => e[campo] === k).length;
    if (!n) return '';
    return `<div class="linhaB"><b>${label}</b>
      <div class="trilho"><i style="width:${(100*n/tot).toFixed(1)}%;background:${cor}"></i></div>
      <u>${n}</u></div>`;
  }).join('');
  document.getElementById(alvo).innerHTML = html ||
    '<div class="vazio">Sem contato na base ainda.</div>';
}

function desenharDisjuntor(){
  const s = dados.saude;
  if (!s.length){
    document.getElementById('disjuntor').innerHTML =
      `<div class="vazio">Nenhum toque nos últimos 14 dias.<br>O disjuntor está armado e em silêncio — ele só fala quando há o que medir.</div>`;
    return;
  }
  const COR = { ok:'var(--verde)', atencao:'var(--ambar)', travado:'var(--vermelho)' };
  document.getElementById('disjuntor').innerHTML = s.map(x => {
    const pct = Math.min(100, 100 * Number(x.taxa_optout||0) / 12);   // escala até 12%; trava em 8%
    return `<div style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <b style="font-size:13px;font-weight:650">${esc(x.consultor||'—')}</b>
        <span class="big" style="font-size:22px;color:${COR[x.estado]}">${x.taxa_optout}%</span>
      </div>
      <div class="medidor"><i style="width:${pct}%;background:${COR[x.estado]}"></i>
        <u style="left:66.6%"></u></div>
      <div class="mleg"><span>${x.optout_14d} de ${x.contatos_14d} pediram pra parar</span><span>trava em 8%</span></div>
    </div>`;
  }).join('');
}

function desenharTetos(){
  const t = dados.tetos;
  if (!t.length){ document.getElementById('tetos').innerHTML = '<div class="vazio">Nenhum consultor com toque registrado.</div>'; return; }
  document.getElementById('tetos').innerHTML = t.map(x => {
    const pct = Math.min(100, 100 * x.usados_hoje / Math.max(1, x.teto));
    const cor = pct >= 100 ? 'var(--vermelho)' : pct > 70 ? 'var(--ambar)' : 'var(--verde)';
    return `<div style="margin-bottom:14px">
      <div class="linhaB" style="margin-bottom:4px">
        <b>${esc(x.consultor)}</b>
        <div class="trilho"><i style="width:${pct}%;background:${cor}"></i></div>
        <u style="width:62px">${x.usados_hoje}/${x.teto}</u></div>
      <div style="font-size:11px;color:var(--faint);padding-left:2px">${esc(x.porque || '')}</div>
    </div>`;
  }).join('') + `<div class="nota">Teto adaptativo: base 25/semana até 100, multiplicada pela saúde de opt-out dos últimos 14 dias. Quem prova que não incomoda ganha volume sozinho.</div>`;
}

function desenharFeed(){
  const u = dados.ultimos;
  if (!u.length){
    document.getElementById('feed').innerHTML =
      `<div class="vazio">Nenhum toque registrado ainda.<br>Cada mensagem enviada pela tela de Prospecção aparece aqui.</div>`;
    return;
  }
  document.getElementById('feed').innerHTML = u.map(t => {
    const [rot, cor] = DESF[t.resultado] || [t.resultado, 'var(--dim)'];
    const c = dados.nomes[t.contato_id];
    const q = new Date(t.criado_em);
    const hoje = q.toDateString() === new Date().toDateString();
    return `<div class="ev"><i style="background:${cor}"></i>
      <div class="q"><b style="font-weight:600">${esc(c ? c.empresa : '—')}</b>
        <span style="color:var(--dim)"> · ${rot}${t.valor > 0 ? ' · ' + brl(t.valor) : ''}</span></div>
      <div class="t">${hoje ? q.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})
                            : q.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})}</div>
    </div>`;
  }).join('');
}

function desenharCusto(){
  const c = dados.custo;
  const contatos = c.reduce((s,l)=>s+Number(l.contatos||0),0);
  const clientes = c.reduce((s,l)=>s+Number(l.clientes||0),0);
  const tocados  = c.reduce((s,l)=>s+Number(l.tocados||0),0);
  const receita  = c.reduce((s,l)=>s+Number(l.receita||0),0);
  const custo    = c.reduce((s,l)=>s+Number(l.custo||0),0);
  const linhas = [
    ['Contatos na base', contatos],
    ['Já trabalhados', tocados],
    ['Viraram cliente', clientes],
    ['Receita registrada', brl(receita)],
    ['Custo das listas', custo ? brl(custo) : '—'],
    ['Custo por lead', custo && contatos ? brl(custo/contatos) : '—'],
    ['Custo por cliente', custo && clientes ? brl(custo/clientes) : '—'],
  ];
  document.getElementById('custo').innerHTML = linhas.map(([l,v]) =>
    `<div class="linhaB"><b style="width:auto;flex:1">${l}</b>
      <u style="width:auto;font-size:14px;color:var(--txt);font-weight:700">${v}</u></div>`).join('')
    + `<div class="nota">Lista sem custo lançado aparece como “—”. Zero não é “de graça”, é “não sabemos”.</div>`;
}

function desenharSelo(){
  const pior = ['travado','atencao','ok'].find(e => dados.saude.some(s => s.estado === e)) || 'ok';
  const M = {
    ok:      ['Operando',       'var(--verde)'],
    atencao: ['Atenção',        'var(--ambar)'],
    travado: ['Fila travada',   'var(--vermelho)'],
  };
  const [rot, cor] = M[pior];
  document.getElementById('selo-disjuntor').innerHTML =
    `<span class="selo" style="border-color:${cor};color:${cor}"><i style="background:${cor}"></i>${rot}</span>`;
}

function desenharAvisos(){
  const travados = dados.saude.filter(s => s.estado === 'travado');
  const semRetorno = dados.estados.filter(e => e.canal === 'sem_retorno').length;
  let h = '';
  if (travados.length) h += `<div class="erro"><b>Disjuntor armado.</b> ${travados.map(s =>
    `${esc(s.consultor)} está em ${s.taxa_optout}% de opt-out`).join(', ')}. A fila para até a abertura mudar.</div>`;
  if (semRetorno) h += `<div class="erro" style="background:rgba(251,191,36,.09);border-color:rgba(251,191,36,.32);color:#FDE68A">
    <b>${semRetorno} contatos abordados e em silêncio há mais de 7 dias.</b>
    Isso não é trabalho feito — é fila de follow-up.</div>`;
  document.getElementById('avisos').innerHTML = h;
}

// ═══ SINAL DE VIDA ══════════════════════════════════════════════════════════
// A auditoria da base pegou isto: com o worker parado, TODA seção fica vazia e
// a tela parece quebrada quando na verdade só ninguém rodou nada. Quatro
// cartões marcando zero em silêncio é a pior forma de dar essa notícia.
// Esta faixa dá a notícia primeiro, com a idade exata do último toque.
function desenharVida() {
  const ult = dados.ultimos[0];
  const el = document.getElementById('vida');
  if (!ult) {
    el.innerHTML = `<div class="vida" style="border-color:#B45309;background:rgba(245,158,11,.09)">
      <span class="ico" style="background:var(--ambar)"></span>
      <span class="txt" style="color:#FDE68A"><b>Nenhum toque registrado ainda.</b>
      A operação não começou — o painel acende quando a primeira mensagem sair.</span></div>`;
    return;
  }
  const h = (Date.now() - new Date(ult.criado_em)) / 3600000;
  const d = Math.floor(h / 24);
  const [cor, bg, fundo, msg] =
      h < 2  ? ['var(--verde)',    '#15803D', 'rgba(52,211,153,.08)',
                '<b>Operando.</b> Último toque há ' + (h < 1 ? Math.round(h * 60) + ' min' : Math.round(h) + 'h') + '.']
    : h < 26 ? ['var(--azul)',     '#1D4ED8', 'rgba(96,165,250,.08)',
                '<b>Último toque há ' + Math.round(h) + ' horas.</b> Dentro do esperado pra quem roda uma vez por dia.']
    :          ['var(--vermelho)', '#B91C1C', 'rgba(248,113,113,.10)',
                '<b>Máquina parada há ' + d + ' dias.</b> Último toque em ' +
                new Date(ult.criado_em).toLocaleDateString('pt-BR') +
                '. Os números abaixo estão zerados por isso, não porque o funil quebrou.'];
  el.innerHTML = `<div class="vida" style="border-color:${bg};background:${fundo}">
    <span class="ico" style="background:${cor}"></span>
    <span class="txt" style="color:${cor}">${msg}</span></div>`;
}

// ═══ FUNIL POR PRODUTO ══════════════════════════════════════════════════════
// Vem do servidor (/gerador/prospeccao/funil), não do PostgREST: o funil
// atravessa os dois bancos e o lado do solardoc-pro tem `sales`, que carrega
// nome, e-mail e telefone de cliente. Do servidor sai só CONTAGEM.
const API = 'https://solardocs-api.vercel.app';
let funis = null;

async function carregarFunil() {
  try {
    const r = await fetch(`${API}/gerador/prospeccao/funil?dias=90`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    funis = (await r.json()).funis || [];
  } catch (e) { funis = null; }
}

function desenharFunil() {
  const el = document.getElementById('painel-funil');
  if (!funis) {
    el.innerHTML = `<div class="card"><div class="vazio">
      Não consegui falar com o servidor do funil.<br>Os números da aba Visão geral continuam válidos.</div></div>`;
    return;
  }
  const CORES = ['#22D3EE', '#38BDF8', '#60A5FA', '#818CF8', '#A78BFA', '#C084FC', '#E879F9', '#34D399'];
  el.innerHTML = funis.map(f => {
    // O topo do funil é a régua. Etapa que não dá pra medir não vira 0 na barra:
    // vira "—", porque zero medido e zero desconhecido são coisas diferentes.
    const topo = Math.max(1, ...f.etapas.map(e => Number(e.valor) || 0));
    return `<div class="card" style="margin-bottom:13px">
      <div class="ct">${esc(f.titulo)}</div>
      <div style="padding:2px 0">
        ${f.etapas.map((e, i) => {
          const v = e.valor;
          const nulo = v === null || v === undefined;
          const pct = nulo ? 0 : Math.max(v > 0 ? 3 : 0, 100 * v / topo);
          const conv = i > 0 && !nulo && f.etapas[0].valor
            ? (100 * v / f.etapas[0].valor).toFixed(v / f.etapas[0].valor < 0.01 ? 2 : 1) + '%' : '';
          return `<div class="deg${!v ? ' zero' : ''}">
            <div class="rot">${esc(e.nome)}${e.de ? `<small>${esc(e.de)}</small>` : ''}</div>
            <div class="bar"><i style="width:${pct}%;background:${CORES[i % CORES.length]}"></i></div>
            <div class="val" style="${!nulo && v ? 'color:' + CORES[i % CORES.length] : ''}">
              ${nulo ? '—' : v.toLocaleString('pt-BR')}
              ${conv ? `<small>${conv}</small>` : (nulo && e.sub ? `<small>${esc(e.sub)}</small>` : '')}
            </div>
          </div>`;
        }).join('')}
      </div>
      ${f.obs ? `<div class="nota">${esc(f.obs)}</div>` : ''}
    </div>`;
  }).join('') + `<div class="nota" style="text-align:center">
    Últimos 90 dias. Etapa marcada com “—” não é zero: é o que ainda não dá pra medir.</div>`;
}

// ═══ ONDE CADA CLIENTE ESTÁ ═════════════════════════════════════════════════
// A visão agregada responde "quantos". Esta responde "quem, e o que faço com
// ele". São perguntas diferentes e por isso são abas diferentes — empilhar as
// duas numa tela só faria a urgente sumir embaixo da bonita.
//
// Nunca carrega os 1.107 nunca-tocados: eles não têm nada pra contar ainda. O
// que se carrega é quem tem conversa aberta (~170) e os próximos da fila (60).
// Buscar por nome vai ao banco na hora, aí sim atravessando a base inteira.

let aba = 'geral';
let cli = { agora: [], esperando: [], fila: [], busca: null, termo: '' };

const CHIP = {
  conversa_viva: ['CONVERSA VIVA', '#34D399'],
  aguardando:    ['AGUARDANDO',    '#60A5FA'],
  sem_retorno:   ['SEM RETORNO',   '#FBBF24'],
  nunca_tocado:  ['NA FILA',       '#4A5772'],
  nao_perturbar: ['NÃO PERTURBAR', '#F87171'],
  encerrado:     ['ENCERRADO',     '#3F4A63'],
};
const ETAPA_ROT = {
  novo: 'novo', abordado: 'abordado', respondeu: 'respondeu',
  interessado: 'interessado', cliente: 'CLIENTE', encerrado: 'encerrado',
};

const SVG_ABRIR = '<svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>';

/** O link que abre a conversa. Instagram primeiro: é o canal da operação. */
function linkDe(c) {
  if ((c.instagram || '').trim()) return 'https://www.instagram.com/' + c.instagram + '/';
  if ((c.telefone || '').trim())  return 'https://wa.me/' + c.telefone;
  return null;
}

function linhaCliente(c) {
  const [rot, cor] = CHIP[c.canal] || [c.canal, 'var(--dim)'];
  const href = linkDe(c);
  const quando = c.dias_desde_ultimo_toque === null || c.dias_desde_ultimo_toque === undefined
    ? '—'
    : (c.dias_desde_ultimo_toque === 0 ? 'hoje' : c.dias_desde_ultimo_toque + 'd');
  const onde = [c.cidade, c.uf].filter(Boolean).join('/');
  const marca = (c.instagram || '').trim() ? '@' + c.instagram : (c.telefone || '');
  return `<div class="cli">
    <div class="nm">
      <b>${esc(c.empresa)}</b>
      <span>${esc(onde)}${onde && marca ? ' · ' : ''}${esc(marca)}${
        c.etapa && c.etapa !== 'novo' ? ' · ' + ETAPA_ROT[c.etapa] : ''}</span>
    </div>
    <span class="chip" style="background:${cor}1f;color:${cor}">${rot}</span>
    <span class="qd">${quando}</span>
    ${href ? `<a class="abrir" href="${href}" target="_blank" rel="noopener"
       title="abrir conversa">${SVG_ABRIR}</a>` : '<span style="width:30px"></span>'}
  </div>`;
}

function bloco(titulo, lista, vazioTxt, nota) {
  return `<div class="card" style="margin-bottom:13px">
    <div class="ct">${titulo}<span class="spacer"></span>
      <span class="mono" style="color:var(--dim);font-size:12px">${lista.length}</span></div>
    ${lista.length ? lista.map(linhaCliente).join('') : `<div class="vazio">${vazioTxt}</div>`}
    ${nota ? `<div class="nota">${nota}</div>` : ''}
  </div>`;
}

async function carregarClientes() {
  const campos = 'contato_id,empresa,telefone,etapa,canal,dias_desde_ultimo_toque,ultimo_resultado';
  const [abertas, fila] = await Promise.all([
    // conversa aberta: quem respondeu, quem está esperando, quem sumiu
    ler(`prospeccao_contato_estado?select=${campos}&canal=in.(conversa_viva,aguardando,sem_retorno)` +
        `&order=dias_desde_ultimo_toque.asc&limit=400`),
    // os próximos da fila, na ORDEM EXATA em que o worker vai pegá-los
    ler('prospeccao_fila_worker?select=id,empresa,cidade,uf,telefone,instagram,etapa,canal,dias_desde_ultimo_toque&limit=60'),
  ]);
  // cidade e @ moram em prospeccao_contatos, não na view de estado; uma consulta
  // só pros que vão aparecer, em vez de inchar a view pra todo mundo
  const ids = abertas.map(c => c.contato_id).slice(0, 400);
  let extra = new Map();
  if (ids.length) {
    const cs = await ler(`prospeccao_contatos?select=id,cidade,uf,instagram&id=in.(${ids.join(',')})`);
    cs.forEach(c => extra.set(c.id, c));
  }
  const rico = abertas.map(c => ({ ...c, ...(extra.get(c.contato_id) || {}) }));

  cli.agora     = rico.filter(c => c.canal === 'conversa_viva');
  cli.esperando = rico.filter(c => c.canal === 'aguardando' || c.canal === 'sem_retorno');
  cli.fila      = fila;
}

function renderClientes() {
  const el = document.getElementById('clientes');
  if (cli.termo) {
    el.innerHTML = cli.busca === null
      ? '<div class="vazio">procurando…</div>'
      : bloco(`Resultado para “${esc(cli.termo)}”`, cli.busca,
          'Nenhuma empresa com esse nome na base.',
          'A busca atravessa os 1.299 contatos, inclusive os que ainda não foram abordados.');
    return;
  }
  el.innerHTML =
    bloco('Precisa de você agora', cli.agora,
      'Nenhuma conversa viva ainda.<br>Assim que alguém responder, aparece aqui primeiro.',
      'Quem respondeu e a conversa está de pé. É por aqui que se começa o dia.') +
    bloco('Esperando retorno', cli.esperando.slice(0, 60),
      'Ninguém aguardando resposta.',
      cli.esperando.length > 60
        ? `Mostrando 60 de ${cli.esperando.length}, os que sumiram há menos tempo primeiro — quem sumiu ontem volta mais que quem sumiu mês passado.`
        : 'Abordados que ainda não responderam.') +
    bloco('Próximos na fila', cli.fila,
      'Fila vazia — ou todos já foram tocados hoje.',
      'A ordem exata em que o worker vai pegá-los. Follow-up antes de contato frio, integradora antes de mista.');
}

let buscaTimer = null;
function buscar(termo) {
  cli.termo = termo.trim();
  clearTimeout(buscaTimer);
  if (!cli.termo) { cli.busca = null; renderClientes(); return; }
  cli.busca = null; renderClientes();
  // 350ms: digitar "energia" não pode virar 7 consultas
  buscaTimer = setTimeout(async () => {
    const t = encodeURIComponent('*' + cli.termo.replace(/[*,()]/g, '') + '*');
    try {
      const r = await ler(`prospeccao_contatos?select=id,empresa,cidade,uf,telefone,instagram` +
        `&or=(empresa.ilike.${t},cidade.ilike.${t})&limit=50`);
      const ids = r.map(c => c.id);
      let est = new Map();
      if (ids.length) {
        const e = await ler(`prospeccao_contato_estado?select=contato_id,etapa,canal,dias_desde_ultimo_toque` +
          `&contato_id=in.(${ids.join(',')})`);
        e.forEach(x => est.set(x.contato_id, x));
      }
      cli.busca = r.map(c => ({ ...c, ...(est.get(c.id) || { canal: 'nunca_tocado', etapa: 'novo' }) }));
    } catch { cli.busca = []; }
    renderClientes();
  }, 350);
}

function renderAbas() {
  const abertas = cli.agora.length + cli.esperando.length;
  const defs = [
    ['geral',    'Visão geral', null],
    ['funil',    'Funil de vendas', null],
    ['clientes', 'Onde cada cliente está', abertas || null],
  ];
  document.getElementById('abas').innerHTML = defs.map(([k, l, n]) =>
    `<button class="aba${aba === k ? ' on' : ''}" onclick="irAba('${k}')">${l}` +
    (n ? `<span class="cnt">${n}</span>` : '') + '</button>').join('');
  document.getElementById('painel-geral').hidden    = aba !== 'geral';
  document.getElementById('painel-funil').hidden    = aba !== 'funil';
  document.getElementById('painel-clientes').hidden = aba !== 'clientes';
}
function irAba(k) {
  aba = k; renderAbas();
  if (k === 'clientes') renderClientes();
  if (k === 'funil')    desenharFunil();
}

// ── ciclo ──────────────────────────────────────────────────────────────────
function relogio(){
  document.getElementById('relogio').textContent =
    new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
async function ciclo(){
  try {
    await carregar();
    await Promise.all([carregarClientes(), carregarFunil()]);
    renderAbas();
    if (aba === 'clientes' && !cli.termo) renderClientes();
    if (aba === 'funil') desenharFunil();
    desenharVida();
    desenharSelo(); desenharAvisos(); desenharKpis(); desenharPorHora();
    barrasDe(ETAPAS,'etapa','etapas'); barrasDe(CANAIS,'canal','canais');
    desenharDisjuntor(); desenharTetos(); desenharFeed(); desenharCusto();
    document.getElementById('rodape').textContent =
      `atualizado ${new Date().toLocaleTimeString('pt-BR')} · recarrega a cada ${RECARGA_MS/1000}s · somente leitura`;
  } catch(e){
    // Falha de leitura NÃO pode virar tela zerada: número inventado é pior que
    // número ausente. A tela mantém o último bom e diz que está velha.
    document.getElementById('rodape').innerHTML =
      `<span style="color:var(--vermelho)">falha ao atualizar (${esc(e.message)}) — os números acima são da última leitura boa</span>`;
  }
}
relogio(); setInterval(relogio, 1000);
ciclo(); setInterval(ciclo, RECARGA_MS);
</script>
</body>
</html>
