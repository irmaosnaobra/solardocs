<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radar da Prospecção — Irmãos na Obra</title>
<meta name="theme-color" content="#07090F">
<link rel="manifest" href="/gerador/manifest.webmanifest">
<style>
/* ─────────────────────────────────────────────────────────────────────────────
   RADAR — sala de controle da prospecção. SOMENTE LEITURA.
   Nenhum botão aqui dispara mensagem: o disparo mora em /gerador/prospeccao,
   onde vivem o teto e o disjuntor. Radar que também atira é radar que alguém
   usa pra passar por cima da régua.
   ───────────────────────────────────────────────────────────────────────────── */
:root{
  color-scheme:dark;
  --bg:#07090F; --sup:#0C1017; --sup2:#11161F; --linha:rgba(140,170,225,.11);
  --txt:#EEF2F9; --dim:#8FA0BC; --faint:#5A6982;
  --s1:#86b6ef; --s4:#3987e5; --s8:#184f95;   /* rampa sequencial: progressão */
  --bom:#0ca30c; --atencao:#fab219; --serio:#ec835a; --critico:#d03b3b;  /* status: reservadas */
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--txt);
  font:15px/1.5 ui-sans-serif,system-ui,-apple-system,'Segoe UI',Inter,sans-serif;
  min-height:100vh; letter-spacing:-.006em;
  background-image:
    radial-gradient(1000px 520px at 12% -8%, rgba(57,135,229,.10), transparent 62%),
    radial-gradient(760px 420px at 92% -4%, rgba(144,133,233,.07), transparent 60%);
  background-attachment:fixed;
}
.wrap{max-width:1360px;margin:0 auto;padding:22px 20px 72px}

header{display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:18px}
.marca{display:flex;align-items:center;gap:12px}
.pulso{width:10px;height:10px;border-radius:50%;background:var(--s4);flex:none;
  box-shadow:0 0 0 0 rgba(57,135,229,.55);animation:pulso 2.6s infinite}
@keyframes pulso{70%{box-shadow:0 0 0 14px rgba(57,135,229,0)}100%{box-shadow:0 0 0 0 rgba(57,135,229,0)}}
h1{font-size:17px;font-weight:700;letter-spacing:-.02em}
.sub{font-size:11px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-top:1px}
.spacer{flex:1}
.relogio{font-family:var(--mono);font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}

.vida{display:flex;align-items:center;gap:13px;padding:15px 18px;border-radius:var(--r);
  margin-bottom:18px;border:1px solid;font-size:14px;line-height:1.55}
.vida i{width:9px;height:9px;border-radius:50%;flex:none}
.vida b{font-weight:700}

.abas{display:flex;gap:7px;margin-bottom:18px;flex-wrap:wrap}
.aba{background:transparent;border:1px solid var(--linha);color:var(--dim);padding:9px 17px;
  border-radius:10px;font:600 13.5px/1 inherit;cursor:pointer;display:inline-flex;
  align-items:center;gap:9px;transition:.15s}
.aba:hover{color:var(--txt);border-color:rgba(140,170,225,.3)}
.aba.on{background:rgba(57,135,229,.13);border-color:var(--s4);color:#9CC5F5}
.aba .cnt{font-family:var(--mono);font-size:11.5px;opacity:.8}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(390px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.card{background:linear-gradient(163deg,var(--sup2),var(--sup));border:1px solid var(--linha);
  border-radius:var(--r);padding:18px 19px;position:relative;overflow:hidden}
.card::after{content:'';position:absolute;top:0;left:18px;right:18px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(57,135,229,.4),transparent)}
.ct{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  font-weight:750;margin-bottom:15px;display:flex;align-items:center;gap:9px}
.big{font-family:var(--mono);font-size:40px;font-weight:750;line-height:.95;
  font-variant-numeric:tabular-nums;letter-spacing:-.035em}
.unid{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.45}

svg.g{width:100%;height:auto;display:block;overflow:visible}
.grade{stroke:rgba(255,255,255,.055);stroke-width:1}
.eixo{fill:#5A6982;font:500 10.5px var(--mono)}
.agora{stroke:var(--s1);stroke-width:1;stroke-dasharray:3 4;opacity:.55}
.cross{stroke:var(--s1);stroke-width:1;pointer-events:none}
.med{max-width:340px}

.fn{display:flex;align-items:center;gap:14px;padding:10px 0;cursor:default;
  border-radius:8px;transition:background .15s}
.fn:hover{background:rgba(255,255,255,.022)}
.fn + .fn{border-top:1px solid rgba(255,255,255,.045)}
.fn-rot{width:172px;flex:none}
.fn-rot b{display:block;font-size:13.5px;font-weight:600}
.fn-rot small{display:block;font-size:10.5px;color:var(--faint);font-weight:500;margin-top:2px;line-height:1.35}
.fn-tr{flex:1;height:24px;background:rgba(255,255,255,.038);border-radius:5px;
  overflow:hidden;position:relative;display:flex;align-items:center}
.fn-tr i{display:block;height:100%;border-radius:5px;transition:width .8s cubic-bezier(.32,.72,.31,1)}
.fn-vazio{position:absolute;left:10px;font-size:10.5px;color:var(--faint);
  font-style:normal;text-decoration:none}
.fn-val{width:104px;flex:none;text-align:right;font-family:var(--mono);
  font-size:19px;font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.fn-val small{display:block;font:500 10px/1.3 ui-sans-serif,system-ui,sans-serif;
  color:var(--faint);margin-top:3px;letter-spacing:0}

.emp{display:flex;height:34px;border-radius:7px;overflow:hidden;gap:2px;background:rgba(255,255,255,.03)}
.emp i{display:flex;align-items:center;justify-content:center;font:750 11px var(--mono);
  color:rgba(0,0,0,.62);cursor:default;transition:width .8s cubic-bezier(.32,.72,.31,1)}
.emp i:first-child{border-radius:7px 0 0 7px}
.emp i:last-child{border-radius:0 7px 7px 0}
.leg{display:flex;flex-wrap:wrap;gap:7px 18px;margin-top:14px}
.leg span{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim)}
.leg i{width:9px;height:9px;border-radius:3px;flex:none}
.leg b{color:var(--txt);font-family:var(--mono);font-weight:700}

.dica{position:fixed;z-index:99;display:none;pointer-events:none;
  background:#161C27;border:1px solid rgba(140,170,225,.26);border-radius:9px;
  padding:9px 12px;font-size:12.5px;line-height:1.5;color:var(--txt);
  box-shadow:0 10px 30px rgba(0,0,0,.55);max-width:250px}
.dica .dim{color:var(--dim);font-size:11.5px}

.busca{width:100%;padding:13px 16px;border-radius:11px;border:1px solid var(--linha);
  background:var(--sup);color:var(--txt);font:15px inherit;margin-bottom:15px}
.busca:focus{outline:none;border-color:var(--s4);background:var(--sup2)}
.busca::placeholder{color:var(--faint)}
.cli{display:flex;align-items:center;gap:13px;padding:12px;border-radius:10px;transition:background .15s}
.cli:hover{background:rgba(255,255,255,.028)}
.cli + .cli{border-top:1px solid rgba(255,255,255,.042)}
.cli .nm{flex:1;min-width:0}
.cli .nm b{display:block;font-size:14px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.cli .nm span{font-size:12px;color:var(--faint)}
.chip{font:700 10px/1 inherit;letter-spacing:.05em;text-transform:uppercase;
  padding:5px 9px;border-radius:6px;flex:none;white-space:nowrap}
.cli .qd{font-family:var(--mono);font-size:12px;color:var(--dim);flex:none;
  width:64px;text-align:right;font-variant-numeric:tabular-nums}
.abrir{flex:none;width:32px;height:32px;border-radius:9px;border:1px solid var(--linha);
  display:grid;place-items:center;color:var(--faint);text-decoration:none;transition:.15s}
.abrir:hover{color:var(--s1);border-color:var(--s4);background:rgba(57,135,229,.1)}
.abrir svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}

.feed{max-height:340px;overflow-y:auto;margin:0 -6px}
.feed::-webkit-scrollbar{width:6px}
.feed::-webkit-scrollbar-thumb{background:rgba(140,170,225,.2);border-radius:3px}
.ev{display:flex;align-items:center;gap:11px;padding:10px 6px;
  border-bottom:1px solid rgba(255,255,255,.042)}
.ev i{width:7px;height:7px;border-radius:50%;flex:none}
.ev .q{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .t{font-family:var(--mono);font-size:11px;color:var(--faint);flex:none}

.vazio{text-align:center;padding:34px 18px;color:var(--faint);font-size:13px;line-height:1.75}
.nota{font-size:12px;color:var(--faint);line-height:1.65;margin-top:14px}
.aviso{border-radius:11px;padding:13px 16px;font-size:13px;margin-bottom:14px;line-height:1.6;border:1px solid}

@media(max-width:720px){
  .wrap{padding:16px 13px 56px}
  .big{font-size:32px}
  .fn-rot{width:112px}.fn-rot small{display:none}
  .fn-val{width:74px;font-size:16px}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="marca">
      <span class="pulso"></span>
      <div>
        <h1>Radar da Prospecção</h1>
        <div class="sub">Irmãos na Obra · tempo real</div>
      </div>
    </div>
    <div class="spacer"></div>
    <div id="selo"></div>
    <div class="relogio" id="relogio">--:--:--</div>
  </header>

  <div id="vida"></div>
  <div class="abas" id="abas"></div>
  <div id="avisos"></div>

  <div id="p-geral">
    <div class="grid g4" style="margin-bottom:14px" id="kpis"></div>
    <div class="grid g2" style="margin-bottom:14px">
      <div class="card">
        <div class="ct">Toques por hora · hoje</div>
        <div id="gHora"></div>
        <div class="nota" id="notaHora"></div>
      </div>
      <div class="card">
        <div class="ct">Etapa no funil<span class="spacer"></span>
          <span style="font-family:var(--mono);color:var(--dim);font-size:11.5px" id="etTot"></span></div>
        <div id="gEtapa"></div>
        <div class="nota">Melhor ponto que cada contato já alcançou. A ordem é a progressão.</div>
      </div>
    </div>
    <div class="grid g3">
      <div class="card"><div class="ct">Estado da conversa</div><div id="gCanal"></div></div>
      <div class="card"><div class="ct">Risco de bloqueio · 14 dias</div><div id="gRisco"></div></div>
      <div class="card"><div class="ct">Últimos toques</div><div class="feed" id="feed"></div></div>
    </div>
  </div>

  <div id="p-funil" hidden></div>

  <div id="p-clientes" hidden>
    <input class="busca" id="q" autocomplete="off"
      placeholder="Buscar empresa ou cidade — digite pra ver onde qualquer cliente está"
      oninput="buscar(this.value)">
    <div id="clientes"></div>
  </div>

  <div class="nota" style="text-align:center;margin-top:26px" id="rodape">carregando…</div>
</div>

<script>
// Rede de seguranca: pinta a falha na tela em vez de deixar a pagina muda.
// Vale tambem pro erro de carregar modulo, que nao passa por try/catch nenhum.
window.addEventListener('error', ev => {
  const p = document.getElementById('rodape'); if (!p) return;
  const onde = ev.filename ? ' (' + String(ev.filename).split('/').pop() + ':' + ev.lineno + ')' : '';
  p.innerHTML = '<span style="color:#d03b3b">a tela nao carregou: '
    + String(ev.message || 'erro').replace(/[<>]/g, '') + onde
    + ' — me mande esta linha</span>';
}, true);
</script>
<script type="module">
// ─────────────────────────────────────────────────────────────────────────
// GRÁFICOS — embutidos de proposito, nao importados de arquivo ao lado.
//
// Eram um `import './grafico.js'`. O servidor tira a barra final do endereco
// (/gerador/radar/ vira /gerador/radar), entao o caminho relativo resolvia
// contra /gerador/ e batia 404. Modulo que nao carrega nao roda NADA: a
// pagina ficava com os cartoes vazios, o relogio em --:--:-- e nenhum erro
// visivel. Embutido, nao existe caminho pra errar.
// ─────────────────────────────────────────────────────────────────────────
const { funil, porHora, empilhada, medidor, RAMPA, STATUS } = (() => {
/* ─────────────────────────────────────────────────────────────────────────────
   GRÁFICOS DO RADAR — SVG puro, sem biblioteca.

   Por que sem biblioteca: a página é servida estática do próprio domínio e o
   resto do /gerador é assim. Um CDN a mais é um ponto de falha a mais numa tela
   que o dono deixa aberta o dia inteiro.

   REGRAS DE COR (não são gosto, são função):
   · funil e etapa são PROGRESSÃO → rampa sequencial de UMA cor, clara→escura.
     Oito cores categóricas num funil sugeririam oito coisas sem relação.
   · canal é ESTADO → paleta de status, sempre com rótulo do lado. Cor nunca
     carrega o significado sozinha.
   · toques por hora é UMA série → uma cor, sem legenda: o título já a nomeia.

   Toda forma com marca tem tooltip no hover. Gráfico em HTML que não responde
   ao mouse desperdiça o meio.
   ───────────────────────────────────────────────────────────────────────────── */

const NS = 'http://www.w3.org/2000/svg';
const el = (t, a = {}) => {
  const e = document.createElementNS(NS, t);
  for (const k in a) e.setAttribute(k, a[k]);
  return e;
};
const fmt = n => Number(n || 0).toLocaleString('pt-BR');

// Rampa sequencial azul (clara → escura). Monotônica em luminosidade, que é o
// que uma rampa sequencial precisa provar — o validador categórico não se aplica.
const RAMPA = ['#86b6ef', '#6da7ec', '#5598e7', '#3987e5', '#2a78d6', '#256abf', '#1c5cab', '#184f95'];
// Status: reservadas, nunca reaproveitadas como "série 5".
const STATUS = { bom: '#0ca30c', atencao: '#fab219', serio: '#ec835a', critico: '#d03b3b', neutro: '#4A5772' };

const degrau = (i, n) => RAMPA[Math.min(RAMPA.length - 1, Math.round(i * (RAMPA.length - 1) / Math.max(1, n - 1)))];

// ── tooltip único, reaproveitado por todos os gráficos ──────────────────────
let dica;
function mostrar(x, y, html) {
  if (!dica) {
    dica = document.createElement('div');
    dica.className = 'dica';
    document.body.appendChild(dica);
  }
  dica.innerHTML = html;
  dica.style.display = 'block';
  const r = dica.getBoundingClientRect();
  dica.style.left = Math.min(window.innerWidth - r.width - 12, Math.max(8, x - r.width / 2)) + 'px';
  dica.style.top = Math.max(8, y - r.height - 14) + 'px';
}
function esconder() { if (dica) dica.style.display = 'none'; }

/* ── FUNIL ────────────────────────────────────────────────────────────────────
   Barras horizontais em rampa, com a taxa de passagem ENTRE as etapas. A queda
   entre dois degraus é a informação: mostrar só o total de cada etapa esconde
   onde o funil vaza. Etapa que não dá pra medir vira faixa vazada com "—" —
   zero medido e zero desconhecido não podem ter o mesmo desenho. */
function funil(alvo, etapas) {
  alvo.innerHTML = '';
  const validos = etapas.map(e => Number(e.valor) || 0);
  const topo = Math.max(1, ...validos);
  const LARG = 100, ALT_L = 38, GAP = 13;

  etapas.forEach((e, i) => {
    const nulo = e.valor === null || e.valor === undefined;
    const v = nulo ? 0 : Number(e.valor);
    const pct = nulo ? 0 : (100 * v / topo);
    const cor = degrau(i, etapas.length);

    const linha = document.createElement('div');
    linha.className = 'fn';
    const passagem = i > 0 && !nulo && validos[i - 1] > 0
      ? (100 * v / validos[i - 1]) : null;

    linha.innerHTML = `
      <div class="fn-rot">
        <b>${e.nome}</b>
        ${e.de ? `<small>${e.de}</small>` : ''}
      </div>
      <div class="fn-tr">
        <i style="width:${nulo ? 0 : Math.max(v > 0 ? 1.5 : 0, pct)}%;background:${cor}"></i>
        ${nulo ? '<u class="fn-vazio">não medido ainda</u>' : ''}
      </div>
      <div class="fn-val" style="color:${nulo ? 'var(--faint)' : v ? cor : 'var(--faint)'}">
        ${nulo ? '—' : fmt(v)}
        ${passagem !== null ? `<small>${passagem.toFixed(passagem < 10 ? 1 : 0)}% da anterior</small>` : ''}
      </div>`;

    if (!nulo) {
      linha.addEventListener('mousemove', ev => mostrar(ev.clientX, ev.clientY,
        `<b>${e.nome}</b><br>${fmt(v)} ${v === 1 ? 'contato' : 'contatos'}` +
        (passagem !== null ? `<br><span class="dim">${passagem.toFixed(1)}% vieram da etapa anterior</span>` : '') +
        (validos[0] ? `<br><span class="dim">${(100 * v / validos[0]).toFixed(1)}% do topo do funil</span>` : '')));
      linha.addEventListener('mouseleave', esconder);
    }
    alvo.appendChild(linha);
  });
}

/* ── SÉRIE TEMPORAL ───────────────────────────────────────────────────────────
   Área + linha, uma série, com crosshair. Área porque o volume acumulado do dia
   é a leitura natural; linha por cima porque a área sozinha esconde a variação
   quando os números são pequenos. */
function porHora(alvo, baldes, horaAtual) {
  alvo.innerHTML = '';
  const W = 720, H = 190, ML = 34, MR = 12, MT = 14, MB = 26;
  const iw = W - ML - MR, ih = H - MT - MB;
  const topo = Math.max(2, ...baldes);
  const x = h => ML + (h / 23) * iw;
  const y = v => MT + ih - (v / topo) * ih;

  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, class: 'g', preserveAspectRatio: 'none' });

  // grade recessiva: 3 linhas, nada mais
  for (let k = 0; k <= 2; k++) {
    const v = Math.round(topo * k / 2), yy = y(v);
    svg.appendChild(el('line', { x1: ML, x2: W - MR, y1: yy, y2: yy, class: 'grade' }));
    const t = el('text', { x: ML - 7, y: yy + 4, class: 'eixo', 'text-anchor': 'end' });
    t.textContent = v; svg.appendChild(t);
  }

  const pts = baldes.map((v, h) => [x(h), y(v)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');

  const grad = el('linearGradient', { id: 'gArea', x1: '0', y1: '0', x2: '0', y2: '1' });
  grad.appendChild(el('stop', { offset: '0%', 'stop-color': RAMPA[3], 'stop-opacity': '.42' }));
  grad.appendChild(el('stop', { offset: '100%', 'stop-color': RAMPA[3], 'stop-opacity': '0' }));
  const defs = el('defs'); defs.appendChild(grad); svg.appendChild(defs);

  svg.appendChild(el('path', { d: `${d} L ${x(23)} ${y(0)} L ${x(0)} ${y(0)} Z`, fill: 'url(#gArea)' }));
  svg.appendChild(el('path', { d, fill: 'none', stroke: RAMPA[3], 'stroke-width': '2',
    'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));

  // marca a hora atual — dá a leitura de "onde estamos no dia"
  if (horaAtual >= 0) {
    svg.appendChild(el('line', { x1: x(horaAtual), x2: x(horaAtual), y1: MT, y2: MT + ih, class: 'agora' }));
  }

  baldes.forEach((v, h) => {
    if (h % 3 === 0) {
      const t = el('text', { x: x(h), y: H - 7, class: 'eixo', 'text-anchor': 'middle' });
      t.textContent = String(h).padStart(2, '0'); svg.appendChild(t);
    }
    if (v > 0) svg.appendChild(el('circle', { cx: x(h), cy: y(v), r: '3.5', fill: RAMPA[3],
      stroke: 'var(--bg2)', 'stroke-width': '2' }));
  });

  // faixa invisível por hora: alvo de mouse maior que a marca
  const cross = el('line', { x1: 0, x2: 0, y1: MT, y2: MT + ih, class: 'cross', opacity: '0' });
  svg.appendChild(cross);
  baldes.forEach((v, h) => {
    const hit = el('rect', { x: x(h) - iw / 46, y: MT, width: iw / 23, height: ih, fill: 'transparent' });
    hit.addEventListener('mousemove', ev => {
      cross.setAttribute('x1', x(h)); cross.setAttribute('x2', x(h)); cross.setAttribute('opacity', '1');
      mostrar(ev.clientX, ev.clientY,
        `<b>${String(h).padStart(2, '0')}:00</b><br>${v} ${v === 1 ? 'toque' : 'toques'}`);
    });
    hit.addEventListener('mouseleave', () => { cross.setAttribute('opacity', '0'); esconder(); });
    svg.appendChild(hit);
  });

  alvo.appendChild(svg);
}

/* ── BARRA EMPILHADA (etapa = progressão) ─────────────────────────────────────
   Uma barra só, segmentos em rampa, 2px de respiro entre eles. Segmento pequeno
   demais pra rotular não recebe número em cima — vai pra legenda. */
function empilhada(alvo, itens, total) {
  alvo.innerHTML = '';
  const t = Math.max(1, total || itens.reduce((s, i) => s + i.n, 0));
  const barra = document.createElement('div');
  barra.className = 'emp';
  itens.forEach((it, i) => {
    if (!it.n) return;
    const pct = 100 * it.n / t;
    const seg = document.createElement('i');
    seg.style.width = pct + '%';
    seg.style.background = it.cor || degrau(i, itens.length);
    if (pct > 7) seg.textContent = fmt(it.n);
    seg.addEventListener('mousemove', ev => mostrar(ev.clientX, ev.clientY,
      `<b>${it.rot}</b><br>${fmt(it.n)} · ${pct.toFixed(1)}%`));
    seg.addEventListener('mouseleave', esconder);
    barra.appendChild(seg);
  });
  alvo.appendChild(barra);

  const leg = document.createElement('div');
  leg.className = 'leg';
  leg.innerHTML = itens.filter(i => i.n).map((it, i) =>
    `<span><i style="background:${it.cor || degrau(i, itens.length)}"></i>${it.rot}
      <b>${fmt(it.n)}</b></span>`).join('');
  alvo.appendChild(leg);
}

/* ── MEDIDOR (opt-out contra o limite) ────────────────────────────────────────
   Bullet chart: a medida contra a faixa aceitável e o limite. Melhor que um
   número solto porque mostra QUANTO falta pra travar, não só onde está. */
function medidor(alvo, valor, limite, faixas) {
  alvo.innerHTML = '';
  const W = 320, H = 54, ML = 4, MR = 4;
  const escala = Math.max(limite * 1.35, valor * 1.15, 1);
  const px = v => ML + (v / escala) * (W - ML - MR);

  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, class: 'g med' });
  faixas.forEach(f => {
    svg.appendChild(el('rect', {
      x: px(f.de), y: 14, width: Math.max(0, px(f.ate) - px(f.de)), height: 16,
      fill: f.cor, opacity: '.20', rx: '3',
    }));
  });

  const cor = valor >= limite ? STATUS.critico
    : valor >= limite / 2 ? STATUS.atencao : STATUS.bom;
  svg.appendChild(el('rect', { x: ML, y: 18, width: Math.max(3, px(valor) - ML), height: 8,
    fill: cor, rx: '4' }));
  // o limite: linha grossa, o marco que importa
  svg.appendChild(el('line', { x1: px(limite), x2: px(limite), y1: 10, y2: 34,
    stroke: STATUS.critico, 'stroke-width': '2.5' }));
  const lb = el('text', { x: px(limite), y: 47, class: 'eixo', 'text-anchor': 'middle', fill: STATUS.critico });
  lb.textContent = `trava em ${limite}%`;
  svg.appendChild(lb);
  const v0 = el('text', { x: ML, y: 9, class: 'eixo' });
  v0.textContent = '0%'; svg.appendChild(v0);

  alvo.appendChild(svg);
}
  return { funil, porHora, empilhada, medidor, RAMPA, STATUS };
})();

const faixa = (cor, txt) =>

function vida(){

  const h = (Date.now() - new Date(u.criado_em)) / 36e5;
  if (h < 2)  { e.innerHTML = faixa(STATUS.bom,
    `<b>Operando.</b> Último toque há ${h < 1 ? Math.round(h*60)+' min' : Math.round(h)+'h'}.`); return; }

    `<b>Último toque há ${Math.round(h)} horas.</b> Dentro do esperado pra quem roda uma vez por dia.`); return; }
  e.innerHTML = faixa(STATUS.critico,
    `<b>Máquina parada há ${Math.floor(h/24)} dias.</b> Último toque em ${new Date(u.criado_em).toLocaleDateString('pt-BR')}. Os números abaixo estão zerados por isso, não porque o funil quebrou.`);
