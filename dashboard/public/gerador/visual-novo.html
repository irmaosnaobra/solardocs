<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Visual do Gerador</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#F2F4F8;color:#0F1B2D}
main{padding:24px;text-align:center}
p{margin:0 0 12px;font-size:18px}
a{color:#1D4ED8;font-weight:600}
</style>
</head>
<body>
<main>
<p id="msg">Visual novo ligado neste aparelho.</p>
<a href="/gerador">Abrir o Gerador</a>
</main>
<script>
(function () {
  try {
    localStorage.setItem('gerador-visual', 'novo');
  } catch (e) {
    document.getElementById('msg').textContent = 'Não consegui gravar neste navegador.';
    return;
  }
  setTimeout(function () { location.replace('/gerador'); }, 1000);
})();
</script>
</body>
</html>
