<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planilha de clientes | Irmãos na Obra</title>
<meta name="theme-color" content="#0B1220">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" sizes="192x192" href="/gerador/icon-192.png">
<script>
  // Mesma auth do /gerador. Sem sessão, volta para a tela de login.
  (function(){
    var AUTH_KEY = 'irmaos-na-obra-auth-v1';
    var authed = false;
    try { authed = !!localStorage.getItem(AUTH_KEY); } catch(e){}
    // Modo embutido (aba Planilha de clientes do Solar): a página roda dentro de um iframe do /gerador.
    var emb = false;
    try { emb = window.self !== window.top; } catch (e) { emb = true; }
    window.__embutida = emb;
    if (emb) document.documentElement.classList.add('gc-embutida');
    if (!authed) {
      // Navegar aqui carregaria o app inteiro dentro do iframe: no modo embutido só avisa (veja semSessaoEmbutida).
      if (emb) window.__semSessao = true; else location.replace('/gerador');
    }
  })();
</script>
<style>
/* ── Papéis de cor da página ─────────────────────────────────────────────────
   Visual antigo (sem io2): escuro nativo, como os outros subapps.
   Visual novo (html.io2): cada papel aponta para o token do papel, no claro e no escuro.
   Nenhuma cor escrita à mão fora deste bloco. */
:root{
  --gc-bg:#0F172A; --gc-sf:#1E293B; --gc-sf2:#172033; --gc-sf3:#2A3A52; --gc-bd:#334155; --gc-campo:#7C8DA5;
  --gc-tx:#E5E7EB; --gc-tx2:#B4C0D2; --gc-tx3:#98A8BF; --gc-tit:#F8FAFC;
  --gc-link:#7DB4FF; --gc-fill:#1D4ED8; --gc-marcado:#1D4ED8; --gc-sel:#7DB4FF;
  --gc-ok:#4ADE80; --gc-er:#F87171; --gc-av:#FBBF24; --gc-av-sf:#3A2A0C;
  /* Campo em branco: vermelho bem claro no fundo e na borda, mais a palavra "Falta". No visual antigo é o vermelho translúcido equivalente ao token. */
  --gc-falta:rgba(248,113,113,.16); --gc-falta-bd:rgba(248,113,113,.55);
  --gc-top:0px; --gc-left:0px; --gc-bottom:0px;
}
html.io2{
  --gc-bg:var(--n-bg); --gc-sf:var(--n-sf); --gc-sf2:var(--n-sf2); --gc-sf3:var(--n-sf3); --gc-bd:var(--n-bd); --gc-campo:var(--io-borda-campo);
  --gc-tx:var(--n-tx); --gc-tx2:var(--n-tx2); --gc-tx3:var(--n-tx3); --gc-tit:var(--io-titulo);
  --gc-link:var(--io-azul-tx); --gc-fill:var(--io-azul); --gc-marcado:var(--io-marcado); --gc-sel:var(--io-azul-tx);
  --gc-ok:var(--io-ok-tx); --gc-er:var(--io-er-tx); --gc-av:var(--io-av-tx); --gc-av-sf:var(--io-av-sf);
  --gc-falta:var(--io-er-sf); --gc-falta-bd:var(--io-er-bd);
  font-family:var(--io-fonte);
}
/* Dentro da casca: a página ocupa a área de trabalho inteira, da borda do trilho (240 ou 64 px, vem de --sb-w) até a direita. */
html.io2-casca{ --gc-top:var(--top-h); --gc-left:var(--sb-w); }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding:0;overflow:hidden;background:var(--gc-bg);color:var(--gc-tx);
  font-family:var(--io-fonte,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gc-link);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── Estrutura ── */
.gc{position:fixed;top:var(--gc-top);left:var(--gc-left);right:0;bottom:var(--gc-bottom);display:flex;flex-direction:column;background:var(--gc-bg);min-width:0}
.gc-faixa{flex:none;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--gc-av-sf);color:var(--gc-av);border-bottom:1px solid var(--gc-av);font-weight:600;font-size:13px}
.gc-faixa button{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--gc-av);background:transparent;color:var(--gc-av);font-weight:700;font-size:13px}
.gc-bar{flex:none;display:flex;align-items:center;padding:10px 16px;background:var(--gc-sf);border-bottom:1px solid var(--gc-bd)}
.gc-cab{display:flex;align-items:center;gap:12px}
.gc-cab h1{margin:0;font-size:16px;font-weight:700;color:var(--gc-tit);white-space:nowrap}
.gc-sair{color:var(--gc-link);text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}
html.io2-casca .gc-bar,html.gc-embutida .gc-bar,html.io2-casca .gc-cab,html.gc-embutida .gc-cab{display:none}
.gc-corpo{flex:1;min-height:0;position:relative;display:flex}

/* ── Lista de clientes (esquerda) ── */
.gl{flex:none;width:340px;min-height:0;display:flex;flex-direction:column;background:var(--gc-sf);border-right:1px solid var(--gc-bd)}
.gl-top{flex:none;display:grid;gap:8px;padding:12px;border-bottom:1px solid var(--gc-bd)}
.gl-linha{display:flex;align-items:center;gap:8px;justify-content:space-between}
.gc-busca{position:relative;min-width:0}
.gc-busca svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--gc-tx3);pointer-events:none}
.gc-busca input{width:100%;height:38px;padding:0 12px 0 34px;border:1px solid var(--gc-campo);border-radius:10px;background:var(--gc-bg);color:var(--gc-tx)}
.gc-busca input::placeholder{color:var(--gc-tx3);opacity:1}
.gc-sel{width:100%;height:38px;padding:0 10px;border:1px solid var(--gc-campo);border-radius:10px;background:var(--gc-bg);color:var(--gc-tx)}
.gc-chave{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 4px;border:0;background:transparent;color:var(--gc-tx);font-weight:600;font-size:13.5px}
.gc-chave i{position:relative;flex:none;width:36px;height:20px;border-radius:999px;background:var(--gc-sf3);border:1px solid var(--gc-campo);transition:background .12s}
.gc-chave i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--gc-tx2);transition:transform .12s}
.gc-chave[aria-checked="true"] i{background:var(--gc-marcado);border-color:var(--gc-marcado)}
.gc-chave[aria-checked="true"] i::after{transform:translateX(16px);background:#fff}
.gc-cont{font-size:13px;font-weight:600;color:var(--gc-tx);font-variant-numeric:tabular-nums}
.gc-cont b{color:var(--gc-er)}
.gc-btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--gc-campo);background:transparent;color:var(--gc-tx);font-weight:600;font-size:13.5px}
.gc-btn:hover{background:var(--gc-sf3)}
.gc-btn svg{width:16px;height:16px}
.gl-lista{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.gl-it{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 12px;border:0;border-bottom:1px solid var(--gc-bd);border-left:3px solid transparent;background:transparent;text-align:left;color:var(--gc-tx)}
.gl-it:hover{background:var(--gc-sf3)}
.gl-it[aria-current="true"]{background:var(--gc-sf3);border-left-color:var(--gc-sel)}
.gl-it .cod{flex:none;min-width:46px;font-size:12.5px;color:var(--gc-tx2);font-variant-numeric:tabular-nums}
.gl-it .nm{flex:1;min-width:0;font-weight:600;color:var(--gc-tit);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl-selo{flex:none;padding:2px 9px;border-radius:999px;border:1px solid var(--gc-falta-bd);background-color:var(--gc-sf);background-image:linear-gradient(var(--gc-falta),var(--gc-falta));color:var(--gc-er);font-size:12px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.gl-selo.ok{border-color:transparent;background-image:none;background-color:transparent;color:var(--gc-ok)}
.gl-vazio{margin:0;padding:24px 16px;color:var(--gc-tx2);text-align:center}

/* ── Ficha do cliente (direita) ── */
.gd{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--gc-bg)}
.gd-top{flex:none;display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--gc-sf);border-bottom:1px solid var(--gc-bd);min-height:64px}
.gd-volta{display:none;flex:none;width:44px;height:44px;border:0;background:transparent;color:var(--gc-link);place-items:center;border-radius:10px}
.gd-volta svg{width:22px;height:22px}
.gd-id{flex:1;min-width:0}
.gd-id b{display:block;font-size:17px;color:var(--gc-tit);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gd-id span{display:block;font-size:12.5px;color:var(--gc-tx2)}
.gd-prog{flex:none;display:flex;align-items:center;gap:12px}
.gd-salvo{min-width:56px;text-align:right;font-size:12.5px;font-weight:600;color:var(--gc-ok)}
.gd-salvo.err{color:var(--gc-er)}
.gd-prog .txt{font-size:12.5px;color:var(--gc-tx2);font-variant-numeric:tabular-nums;white-space:nowrap}
.gc-barra{flex:none;width:96px;height:6px;border-radius:999px;background:var(--gc-sf3);overflow:hidden}
.gc-barra i{display:block;height:100%;background:var(--gc-link);border-radius:999px}
.gc-barra.cheio i{background:var(--gc-ok)}
.gd-corpo{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 20px 32px}
.gd-vazio{margin:0;padding:48px 16px;color:var(--gc-tx2);text-align:center}
.gd-g{margin:0 0 16px;border:1px solid var(--gc-bd);border-radius:12px;background:var(--gc-sf)}
.gd-gh{display:flex;align-items:baseline;gap:12px;padding:12px 16px;border-bottom:1px solid var(--gc-bd)}
.gd-gh h2{margin:0;font-size:15px;font-weight:700;color:var(--gc-tit)}
.gd-gh .cnt{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--gc-er);font-variant-numeric:tabular-nums;white-space:nowrap}
.gd-gh .cnt.ok{color:var(--gc-ok)}
/* De 2 a 3 colunas: a coluna nunca é menor que 240 px nem menor que um terço da seção. */
.gd-gb{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(240px,calc((100% - 32px) / 3)),1fr));gap:14px 16px;padding:16px}
.gd-f{min-width:0}
.gd-f.larga{grid-column:1 / -1}
.gd-lb{display:flex;align-items:baseline;gap:8px;margin:0 0 4px}
.gd-lb label{font-size:12.5px;color:var(--gc-tx2);font-weight:600;min-width:0}
.gd-falta{margin-left:auto;font-size:12px;font-weight:700;color:var(--gc-er)}
.gd-v{display:flex;align-items:center;min-width:0;min-height:38px;border:1px solid var(--gc-campo);border-radius:10px;background-color:var(--gc-bg);color:var(--gc-tx)}
.gd-v:focus-within{border-color:var(--gc-sel);box-shadow:0 0 0 1px var(--gc-sel)}
.gd-v.sis{border-color:var(--gc-link)}
.gd-v.calc{background-color:var(--gc-sf2);border-color:var(--gc-bd)}
.gd-f.falta .gd-v{background-image:linear-gradient(var(--gc-falta),var(--gc-falta));border-color:var(--gc-falta-bd)}
.gd-f.erro .gd-v{border-color:var(--gc-er)}
.gd-v input,.gd-v select,.gd-v textarea{flex:1;min-width:0;width:100%;height:36px;border:0;outline:0;padding:0 12px;background:transparent;color:var(--gc-tx);border-radius:10px}
.gd-v select option{background:var(--gc-sf);color:var(--gc-tx)}
.gd-v textarea{height:auto;min-height:84px;padding:8px 12px;resize:vertical;line-height:1.4}
.gd-v input[type="date"]{color-scheme:var(--io-cs,dark)}
.gd-pre{flex:none;padding-left:12px;color:var(--gc-tx2);font-size:13px;font-weight:600}
.gd-pre + input{padding-left:6px}
.gd-v input.num{text-align:right;font-variant-numeric:tabular-nums}
.gd-ro{flex:1;min-width:0;padding:8px 12px;overflow-wrap:anywhere;color:var(--gc-tx2)}
.gd-ro.sem{font-style:normal;color:var(--gc-tx3)}
.gd-v2{margin-top:6px}
.gd-dica{display:block;min-height:16px;margin-top:3px;font-size:12px;color:var(--gc-tx2)}
.gd-dica.ok{color:var(--gc-ok);font-weight:600}
.gd-dica.err{color:var(--gc-er);font-weight:600}

/* Estados */
.gc-estado{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:var(--gc-bg);z-index:30}
.gc-estado h2{margin:0 0 6px;font-size:17px;color:var(--gc-tit)}
.gc-estado p{margin:0 0 14px;color:var(--gc-tx2);max-width:420px}
.gc-estado a{color:var(--gc-link);font-weight:600}
.gc-esq{display:flex;flex-direction:column;gap:1px;width:100%;position:absolute;inset:0;background:var(--gc-bg);z-index:29}
.gc-esq i{display:block;height:52px;background:var(--gc-sf);border-bottom:1px solid var(--gc-bd)}
.gc-esq i:nth-child(odd){background:var(--gc-sf2)}

/* Aviso rápido */
.gc-aviso{position:fixed;left:50%;bottom:calc(20px + var(--gc-bottom));transform:translateX(-50%);z-index:60;max-width:min(560px,92vw);padding:10px 16px;border-radius:10px;background:var(--gc-sf3);color:var(--gc-tit);border:1px solid var(--gc-campo);font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.28)}

/* ── Celular: a lista, e a ficha abre por cima com "Voltar" ── */
@media (max-width:860px){
  html.io2-casca{ --gc-top:calc(var(--top-h-m) + env(safe-area-inset-top,0px)); --gc-left:0px; --gc-bottom:calc(var(--bot-h) + env(safe-area-inset-bottom,0px)); }
  .gl{width:100%;border-right:0}
  .gl-top{padding:10px 12px}
  .gc-busca input,.gc-sel{height:44px;font-size:16px}
  .gc-chave,.gc-btn{height:44px}
  .gl-it{min-height:64px;padding:10px 14px}
  .gd{position:absolute;inset:0;z-index:20}
  .gd-top{gap:8px;padding:6px 12px 6px 4px;min-height:60px}
  .gd-volta{display:grid}
  .gd-id b{font-size:16px}
  .gd-prog{flex-direction:column;align-items:flex-end;gap:4px}
  .gd-prog .gc-barra{width:72px}
  .gd-corpo{padding:10px 12px 24px}
  .gd-g{margin:0 0 10px}
  .gd-gb{grid-template-columns:1fr;padding:12px;gap:12px}
  .gd-v{min-height:46px}
  .gd-v input,.gd-v select{height:44px;font-size:16px}
  .gd-v textarea{font-size:16px;min-height:96px}
  .gd-ro{padding:11px 12px;font-size:16px}
}
</style>
<link rel="stylesheet" href="/gerador/ui/io2.css" media="not all" data-io2>
<script src="/gerador/ui/chave.js"></script>
</head>
<body>

<div class="gc" id="gc">
  <div class="gc-faixa" id="faixa" role="status" hidden>
    <span id="faixaTx">Não consegui ler a planilha agora</span>
    <button type="button" id="faixaBtn">Tentar de novo</button>
  </div>
  <header class="gc-bar" id="bar">
    <div class="gc-cab"><a class="gc-sair" href="/gerador" target="_top">Voltar ao Gerador</a><h1>Planilha de clientes</h1></div>
  </header>
  <div class="gc-corpo" id="corpo">
    <aside class="gl" id="gl" aria-label="Clientes">
      <div class="gl-top">
        <div class="gc-busca">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <label class="sr" for="busca">Buscar por nome ou código</label>
          <input id="busca" type="search" placeholder="Buscar por nome ou código" autocomplete="off" inputmode="search">
        </div>
        <label class="sr" for="fCons">Consultor</label>
        <select class="gc-sel" id="fCons" hidden><option value="">Todos os consultores</option></select>
        <div class="gl-linha">
          <button type="button" class="gc-chave" id="fPend" role="switch" aria-checked="false"><i aria-hidden="true"></i>Com campo vazio</button>
          <button type="button" class="gc-btn" id="atualizar" title="Ler a planilha e os dados de novo">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.5-4M4 4v4h4M4 13a8 8 0 0 0 14.5 4M20 20v-4h-4"/></svg>Atualizar
          </button>
        </div>
        <div class="gc-cont" id="cont" aria-live="polite"></div>
      </div>
      <div class="gl-lista" id="lista"></div>
    </aside>
    <section class="gd" id="gd" hidden aria-label="Ficha do cliente">
      <header class="gd-top">
        <button type="button" class="gd-volta" id="gdVolta" aria-label="Voltar para a lista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="gd-id"><b id="gdNome"></b><span id="gdSub"></span></div>
        <div class="gd-prog"><span class="gd-salvo" id="gdSalvo" role="status"></span><span class="txt" id="gdProgTx"></span><div class="gc-barra" id="gdBarra"><i></i></div></div>
      </header>
      <div class="gd-corpo" id="gdCorpo"></div>
    </section>
    <div class="gc-esq" id="esq" hidden></div>
    <div class="gc-estado" id="estado" hidden></div>
  </div>
</div>
<div class="gc-aviso" id="aviso" role="status" hidden></div>

<script>
(function () {
  'use strict';

  // ── Constantes ──
  var SESSAO_KEY = 'irmaos-na-obra-sessao-v1';
  var API = '/_api/gerador/clientes/solar';
  var SUPABASE_URL = 'https://ancecdfqfwlaujknizof.supabase.co';
  // Chave publishable do Supabase do Gerador: a mesma que já está escrita no index.html do /gerador e na tela do WhatsApp.
  var SUPABASE_KEY = 'sb_publishable_IK5RV-I0PlQNpb7-cXBQFg_-pSYscO6'; // gitleaks:allow (chave publica de navegador, a mesma do index.html; o .gitleaks.toml libera em dashboard/public)
  var MOVEL = window.matchMedia('(max-width:860px)');
  var OUTRO = '\u0001outro';

  // ── Estado (só em memória: nenhum valor de campo vai para localStorage) ──
  var D = null;                     // última resposta
  var cols = [];                    // catálogo do papel (já cortado pelo servidor)
  var colPor = {};
  var linhas = [];
  var linhaPor = {};
  var baseEm = {};                  // instante do servidor em que cada campo foi lido (para o 409)
  var confirmado = {};              // último valor CONFIRMADO pelo servidor de cada campo (a recusa volta para ele, nunca para uma edição ainda não confirmada)
  var pend = {};                    // quantas gravações de cada campo estão na fila
  var filas = {};                   // um POST por vez por venda: ler, mesclar e gravar no servidor não é atômico
  var visiveis = [];                // clientes na lista
  var detalhe = null;               // código do cliente na ficha
  var campos = {};                  // controles da ficha aberta, por chave
  var secoes = [];                  // seções da ficha aberta: { cnt, cols }
  var parado = false;
  var carregando = false;

  var $ = function (id) { return document.getElementById(id); };

  // ── Utilidades ──
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function semAcento(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  // Mesma régua do servidor: a vírgula ou o ponto entre dígitos é decimal e fica ("2,25k" não casa com "22,5k").
  function chaveOpcao(s) { return semAcento(s).replace(/(\d)\s*[.,]\s*(?=\d)/g, '$1~').replace(/[^a-z0-9~]+/g, ''); }
  function erro(tipo, extra) { var e = new Error(tipo); e.tipo = tipo; if (extra) for (var k in extra) e[k] = extra[k]; return e; }
  var fDin = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var fNum = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 4 });
  var fDM = new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit' });
  function fmtData(iso) { return /^\d{4}-\d{2}-\d{2}$/.test(iso) ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : String(iso); }
  function maskTel(s) {
    var d = String(s).replace(/\D/g, '');
    if (d.length > 11) return d;
    if (d.length <= 2) return d ? '(' + d : '';

  // Número no formato brasileiro, com a MESMA régua do servidor (numeroBR):
  // "145.000" é cento e quarenta e cinco mil, "1.234,56" vale 1234,56, "1234.56" vale 1234,56. null = não é número.
  function lerNumeroBR(v) {
    var t = String(v == null ? '' : v).replace(/R\$/gi, '').replace(/\s/g, '');

    var neg = t.charAt(0) === '-';
    if (neg) t = t.slice(1);
    if (!t) return null;
    if (t.indexOf(',') >= 0) {
      var p = t.split(',');
      if (p.length !== 2 || !/^\d+$/.test(p[1])) return null;
      if (!/^(\d{1,3}(\.\d{3})+|\d+)$/.test(p[0])) return null;
      t = p[0].replace(/\./g, '') + '.' + p[1];

  // ── Sessão: lida e renovada do MESMO jeito que o app principal e a tela do WhatsApp ──
  // Embutida: quem renova a sessão é o app pai. O pai guarda o refresh token em memória e só lê o storage na carga;

  // Embutida, depois de um 401: se o pai já gravou outro token no storage, tenta com ele primeiro; só então pede renovação ao pai.
  function embRetentar(metodo, caminho, corpo, tk) {

      });

    renovando = Promise.resolve(p).then(function (v) { renovando = null; return v; }, function (e) { renovando = null; throw e; });

    }, function () { throw erro('rede'); }).then(function (x) {

            access_token: x.j.access_token,

  // Devolve { status, json } para QUALQUER resposta do servidor (o 409 e o 400 trazem o motivo no corpo).

  // Um campo da ficha: rótulo, controle do tipo certo e a linha de aviso. O código da venda e a coluna ficam PRESOS aqui:

  function criarCampo(l, c) {

    var obrig = c.obrigatoria && c.editavel;
    var cel0 = l.celulas[chave];
    var atual = function () { var x = linhaPor[codigo]; return x ? x.celulas[chave] : cel0; };

    // Linha de aviso: mensagem de gravação (Salvando, Salvo, erro) e, no resto do tempo, quem preencheu.
    h.dicaBase = function () {
      var cel = atual();
      if (!c.editavel) return c.calculada ? 'Calculado na planilha' : '';
      return dicaSistema(cel);
    };
    h.msg = function (txt, tipo) {
      clearTimeout(h.timer);
      h.msgTipo = tipo || '';
      dica.textContent = txt || h.dicaBase();
      dica.className = 'gd-dica' + (tipo ? ' ' + tipo : '');
      if (tipo === 'ok') h.timer = setTimeout(function () { h.msgTipo = ''; dica.className = 'gd-dica'; dica.textContent = h.dicaBase(); }, 2500);
    };
    h.erro = function (txt) { f.classList.add('erro'); h.msg(txt, 'err'); if (h.ctl) h.ctl.dataset.inv = '1'; };
    h.limparErro = function () {
      if (!f.classList.contains('erro')) return;
      f.classList.remove('erro'); if (h.ctl) delete h.ctl.dataset.inv;
      h.msg('', '');
    };
    // Repinta o estado do campo (vazio, de quem é). `forcar` troca o texto mesmo com o foco dentro (409, recusa).
    h.estado = function (cel) {
      var vazio = vazioV(cel.valor);
      f.classList.toggle('falta', obrig && vazio);
      tag.hidden = !(obrig && vazio);
      v.classList.toggle('sis', cel.origem === 'sistema' && c.editavel);
      if (!h.msgTipo) dica.textContent = h.dicaBase();
    };

    if (!c.editavel) {
      v.classList.add('calc');
      var ro = el('div', 'gd-ro'); ro.id = id; v.appendChild(ro);
      lb.removeAttribute('for');
      h.set = function (cel) {
        var t = textoLeitura(c, cel.valor);
        ro.textContent = t || 'Sem valor'; ro.className = 'gd-ro' + (t ? '' : ' sem');
        h.estado(cel);
      };
    } else if (c.tipo === 'lista') {
      var s = document.createElement('select'); s.id = id; v.appendChild(s); h.ctl = s;
      var montar = function (cel) {
        s.textContent = '';
        var at = vazioV(cel.valor) ? '' : String(cel.valor);
        s.appendChild(new Option('Escolha...', ''));
        var achada = null;
        (c.opcoes || []).forEach(function (o) {
          s.appendChild(new Option(o, o));
          if (at && chaveOpcao(o) === chaveOpcao(at)) achada = o;
        });
        // Valor que já estava na planilha e não está nas opções: aparece marcado, para não sumir da tela.
        if (at && !achada) s.appendChild(new Option(at + (cel.origem === 'sistema' ? '' : ' (da planilha)'), at));
        if (c.livre) s.appendChild(new Option('Outro...', OUTRO));
        s.value = at ? (achada || at) : '';
      };
      var fecharOutro = function () {
        var o = h.outro; if (!o) return;
        h.outro = null;
        if (o.v2.parentNode) o.v2.parentNode.removeChild(o.v2);
      };
      var abrirOutro = function () {
        if (h.outro) return;
        var v2 = el('div', 'gd-v gd-v2');
        var t = document.createElement('input'); t.type = 'text'; t.maxLength = 300; t.autocomplete = 'off'; t.placeholder = 'Digite o valor';
        t.setAttribute('aria-label', c.rotulo + ': outro valor');
        v2.appendChild(t); f.insertBefore(v2, dica);
        var o = { v2: v2, t: t, cancelar: false };
        h.outro = o;
        t.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); t.blur(); }
          else if (e.key === 'Escape') { e.preventDefault(); o.cancelar = true; t.blur(); }
        });
        t.addEventListener('blur', function () {
          if (h.outro !== o) return;
          var txt = t.value.trim();
          fecharOutro();
          if (txt && !o.cancelar) gravar(codigo, c, txt, h);
          else montar(atual());
        });
        t.focus();
      };
      h.set = function (cel) { if (h.outro && document.activeElement === h.outro.t) { h.estado(cel); return; } fecharOutro(); montar(cel); h.estado(cel); };
      s.addEventListener('change', function () {
        if (s.value === OUTRO) { abrirOutro(); return; }
        gravar(codigo, c, s.value, h);
      });
    } else if (c.tipo === 'data') {
      var d = document.createElement('input'); d.type = 'date'; d.id = id; d.min = '2000-01-01'; d.max = '2100-12-31'; v.appendChild(d); h.ctl = d;
      var dataOk = function (x) { return /^\d{4}-\d{2}-\d{2}$/.test(x) && x >= '2000-01-01' && x <= '2100-12-31'; };
      h.set = function (cel, forcar) {
        if (forcar || document.activeElement !== d) d.value = textoControle(c, cel.valor);
        h.estado(cel);
      };
      // O Chromium dispara "change" a cada dígito do ano (0002, 0020, 0202...): só grava data completa e dentro do intervalo; apagar tudo grava ao sair.
      d.addEventListener('change', function () { if (dataOk(d.value)) gravar(codigo, c, d.value, h); });
      d.addEventListener('blur', function () {
        if (d.validity && d.validity.badInput) { aviso('Data incompleta. Preencha dia, mês e ano.'); h.set(atual(), true); return; }
        if (d.value === '') { gravar(codigo, c, '', h); h.set(atual(), true); return; }
        if (!dataOk(d.value)) { aviso('Use um ano entre 2000 e 2100.'); h.set(atual(), true); return; }
        gravar(codigo, c, d.value, h);
      });
    } else {
      var area = chave === 'obs';
      var inp = document.createElement(area ? 'textarea' : 'input');
      inp.id = id; h.ctl = inp;
      if (!area) { inp.type = 'text'; }
      inp.autocomplete = 'off'; inp.spellcheck = false;
      if (c.tipo === 'dinheiro') {
        // NUNCA type=number: ele corta três zeros no ponto de milhar e zera com a vírgula do teclado.
        inp.inputMode = 'decimal'; inp.className = 'num';
        v.appendChild(el('span', 'gd-pre', 'R$'));
      } else if (c.tipo === 'numero') { inp.inputMode = 'decimal'; inp.className = 'num'; }
      else if (c.tipo === 'inteiro') { inp.inputMode = 'numeric'; inp.className = 'num'; }
      else if (c.tipo === 'telefone') { inp.inputMode = 'tel'; }
      else { inp.maxLength = 300; }
      v.appendChild(inp);
      h.set = function (cel, forcar) {
        if (forcar || document.activeElement !== inp) inp.value = textoControle(c, cel.valor);
        h.estado(cel);
      };
      inp.addEventListener('input', function () {
        h.limparErro();
        if (c.tipo === 'inteiro') { var so = inp.value.replace(/\D/g, ''); if (so !== inp.value) inp.value = so; }
        else if (c.tipo === 'telefone') inp.value = maskTel(inp.value);
      });
      inp.addEventListener('change', function () { gravar(codigo, c, inp.value, h); });
      inp.addEventListener('blur', function () { if (!inp.dataset.inv) h.set(atual(), true); });
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !area) { e.preventDefault(); inp.blur(); }
        else if (e.key === 'Escape') { e.preventDefault(); h.limparErro(); h.set(atual(), true); inp.blur(); }
      });
    }
    campos[chave] = h;
    h.set(cel0, true);
    return f;
  }

  // ── Ler o que a pessoa digitou ──
  // Devolve { ok, v (valor do modelo), envio (o que vai no POST) } ou { ok:false, msg }.
  function lerCampo(c, texto) {
    var t = String(texto == null ? '' : texto).trim();
    if (!t) return { ok: true, v: null, envio: '' };
    switch (c.tipo) {
      case 'dinheiro': {
        var n = lerNumeroBR(t);
        if (n == null || Math.abs(n) > 1e9) return { ok: false, msg: 'Valor em reais inválido. Exemplo: 1.234,56.' };
        n = Math.round(n * 100) / 100;
        return { ok: true, v: n, envio: String(n).replace('.', ',') };
      }
      case 'numero': {
        var m = lerNumeroBR(t);
        if (m == null || Math.abs(m) > 1e9) return { ok: false, msg: 'Número inválido. Exemplo: 1.234,56.' };
        m = Math.round(m * 10000) / 10000;
        return { ok: true, v: m, envio: String(m).replace('.', ',') };
      }
      case 'inteiro':
        if (!/^\d{1,9}$/.test(t)) return { ok: false, msg: 'Use um número inteiro.' };
        return { ok: true, v: Number(t), envio: t };
      case 'telefone': {
        var d = t.replace(/\D/g, '');
        if (!((d.length === 10 || d.length === 11) || ((d.length === 12 || d.length === 13) && d.indexOf('55') === 0))) return { ok: false, msg: 'Telefone com DDD, de 10 ou 11 dígitos.' };
        return { ok: true, v: d, envio: d };
      }
      case 'data': return { ok: true, v: t, envio: t };
      case 'lista': {
        var k = chaveOpcao(t), o = (c.opcoes || []).filter(function (x) { return chaveOpcao(x) === k; })[0];
        return { ok: true, v: o || t, envio: t };
      }
      default: return { ok: true, v: t, envio: t };
    }
  }

  // ── Gravar um campo ──
  function gravar(codigo, c, texto, h) {
    var l = linhaPor[codigo]; if (!l) return;
    var antes = l.celulas[c.chave];
    var r = lerCampo(c, texto);
    if (!r.ok) { if (h) h.erro(r.msg); return; }
    var novoV = r.v;
    if ((vazioV(novoV) && vazioV(antes.valor)) || novoV === antes.valor) { if (h && detalhe === codigo) h.set(antes, true); return; }
    // Apagar um valor que vem da planilha não faz nada no servidor (só se apaga o que foi preenchido aqui).
    if (vazioV(novoV) && antes.origem !== 'sistema') {
      aviso('Este valor vem da planilha. Para trocá-lo, escolha ou digite outro.');
      if (h && detalhe === codigo) h.set(antes, true);
      return;
    }
    // Otimista: mostra já. O servidor devolve a célula final (normalizada) ou o motivo da recusa.
    var kk = codigo + '|' + c.chave;
    if (!(kk in confirmado)) confirmado[kk] = antes;      // sem gravação na fila, o que está na tela é o que o servidor confirmou
    pend[kk] = (pend[kk] || 0) + 1;
    l.celulas[c.chave] = { valor: novoV, origem: 'sistema', por: (D && D.consultor) || '', em: new Date().toISOString() };
    recalcular(l);
    depoisDeMudar(codigo, c.chave, 'Salvando...', 'busy', false);
    enfileirar(codigo, function () { return enviar(l, c, r.envio, antes); });
  }
  function enfileirar(codigo, fn) {
    var p = (filas[codigo] || Promise.resolve()).then(fn, fn);
    filas[codigo] = p.catch(function () {});
    return p;
  }
  // Repinta SÓ o que mudou (o campo, o "x de y" das seções, o cabeçalho e o selo da lista). A ficha não é redesenhada:
  // quem saltou com Tab para o próximo campo não pode perder o foco.
  function depoisDeMudar(codigo, chave, msg, tipo, forcar) {
    var l = linhaPor[codigo]; if (!l) return;
    if (chave === 'cliente' && typeof l.celulas.cliente.valor === 'string') {
      l.cliente = l.celulas.cliente.valor;
      var it = itemDe(codigo); if (it) it.querySelector('.nm').textContent = l.cliente || 'Sem nome';
    }
    if (chave === 'consultor' && typeof l.celulas.consultor.valor === 'string') l.consultor = l.celulas.consultor.valor;
    repintarItem(codigo);
    if (detalhe !== codigo) return;
    var h = campos[chave];
    if (h) { h.limparErro(); h.set(l.celulas[chave], forcar); h.msg(msg, tipo); }
    atualizarSecoes();
    repintarCabecalho();
    if (msg) salvoGeral(msg, tipo);
  }
  var salvoTimer = null;
  function salvoGeral(txt, tipo) {
    var s = $('gdSalvo');
    s.textContent = txt === 'Salvando...' ? '' : txt;
    s.className = 'gd-salvo' + (tipo === 'err' ? ' err' : '');
    clearTimeout(salvoTimer);
    if (txt === 'Salvo') salvoTimer = setTimeout(function () { s.textContent = ''; }, 2500);
  }

  function enviar(l, c, texto, antes) {
    var chaveBase = l.codigo + '|' + c.chave;
    var corpo = { codigo: l.codigo, coluna: c.chave, valor: texto, base_em: baseEm[chaveBase] || (D && D.em) };
    // Fim desta gravação: devolve quantas ainda estão na fila para o mesmo campo. Com outra na fila, a tela não é tocada:
    // ela mostra a edição mais nova, que a próxima resposta confirma ou recusa.
    var terminou = function () { pend[chaveBase] = Math.max(0, (pend[chaveBase] || 1) - 1); return pend[chaveBase]; };
    // Recusa: volta ao último valor CONFIRMADO (não à edição anterior que ainda não foi confirmada).
    var voltar = function () {
      l.celulas[c.chave] = (chaveBase in confirmado) ? confirmado[chaveBase] : antes;
      recalcular(l);
      depoisDeMudar(l.codigo, c.chave, '', '', true);
      salvoGeral('Não salvou', 'err');
    };
    return api('POST', '/campo', corpo).then(function (x) {
      var j = x.json || {};
      var resto;
      if (x.status === 200 && j.ok) {
        resto = terminou();
        confirmado[chaveBase] = j.celula;
        baseEm[chaveBase] = j.em;
        if (resto > 0) return;
        l.celulas[c.chave] = j.celula;
        if (j.progresso) l.progresso = j.progresso; else recalcular(l);
        depoisDeMudar(l.codigo, c.chave, 'Salvo', 'ok', false);
        return;
      }
      if (x.status === 409 && j.celula) {
        // Outra pessoa mexeu: recarrega o valor dela no campo.
        resto = terminou();
        confirmado[chaveBase] = j.celula;
        baseEm[chaveBase] = j.em || baseEm[chaveBase];
        if (j.conflito && j.por) aviso(j.por + ' alterou este campo agora. Valor atual: ' + (textoLeitura(c, j.celula.valor) || 'vazio'));
        else aviso(j.error || 'Outra pessoa alterou este campo agora.');
        if (resto > 0) return;
        l.celulas[c.chave] = j.celula;
        recalcular(l);
        depoisDeMudar(l.codigo, c.chave, '', '', true);
        return;
      }
      // Recusa (400, 404, 403, 5xx): mostra o motivo e devolve o último valor confirmado.
      resto = terminou();
      aviso(j.error || 'Não consegui gravar agora. Tente de novo.');
      if (resto > 0) return;
      voltar();
    }, function (e) {
      var resto = terminou();
      if (e && (e.tipo === 'negado' || e.tipo === 'login')) return;
      aviso('Não consegui gravar agora. Confira a conexão e tente de novo.');
      if (resto > 0) return;
      voltar();
    });
  }

  // ── Controles ──
  var tb = null;
  $('busca').addEventListener('input', function () { clearTimeout(tb); tb = setTimeout(desenharLista, 120); });
  $('fCons').addEventListener('change', desenharLista);
  $('fPend').addEventListener('click', function () {
    var b = $('fPend'); b.setAttribute('aria-checked', b.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
    desenharLista();
  });
  // Atualizar espera as gravações em andamento: ler antes delas terminarem traria o valor velho de volta.
  $('atualizar').addEventListener('click', function () {
    var a = document.activeElement;
    if (a && $('gdCorpo').contains(a) && a.blur) a.blur();
    Promise.all(Object.keys(filas).map(function (k) { return filas[k]; })).then(function () { return carregar(); });
  });
  $('faixaBtn').addEventListener('click', function () { carregar(); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || !MOVEL.matches || $('gd').hidden) return;
    var a = document.activeElement, tag = a && a.tagName;
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
    fecharFicha();
  });
  // Mudou entre celular e computador: no computador a ficha fica sempre ao lado; no celular volta para a lista.
  function aoMudarLargura() {
    if (!D) return;
    if (MOVEL.matches) { $('gd').hidden = true; return; }
    if (!detalhe && visiveis.length) detalhe = visiveis[0].codigo;
    marcarAtivo(); desenharFicha(); $('gd').hidden = false;
  }
  if (MOVEL.addEventListener) MOVEL.addEventListener('change', aoMudarLargura);
  window.addEventListener('pagehide', function () { var a = document.activeElement; if (a && a.blur && $('gdCorpo').contains(a)) a.blur(); });

  if (EMB) {
    window.addEventListener('storage', function (e) {
      if (e.key === 'gerador-tema') {
        if (e.newValue === 'escuro') document.documentElement.setAttribute('data-io2-tema', 'escuro');
        else document.documentElement.removeAttribute('data-io2-tema');
      } else if (e.key === 'gerador-visual') {
        try { location.reload(); } catch (x) {}
      }
    });
  }

  if (window.__semSessao) semSessaoEmbutida(); else carregar();
})();
</script>
