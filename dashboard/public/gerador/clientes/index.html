<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planilha de clientes | Irmãos na Obra</title>
<meta name="theme-color" content="#0B1220">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" sizes="192x192" href="/gerador/icon-192.png">
<script>
  // Mesma auth do /gerador. Sem sessão, volta para a tela de login.
  (function(){
    var AUTH_KEY = 'irmaos-na-obra-auth-v1';
    var authed = false;
    try { authed = !!localStorage.getItem(AUTH_KEY); } catch(e){}
    // Modo embutido (aba Planilha de clientes do Solar): a página roda dentro de um iframe do /gerador.
    var emb = false;
    try { emb = window.self !== window.top; } catch (e) { emb = true; }
    window.__embutida = emb;
    if (emb) document.documentElement.classList.add('gc-embutida');
    // Linha Eletroposto: ?linha=eletroposto. Sem o parâmetro, ou com linha=solar, a tela é a do Solar.
    var ep = false;
    try { ep = /^eletroposto$/i.test(String(new URLSearchParams(location.search).get('linha') || '').trim()); } catch (e) {}
    window.__linhaEP = ep;
    if (ep) { document.documentElement.classList.add('gc-ep'); document.title = 'Planilha do cliente | Eletroposto | Irmãos na Obra'; }
    if (!authed) {
      // Navegar aqui carregaria o app inteiro dentro do iframe: no modo embutido só avisa (veja semSessaoEmbutida).
      if (emb) window.__semSessao = true; else location.replace('/gerador');
    }
  })();
</script>
<style>
/* ── Papéis de cor da página ─────────────────────────────────────────────────
   Visual antigo (sem io2): escuro nativo, como os outros subapps.
   Visual novo (html.io2): cada papel aponta para o token do papel, no claro e no escuro.
   Nenhuma cor escrita à mão fora deste bloco. */
:root{
  --gc-bg:#0F172A; --gc-sf:#1E293B; --gc-sf2:#172033; --gc-sf3:#2A3A52; --gc-bd:#334155; --gc-campo:#7C8DA5;
  --gc-tx:#E5E7EB; --gc-tx2:#B4C0D2; --gc-tx3:#98A8BF; --gc-tit:#F8FAFC;
  --gc-link:#7DB4FF; --gc-fill:#1D4ED8; --gc-marcado:#1D4ED8; --gc-sel:#7DB4FF;
  --gc-ok:#4ADE80; --gc-er:#F87171; --gc-av:#FBBF24; --gc-av-sf:#3A2A0C;
  /* Campo em branco: vermelho bem claro no fundo e na borda, mais a palavra "Falta". No visual antigo é o vermelho translúcido equivalente ao token. */
  --gc-falta:rgba(248,113,113,.16); --gc-falta-bd:rgba(248,113,113,.55);
  --gc-top:0px; --gc-left:0px; --gc-bottom:0px;
}
html.io2{
  --gc-bg:var(--n-bg); --gc-sf:var(--n-sf); --gc-sf2:var(--n-sf2); --gc-sf3:var(--n-sf3); --gc-bd:var(--n-bd); --gc-campo:var(--io-borda-campo);
  --gc-tx:var(--n-tx); --gc-tx2:var(--n-tx2); --gc-tx3:var(--n-tx3); --gc-tit:var(--io-titulo);
  --gc-link:var(--io-azul-tx); --gc-fill:var(--io-azul); --gc-marcado:var(--io-marcado); --gc-sel:var(--io-azul-tx);
  --gc-ok:var(--io-ok-tx); --gc-er:var(--io-er-tx); --gc-av:var(--io-av-tx); --gc-av-sf:var(--io-av-sf);
  --gc-falta:var(--io-er-sf); --gc-falta-bd:var(--io-er-bd);
  font-family:var(--io-fonte);
}
/* Dentro da casca: a página ocupa a área de trabalho inteira, da borda do trilho (240 ou 64 px, vem de --sb-w) até a direita. */
html.io2-casca{ --gc-top:var(--top-h); --gc-left:var(--sb-w); }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding:0;overflow:hidden;background:var(--gc-bg);color:var(--gc-tx);
  font-family:var(--io-fonte,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gc-link);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── Estrutura ── */
.gc{position:fixed;top:var(--gc-top);left:var(--gc-left);right:0;bottom:var(--gc-bottom);display:flex;flex-direction:column;background:var(--gc-bg);min-width:0}
.gc-faixa{flex:none;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--gc-av-sf);color:var(--gc-av);border-bottom:1px solid var(--gc-av);font-weight:600;font-size:13px}
.gc-faixa button{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--gc-av);background:transparent;color:var(--gc-av);font-weight:700;font-size:13px}
.gc-bar{flex:none;display:flex;align-items:center;padding:10px 16px;background:var(--gc-sf);border-bottom:1px solid var(--gc-bd)}
.gc-cab{display:flex;align-items:center;gap:12px}
.gc-cab h1{margin:0;font-size:16px;font-weight:700;color:var(--gc-tit);white-space:nowrap}
.gc-linha{flex:none;padding:2px 10px;border-radius:999px;border:1px solid var(--gc-campo);background:var(--gc-sf3);color:var(--gc-tit);font-size:12px;font-weight:700;white-space:nowrap}
.gc-sair{color:var(--gc-link);text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}
html.io2-casca .gc-bar,html.gc-embutida .gc-bar,html.io2-casca .gc-cab,html.gc-embutida .gc-cab{display:none}
.gc-corpo{flex:1;min-height:0;position:relative;display:flex}

/* ── Lista de clientes (esquerda) ── */
.gl{flex:none;width:340px;min-height:0;display:flex;flex-direction:column;background:var(--gc-sf);border-right:1px solid var(--gc-bd)}
.gl-top{flex:none;display:grid;gap:8px;padding:12px;border-bottom:1px solid var(--gc-bd)}
.gl-linha{display:flex;align-items:center;gap:8px;justify-content:space-between}
.gc-busca{position:relative;min-width:0}
.gc-busca svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--gc-tx3);pointer-events:none}
.gc-busca input{width:100%;height:38px;padding:0 12px 0 34px;border:1px solid var(--gc-campo);border-radius:10px;background:var(--gc-bg);color:var(--gc-tx)}
.gc-busca input::placeholder{color:var(--gc-tx3);opacity:1}
.gc-sel{width:100%;height:38px;padding:0 10px;border:1px solid var(--gc-campo);border-radius:10px;background:var(--gc-bg);color:var(--gc-tx)}
.gc-chave{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 4px;border:0;background:transparent;color:var(--gc-tx);font-weight:600;font-size:13.5px}
.gc-chave i{position:relative;flex:none;width:36px;height:20px;border-radius:999px;background:var(--gc-sf3);border:1px solid var(--gc-campo);transition:background .12s}
.gc-chave i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--gc-tx2);transition:transform .12s}
.gc-chave[aria-checked="true"] i{background:var(--gc-marcado);border-color:var(--gc-marcado)}
.gc-chave[aria-checked="true"] i::after{transform:translateX(16px);background:#fff}
.gc-cont{font-size:13px;font-weight:600;color:var(--gc-tx);font-variant-numeric:tabular-nums}
.gc-cont b{color:var(--gc-er)}
.gc-btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--gc-campo);background:transparent;color:var(--gc-tx);font-weight:600;font-size:13.5px}
.gc-btn:hover{background:var(--gc-sf3)}
.gc-btn svg{width:16px;height:16px}
.gl-lista{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.gl-it{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 12px;border:0;border-bottom:1px solid var(--gc-bd);border-left:3px solid transparent;background:transparent;text-align:left;color:var(--gc-tx)}
.gl-it:hover{background:var(--gc-sf3)}
.gl-it[aria-current="true"]{background:var(--gc-sf3);border-left-color:var(--gc-sel)}
.gl-it .cod{flex:none;min-width:46px;font-size:12.5px;color:var(--gc-tx2);font-variant-numeric:tabular-nums}
.gl-it .nm{flex:1;min-width:0;font-weight:600;color:var(--gc-tit);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl-selo{flex:none;padding:2px 9px;border-radius:999px;border:1px solid var(--gc-falta-bd);background-color:var(--gc-sf);background-image:linear-gradient(var(--gc-falta),var(--gc-falta));color:var(--gc-er);font-size:12px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.gl-selo.ok{border-color:transparent;background-image:none;background-color:transparent;color:var(--gc-ok)}
/* Eletroposto: o código é o id do card da agenda e pode ser comprido. */
html.gc-ep .gl-it .cod{max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl-vazio{margin:0;padding:24px 16px;color:var(--gc-tx2);text-align:center}

/* ── Ficha do cliente (direita) ── */
.gd{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--gc-bg)}
.gd-top{flex:none;display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--gc-sf);border-bottom:1px solid var(--gc-bd);min-height:64px}
.gd-volta{display:none;flex:none;width:44px;height:44px;border:0;background:transparent;color:var(--gc-link);place-items:center;border-radius:10px}
.gd-volta svg{width:22px;height:22px}
.gd-id{flex:1;min-width:0}
.gd-id b{display:block;font-size:17px;color:var(--gc-tit);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gd-id span{display:block;font-size:12.5px;color:var(--gc-tx2)}
.gd-prog{flex:none;display:flex;align-items:center;gap:12px}
.gd-salvo{min-width:56px;text-align:right;font-size:12.5px;font-weight:600;color:var(--gc-ok)}
.gd-salvo.err{color:var(--gc-er)}
.gd-prog .txt{font-size:12.5px;color:var(--gc-tx2);font-variant-numeric:tabular-nums;white-space:nowrap}
.gc-barra{flex:none;width:96px;height:6px;border-radius:999px;background:var(--gc-sf3);overflow:hidden}
.gc-barra i{display:block;height:100%;background:var(--gc-link);border-radius:999px}
.gc-barra.cheio i{background:var(--gc-ok)}
html.gc-ep .gd.sem-linhas .gd-top{display:none}
.gd-corpo{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 20px 32px}
.gd-vazio{margin:0;padding:48px 16px;color:var(--gc-tx2);text-align:center}
.gd-g{margin:0 0 16px;border:1px solid var(--gc-bd);border-radius:12px;background:var(--gc-sf)}
.gd-gh{display:flex;align-items:baseline;gap:12px;padding:12px 16px;border-bottom:1px solid var(--gc-bd)}
.gd-gh h2{margin:0;font-size:15px;font-weight:700;color:var(--gc-tit)}
.gd-gh .cnt{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--gc-er);font-variant-numeric:tabular-nums;white-space:nowrap}
.gd-gh .cnt.ok{color:var(--gc-ok)}
/* De 2 a 3 colunas: a coluna nunca é menor que 240 px nem menor que um terço da seção. */
.gd-gb{display:grid;grid-template-columns:repeat(auto-fill,minmax(max(240px,calc((100% - 32px) / 3)),1fr));gap:14px 16px;padding:16px}
.gd-f{min-width:0}
.gd-f.larga{grid-column:1 / -1}
.gd-lb{display:flex;align-items:baseline;gap:8px;margin:0 0 4px}
.gd-lb label{font-size:12.5px;color:var(--gc-tx2);font-weight:600;min-width:0}
.gd-falta{margin-left:auto;font-size:12px;font-weight:700;color:var(--gc-er)}
.gd-v{display:flex;align-items:center;min-width:0;min-height:38px;border:1px solid var(--gc-campo);border-radius:10px;background-color:var(--gc-bg);color:var(--gc-tx)}
.gd-v:focus-within{border-color:var(--gc-sel);box-shadow:0 0 0 1px var(--gc-sel)}
.gd-v.sis{border-color:var(--gc-link)}
.gd-v.calc{background-color:var(--gc-sf2);border-color:var(--gc-bd)}
.gd-f.falta .gd-v{background-image:linear-gradient(var(--gc-falta),var(--gc-falta));border-color:var(--gc-falta-bd)}
.gd-f.erro .gd-v{border-color:var(--gc-er)}
.gd-v input,.gd-v select,.gd-v textarea{flex:1;min-width:0;width:100%;height:36px;border:0;outline:0;padding:0 12px;background:transparent;color:var(--gc-tx);border-radius:10px}
.gd-v select option{background:var(--gc-sf);color:var(--gc-tx)}
.gd-v textarea{height:auto;min-height:84px;padding:8px 12px;resize:vertical;line-height:1.4}
.gd-v input[type="date"]{color-scheme:var(--io-cs,dark)}
.gd-pre{flex:none;padding-left:12px;color:var(--gc-tx2);font-size:13px;font-weight:600}
.gd-pre + input{padding-left:6px}
.gd-v input.num{text-align:right;font-variant-numeric:tabular-nums}
.gd-ro{flex:1;min-width:0;padding:8px 12px;overflow-wrap:anywhere;color:var(--gc-tx2)}
.gd-ro.sem{font-style:normal;color:var(--gc-tx3)}
.gd-v2{margin-top:6px}
.gd-dica{display:block;min-height:16px;margin-top:3px;font-size:12px;color:var(--gc-tx2)}
.gd-dica.ok{color:var(--gc-ok);font-weight:600}
.gd-dica.err{color:var(--gc-er);font-weight:600}
.gd-aviso-cad{margin:0 0 14px;padding:10px 12px;border-radius:10px;border:1px solid var(--gc-av);background:var(--gc-av-sf);color:var(--gc-av);font-size:13.5px;line-height:1.45;font-weight:600;overflow-wrap:anywhere}

/* ── Documentos da ficha e botão do relatório ── */
.gd-rel{flex:none;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--gc-campo);background:transparent;color:var(--gc-tx);font-weight:600;font-size:13.5px;white-space:nowrap}
.gd-rel:hover{background:var(--gc-sf3)}
.gd-rel svg{width:16px;height:16px;flex:none}
.gd-rel[aria-busy="true"]{opacity:.7;cursor:progress}
.dc-vz{margin:0;padding:16px;color:var(--gc-tx2)}
.dc-vz .dc-bt{margin-top:10px}
.dc-it{min-width:0;display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--gc-bd);border-radius:10px}
.dc-cab{display:flex;align-items:center;gap:8px;justify-content:space-between}
.dc-cab b{min-width:0;color:var(--gc-tit);font-size:14px;overflow-wrap:anywhere}
.dc-op{flex:none;font-size:12px;font-weight:600;color:var(--gc-tx2)}
.dc-arq{display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px 10px;align-items:center}
.dc-mini{width:56px;height:56px;border-radius:8px;border:1px solid var(--gc-bd);background:var(--gc-sf3);overflow:hidden;display:grid;place-items:center;color:var(--gc-tx2)}
.dc-mini img{display:block;width:100%;height:100%;object-fit:cover}
.dc-mini svg{width:26px;height:26px}
.dc-info{min-width:0;font-size:12.5px;color:var(--gc-tx2);overflow-wrap:anywhere}
.dc-info b{display:block;font-size:13px;color:var(--gc-tx)}
.dc-tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;border:1px solid var(--gc-campo);background:var(--gc-sf3);color:var(--gc-tit);font-size:11.5px;font-weight:700;vertical-align:1px}
.dc-ac{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.dc-arq .dc-ac{grid-column:1 / -1}
.dc-bt{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--gc-campo);background:transparent;color:var(--gc-tx);font-weight:600;font-size:13px}
.dc-bt:hover{background:var(--gc-sf3)}
.dc-bt:disabled{opacity:.55;cursor:default}
.dc-bt.pri{color:var(--gc-link);border-color:var(--gc-link)}
.dc-bt.er{color:var(--gc-er);border-color:var(--gc-falta-bd)}
.dc-prog{display:grid;gap:4px}
.dc-prog span{font-size:12.5px;font-weight:600;color:var(--gc-tx2);font-variant-numeric:tabular-nums}
.dc-bar{height:6px;border-radius:999px;background:var(--gc-sf3);overflow:hidden}
.dc-bar i{display:block;height:100%;width:0;background:var(--gc-link);border-radius:999px}
.dc-dica{display:block;font-size:12.5px;color:var(--gc-tx2)}
.dc-msg{display:block;font-size:12.5px;font-weight:600;color:var(--gc-er)}
.dc-nota{margin:0;padding:12px 16px 0;font-size:12.5px;color:var(--gc-tx2)}
.dc-venda{display:grid;gap:12px;padding:16px}
.dc-sugs{display:grid;gap:8px}
.dc-sug{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--gc-bd);border-radius:10px}
.dc-sug .dc-info{flex:1 1 180px}
.dc-conf{flex:1 1 100%;font-size:13px;font-weight:600;color:var(--gc-tit)}
.dc-ren{grid-column:1 / -1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0}
.dc-ren input{flex:1 1 160px;min-width:0;min-height:40px;padding:0 10px;border-radius:8px;border:1px solid var(--gc-campo);background:var(--gc-sf);color:var(--gc-tx);font:inherit;font-size:14px}
.dc-ren input:focus-visible{outline:2px solid var(--gc-link);outline-offset:1px}
.dc-arq .dc-msg{grid-column:1 / -1}

/* Estados */
.gc-estado{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:var(--gc-bg);z-index:30}
.gc-estado h2{margin:0 0 6px;font-size:17px;color:var(--gc-tit)}
.gc-estado p{margin:0 0 14px;color:var(--gc-tx2);max-width:420px}
.gc-estado a{color:var(--gc-link);font-weight:600}
.gc-esq{display:flex;flex-direction:column;gap:1px;width:100%;position:absolute;inset:0;background:var(--gc-bg);z-index:29}
.gc-esq i{display:block;height:52px;background:var(--gc-sf);border-bottom:1px solid var(--gc-bd)}
.gc-esq i:nth-child(odd){background:var(--gc-sf2)}

/* Aviso rápido */
.gc-aviso{pointer-events:none;position:fixed;left:50%;bottom:calc(20px + var(--gc-bottom));transform:translateX(-50%);z-index:60;max-width:min(560px,92vw);padding:10px 16px;border-radius:10px;background:var(--gc-sf3);color:var(--gc-tit);border:1px solid var(--gc-campo);font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.28)}

/* ── Celular: a lista, e a ficha abre por cima com "Voltar" ── */
@media (max-width:860px){
  html.io2-casca{ --gc-top:calc(var(--top-h-m) + env(safe-area-inset-top,0px)); --gc-left:0px; --gc-bottom:calc(var(--bot-h) + env(safe-area-inset-bottom,0px)); }
  .gl{width:100%;border-right:0}
  .gl-top{padding:10px 12px}
  .gc-busca input,.gc-sel{height:44px;font-size:16px}
  .gc-chave,.gc-btn{height:44px}
  .gl-it{min-height:64px;padding:10px 14px}
  .gd{position:absolute;inset:0;z-index:20}
  .gd-top{gap:8px;padding:6px 12px 6px 4px;min-height:60px}
  .gd-volta{display:grid}
  .gd-id b{font-size:16px}
  .gd-prog{flex-direction:column;align-items:flex-end;gap:4px}
  .gd-prog .gc-barra{width:72px}
  .gd-corpo{padding:10px 12px 24px}
  .gd-g{margin:0 0 10px}
  .gd-gb{grid-template-columns:1fr;padding:12px;gap:12px}
  .gd-v{min-height:46px}
  .gd-v input,.gd-v select{height:44px;font-size:16px}
  .gd-v textarea{font-size:16px;min-height:96px}
  .gd-ro{padding:11px 12px;font-size:16px}
  .gd-rel{width:44px;height:44px;padding:0;justify-content:center;border-radius:10px}
  .gd-rel span{display:none}
  .gd-rel svg{width:20px;height:20px}
  .dc-bt{min-height:44px;padding:0 16px;font-size:15px}
  .dc-it{padding:12px}
  .dc-venda{padding:12px}
}
/* Janela estreita (ficha ao lado da lista): o botão do relatório vira só o ícone. */
@media (min-width:861px) and (max-width:1100px){
  .gd-rel{width:38px;padding:0;justify-content:center}
  .gd-rel span{display:none}
}

/* ── Relatório de engenharia: só existe na impressão e sai sempre em claro ──
   A folha é papel branco, no tema claro ou no escuro. Por isso as cores dela ficam neste bloco, escritas uma vez
   (--rl-*), e não seguem os tokens da tela. */
#rel{display:none}
.rel{--rl-tx:#111827;--rl-tx2:#4B5563;--rl-bd:#9CA3AF;--rl-fraco:#E5E7EB;--rl-av:#92400E;--rl-av-sf:#FEF3C7;
  background:#FFFFFF;color:var(--rl-tx);font:12px/1.4 "Segoe UI",Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rel h1,.rel h2,.rel h3,.rel p,.rel ul,.rel dl,.rel dd,.rel figure{margin:0;padding:0}
.rel ul{list-style:none}
.rl-topo{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding-bottom:8px;border-bottom:2px solid var(--rl-tx)}
.rl-marca{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--rl-tx2)}
.rl-topo h1{font-size:20px;line-height:1.2}
.rl-cli{margin-top:2px;font-size:14px;font-weight:700}
.rl-meta{display:grid;grid-template-columns:auto auto;gap:1px 10px;font-size:11px}
.rl-meta dt{color:var(--rl-tx2)}
.rl-meta dd{font-weight:700}
.rl-prelim{margin-top:10px;padding:8px 10px;border:1.5px solid var(--rl-av);background:var(--rl-av-sf);color:var(--rl-av);break-inside:avoid}
.rl-prelim h2{font-size:13px;text-transform:uppercase;letter-spacing:.03em}
.rl-prelim p{margin-top:2px}
.rl-pend{margin-top:6px}
.rl-pend h3{font-size:12px}
.rl-pend li{margin:1px 0 0 14px;list-style:disc;color:var(--rl-tx)}
.rl-sec{margin-top:14px}
.rl-sec h2{margin-bottom:6px;padding:3px 0;border-bottom:1px solid var(--rl-bd);font-size:13px;break-after:avoid}
.rl-campos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}
.rl-c{display:grid;grid-template-columns:40% minmax(0,1fr);gap:6px;padding:3px 0;border-bottom:1px solid var(--rl-fraco);break-inside:avoid}
.rl-c dt{color:var(--rl-tx2)}
.rl-c dd{font-weight:600;overflow-wrap:anywhere}
.rl-c dd.sem{font-weight:400;color:var(--rl-tx2)}
.rl-obra-top{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:6px}
.rl-bar{height:9px;border:1px solid var(--rl-tx);border-radius:5px;overflow:hidden;margin:4px 0 8px}
.rl-bar i{display:block;height:100%;background:var(--rl-tx)}
.rl-etapas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 18px}
.rl-et{display:flex;align-items:center;gap:7px;break-inside:avoid}
.rl-et i{flex:none;display:grid;place-items:center;width:13px;height:13px;border:1.5px solid var(--rl-tx);border-radius:3px;font-style:normal;font-size:10px;line-height:1;font-weight:700}
.rl-et.feita i{background:var(--rl-tx);color:#FFFFFF}
.rl-et.atual{font-weight:700}
.rl-et.atual i{border-width:3px}
.rl-fotos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rel .rl-foto{break-inside:avoid;border:1px solid var(--rl-bd);padding:4px}
.rl-foto img{display:block;width:100%;max-height:85mm;object-fit:contain;background:var(--rl-fraco)}
.rl-foto figcaption{margin-top:3px;font-size:11px;font-weight:600}
.rl-falha{display:grid;place-items:center;min-height:30mm;background:var(--rl-fraco);color:var(--rl-tx2);font-size:11px}
.rl-pdfs{margin-top:8px}
.rl-pdfs h3{font-size:12px;margin-bottom:2px}
.rl-pdfs li{margin-left:14px;list-style:disc}
.rl-vazio{color:var(--rl-tx2)}
.rl-ass{width:62%;margin-top:40px;break-inside:avoid}
.rl-ass div{padding-top:4px;border-top:1px solid var(--rl-tx);font-size:11px}
.rl-ass small{display:block;color:var(--rl-tx2);font-size:10.5px}
@page{size:A4 portrait;margin:14mm}
@media print{
  html.gc-imprimindo{color-scheme:light!important;background:#FFFFFF!important}
  html.gc-imprimindo body{height:auto!important;overflow:visible!important;background:#FFFFFF!important}
  html.gc-imprimindo .gc,html.gc-imprimindo .gc-aviso{display:none!important}
  html.gc-imprimindo #rel{display:block}
}

</div>

<script>
(function () {
  'use strict';

  // ── Constantes ──
  var SESSAO_KEY = 'irmaos-na-obra-sessao-v1';
  var EP = !!window.__linhaEP;     // linha Eletroposto (?linha=eletroposto); tudo o que muda por causa dela fica atrás deste sinal
  var API = '/_api/gerador/clientes/' + (EP ? 'eletroposto' : 'solar');
  var SUPABASE_URL = 'https://ancecdfqfwlaujknizof.supabase.co';
  // Chave publishable do Supabase do Gerador: a mesma que já está escrita no index.html do /gerador e na tela do WhatsApp.

  var MOVEL = window.matchMedia('(max-width:860px)');

  // ── Estado (só em memória: nenhum valor de campo vai para localStorage) ──
  var D = null;                     // última resposta
  var cols = [];                    // catálogo do papel (já cortado pelo servidor)
  var grupos = [];                  // seções da ficha, na ordem
  var pvCol = {};                   // Eletroposto: colunas que vêm de Obras (alguma venda trouxe origem pos_venda nelas)
  var colPor = {};
  var linhas = [];
  var linhaPor = {};
  var baseEm = {};                  // instante do servidor em que cada campo foi lido (para o 409)
  var confirmado = {};              // último valor CONFIRMADO pelo servidor de cada campo (a recusa volta para ele, nunca para uma edição ainda não confirmada)
  var pend = {};                    // quantas gravações de cada campo estão na fila
  var filas = {};                   // um POST por vez por venda: ler, mesclar e gravar no servidor não é atômico
  var visiveis = [];                // clientes na lista
  var detalhe = null;               // código do cliente na ficha
  var campos = {};                  // controles da ficha aberta, por chave
  // Colunas que o servidor guarda no cadastro da venda (eletroposto). Com o armazenamento do cadastro fora do ar a venda vem
  // com `cadastro_indisponivel`: elas chegam do legado ou vazias, e gravar nelas não é confiável. As outras colunas seguem como são.
  var COLS_CADASTRO = { cliente: 1, cpf_cnpj: 1, rg_ie: 1, contato: 1, email: 1, endereco: 1, cep: 1, cidade: 1, uf: 1, endereco_ponto: 1, unidade_consumidora: 1, concessionaria: 1, titular_conta: 1 };
  var AVISO_CADASTRO = 'Cadastro do cliente fora do ar agora. Os dados pessoais estão só para leitura; tente de novo em alguns minutos.';
  function cadastroFora(l) { return !!EP && !!l && l.cadastro_indisponivel === true; }
  function colBloqueada(l, c) { return cadastroFora(l) && !!COLS_CADASTRO[c.chave]; }
  var secoes = [];                  // seções da ficha aberta: { cnt, cols }
  var parado = false;
  var carregando = false;
  var DOCS = {};                    // documentos por cliente: { estado, slots, arquivos, vinculo, pode, t }
  var VINC = {};                    // vínculo com proposta (só Solar), por cliente
  var RM = {};                      // remoção em dois passos, por id de arquivo
  var REN = {};                     // renomear, por id de arquivo: { editando, texto, erro, gravando, foco }
  var MSGS = {};                    // último erro de envio, por cliente e item

  var $ = function (id) { return document.getElementById(id); };
  var TX = EP ? {
    planilha: 'a planilha do cliente',
    vazio: 'Nenhuma venda de eletroposto marcada como VENDIDO na agenda.',
    vazioConsultor: 'Nenhuma venda de eletroposto marcada como VENDIDO na agenda.'
  } : {
    planilha: 'a planilha de clientes',
    vazio: 'Nenhuma venda na planilha.',
    vazioConsultor: 'Você ainda não tem venda cadastrada.'
  };
  if (EP) { $('gcTitulo').textContent = 'Planilha do cliente'; $('gcLinha').hidden = false; }

  // ── Utilidades ──
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function semAcento(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  // Mesma régua do servidor: a vírgula ou o ponto entre dígitos é decimal e fica ("2,25k" não casa com "22,5k").
  function chaveOpcao(s) { return semAcento(s).replace(/(\d)\s*[.,]\s*(?=\d)/g, '$1~').replace(/[^a-z0-9~]+/g, ''); }
  function erro(tipo, extra) { var e = new Error(tipo); e.tipo = tipo; if (extra) for (var k in extra) e[k] = extra[k]; return e; }
  var fDin = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var fNum = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 4 });
  var fDM = new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit' });
  function fmtData(iso) { return /^\d{4}-\d{2}-\d{2}$/.test(iso) ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : String(iso); }
  function maskTel(s) {
    var d = String(s).replace(/\D/g, '');
    if (d.length > 11) return d;
    if (d.length <= 2) return d ? '(' + d : '';
    if (d.length <= 6) return '(' + d.slice(0, 2) + ') ' + d.slice(2);
    if (d.length <= 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
    return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
  }
  function fmtTel(d) {
    d = String(d);
    if (/^55\d{10,11}$/.test(d)) return '+55 ' + maskTel(d.slice(2));
    return maskTel(d);
  }
  function vazioV(v) { return v === null || v === undefined || v === ''; }
  function ehNum(c) { return c.tipo === 'dinheiro' || c.tipo === 'inteiro' || c.tipo === 'numero'; }
  function dicaSistema(cel) {
    if (!cel || cel.origem !== 'sistema') return '';
    var dm = '';
    try { dm = fDM.format(new Date(cel.em)); } catch (e) {}
    return 'Preenchido por ' + (cel.por || 'alguém') + (dm ? ' em ' + dm : '');
  }
  var avisoTimer = null;
  function aviso(txt) {
    var a = $('aviso');
    a.textContent = txt; a.hidden = false;
    clearTimeout(avisoTimer);
    avisoTimer = setTimeout(function () { a.hidden = true; }, 6000);
  }
  function plural(n, um, varios) { return n + ' ' + (n === 1 ? um : varios); }

  // Número no formato brasileiro, com a MESMA régua do servidor (numeroBR):
  // "145.000" é cento e quarenta e cinco mil, "1.234,56" vale 1234,56, "1234.56" vale 1234,56. null = não é número.
  function lerNumeroBR(v) {
    var t = String(v == null ? '' : v).replace(/R\$/gi, '').replace(/\s/g, '');
    if (!/^-?[\d.,]+$/.test(t)) return null;
    var neg = t.charAt(0) === '-';
    if (neg) t = t.slice(1);
    if (!t) return null;
    if (t.indexOf(',') >= 0) {
      var p = t.split(',');
      if (p.length !== 2 || !/^\d+$/.test(p[1])) return null;
      if (!/^(\d{1,3}(\.\d{3})+|\d+)$/.test(p[0])) return null;
      t = p[0].replace(/\./g, '') + '.' + p[1];
    } else if (t.indexOf('.') >= 0) {
      if (/^0\.\d+$/.test(t)) { /* decimal com zero na frente */ }
      else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');   // ponto de milhar
      else if (!/^\d+\.\d{1,2}$/.test(t)) return null;
    } else if (!/^\d+$/.test(t)) return null;
    var n = Number(t);
    return isFinite(n) ? (neg ? -n : n) : null;
  }

  // Texto que aparece DENTRO do controle.
  function textoControle(c, v) {
    if (vazioV(v)) return '';
    switch (c.tipo) {
      case 'data': return /^\d{4}-\d{2}-\d{2}$/.test(String(v)) ? String(v) : '';
      case 'dinheiro': return typeof v === 'number' ? fDin.format(v) : String(v);
      case 'numero': return typeof v === 'number' ? fNum.format(v) : String(v);
      case 'telefone': return fmtTel(v);
      default: return String(v);
    }
  }
  // Texto do campo só de leitura.
  function textoLeitura(c, v) {
    if (vazioV(v)) return '';
    switch (c.tipo) {
      case 'data': return fmtData(v);
      case 'dinheiro': return typeof v === 'number' ? 'R$ ' + fDin.format(v) : String(v);
      case 'numero': return typeof v === 'number' ? fNum.format(v) : String(v);
      case 'telefone': return fmtTel(v);
      default: return String(v);
    }
  }

  // ── Sessão: lida e renovada do MESMO jeito que o app principal e a tela do WhatsApp ──
  // Embutida: quem renova a sessão é o app pai. O pai guarda o refresh token em memória e só lê o storage na carga;
  // se esta página girasse o token, a próxima renovação do pai usaria um token gasto e derrubaria a sessão toda.
  var EMB = !!window.__embutida;
  function irParaLogin() {
    parado = true;
    if (EMB) { semSessaoEmbutida(); return; }   // nunca navega nem apaga a sessão aqui dentro
    location.replace('/gerador');
  }
  function lerSessao() { try { return JSON.parse(localStorage.getItem(SESSAO_KEY) || 'null'); } catch (e) { return null; } }
  function sessaoViva(s) { return !!(s && s.access_token && Number(s.expira_em || 0) > Date.now()); }
  var renovando = null;
  // Embutida: pede ao pai uma renovação (voo único dele) e lê o token novo do storage, sem renovar por conta própria.

      var s = lerSessao();

      return s.access_token;
    });
  }
  function embRenovar(tokenUsado) {
    if (renovando) return renovando;
    var p = embPai();

    }, function (e) { renovando = null; throw e; });
    return renovando;
  }
  // Embutida, depois de um 401: se o pai já gravou outro token no storage, tenta com ele primeiro; só então pede renovação ao pai.
  function embRetentar(metodo, caminho, corpo, tk) {
    var s = lerSessao();
    var outro = s && s.access_token && s.access_token !== tk ? s.access_token : null;
    var antes = outro ? pedir(metodo, caminho, corpo, outro).then(function (y) { return y.status === 401 ? null : y; }) : Promise.resolve(null);
    return antes.then(function (y) {
      if (y) return y;
      return embRenovar(outro || tk).then(function (tk3) {
        return pedir(metodo, caminho, corpo, tk3).then(function (z) { if (z.status === 401) { irParaLogin(); throw erro('login'); } return z; });
      });
    });
  }
  function renovar(tokenUsado) {
    if (EMB) return embRenovar(tokenUsado);
    if (renovando) return renovando;
    var rodar = function () { return renovarAgora(tokenUsado); };

    return renovando;
  }
  function renovarAgora(tokenUsado) {
    var s = lerSessao();
    if (!s || !s.refresh_token) { irParaLogin(); return Promise.reject(erro('login')); }
    if (sessaoViva(s) && s.access_token !== tokenUsado) return Promise.resolve(s.access_token);
    var meu = s.refresh_token;
    return fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: meu })
    }).then(function (r) {
      return r.json().catch(function () { return null; }).then(function (j) { return { r: r, j: j }; });

        try {
          localStorage.setItem(SESSAO_KEY, JSON.stringify({
            access_token: x.j.access_token,
            refresh_token: x.j.refresh_token || meu,
            expira_em: Date.now() + (Number(x.j.expires_in || 3600) - 300) * 1000

      throw erro('login');
    });
  }
  function obterToken() {
    if (EMB) return embObterToken();
    var s = lerSessao();
    if (!s || !s.access_token) { irParaLogin(); return Promise.reject(erro('login')); }
    return sessaoViva(s) ? Promise.resolve(s.access_token) : renovar(null);
  }

  // Devolve { status, json } para QUALQUER resposta do servidor (o 409 e o 400 trazem o motivo no corpo).
  function pedir(metodo, caminho, corpo, tk) {
    var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var tt = ctrl ? setTimeout(function () { ctrl.abort(); }, 20000) : null;
    var h = { 'Authorization': 'Bearer ' + tk };
    if (corpo) h['Content-Type'] = 'application/json';
    return fetch(API + caminho, { method: metodo, headers: h, body: corpo ? JSON.stringify(corpo) : undefined, cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) {
        if (tt) clearTimeout(tt);
        return r.json().catch(function () { return null; }).then(function (j) { return { status: r.status, json: j }; });

            it.appendChild(el('p', 'dc-conf', 'Vincular a proposta ' + String(s.codigo) + ' a este cliente?'));
            var b1 = botao(v.salvando ? 'Vinculando...' : 'Confirmar', 'pri', 'vc:' + s.codigo, function () { vincular(codigo, String(s.codigo)); }, 'Confirmar vínculo com a proposta ' + String(s.codigo));
            b1.disabled = !!v.salvando; it.appendChild(b1);
            var b2 = botao('Cancelar', '', 'vx:' + s.codigo, function () { v.escolha = null; pintarDocs(codigo); }); b2.disabled = !!v.salvando; it.appendChild(b2);
          } else it.appendChild(botao('Vincular', 'pri', 'vs:' + s.codigo, function () { v.escolha = String(s.codigo); pintarDocs(codigo); }, 'Vincular a proposta ' + String(s.codigo) + ' de ' + nomeSug));
          sg.appendChild(it);
        });
        box.appendChild(sg);
        var fc = el('div', 'dc-ac'); fc.appendChild(botao('Fechar', '', 'vfechar', function () { VINC[codigo] = {}; pintarDocs(codigo); })); box.appendChild(fc);
      }
    }
    sec.appendChild(box);
    return sec;
  }
  function abrirVinculo(codigo) {
    var l = linhaPor[codigo]; if (!l) return;
    var v = VINC[codigo] = { aberto: true, carregando: true, lista: [], erro: '', escolha: null, salvando: false };
    pintarDocs(codigo);
    api('GET', caminhoDoc(l, '/sugestoes-proposta'), null, true).then(function (x) {
      var j = x.json, arr = Array.isArray(j) ? j : (j && (Array.isArray(j.sugestoes) ? j.sugestoes : Array.isArray(j.propostas) ? j.propostas : null));
      if (x.status === 200 && arr) v.lista = arr.filter(function (s) { return s && s.codigo != null; });
      else v.erro = x.status === 403 ? 'Você não pode vincular propostas.' : msgServidor(x, 'Não consegui buscar as propostas agora.');
    }, function (e) { if (!ehLogin(e)) v.erro = 'Não consegui buscar as propostas agora.'; }).then(function () { v.carregando = false; pintarDocs(codigo); });
  }
  function vincular(codigo, proposta) {
    var l = linhaPor[codigo], v = VINC[codigo]; if (!l || !v || v.salvando) return;
    v.salvando = true; pintarDocs(codigo);
    api('POST', caminhoDoc(l, '/vincular-proposta'), { proposta: proposta }, true).then(function (x) {
      v.salvando = false;
      if (x.status >= 200 && x.status < 300 && !(x.json && x.json.ok === false)) {
        delete VINC[codigo]; aviso('Proposta vinculada.');
        carregarDocs(codigo, true); pintarDocs(codigo);
      } else { aviso(msgServidor(x, 'Não consegui vincular agora.')); v.escolha = null; pintarDocs(codigo); }
    }, function (e) { v.salvando = false; if (!ehLogin(e)) aviso('Não consegui vincular agora. Confira a conexão.'); pintarDocs(codigo); });
  }

  // ── Relatório de engenharia ──
  // A vista de impressão vive neste mesmo documento (uma aba nova teria sessão própria). Só aparece no papel.
  var relOcupado = false, tituloAntes = null;
  var DINHEIRO = /R\$\s*\d/;
  function dataHora(iso) {
    try { return new Intl.DateTimeFormat('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date(iso)); } catch (e) { return String(iso || ''); }
  }
  function valorRel(v) {
    if (v == null || v === '') return '';
    if (typeof v === 'boolean') return v ? 'Sim' : 'Não';
    if (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) return fmtData(v);
    return String(v);
  }
  function nomesPend(v) {
    if (!Array.isArray(v)) return [];
    return v.map(function (x) { return typeof x === 'string' ? x : (x && (x.rotulo || x.chave || x.slot)) ? String(x.rotulo || x.chave || x.slot) : ''; }).filter(Boolean);
  }
  function blocoPend(pai, titulo, v) {
    var nomes = nomesPend(v);
    if (nomes.length) {
      var b = el('div', 'rl-pend'); b.appendChild(el('h3', null, titulo + ' (' + nomes.length + ')'));
      var ul = el('ul'); nomes.forEach(function (n) { ul.appendChild(el('li', null, n)); }); b.appendChild(ul); pai.appendChild(b);
    } else if (typeof v === 'number' && v > 0) { var b2 = el('div', 'rl-pend'); b2.appendChild(el('h3', null, titulo + ': ' + v)); pai.appendChild(b2); }
  }
  function montarRelatorio(R) {
    var raiz = $('rel'), cab = R.cabecalho || {};
    raiz.textContent = '';
    var linhaNome = String(cab.linha || (EP ? 'eletroposto' : 'solar')).toLowerCase();
    linhaNome = linhaNome === 'solar' ? 'Solar' : linhaNome === 'eletroposto' ? 'Eletroposto' : linhaNome.charAt(0).toUpperCase() + linhaNome.slice(1);
    var topo = el('header', 'rl-topo'), esq = el('div');
    esq.appendChild(el('div', 'rl-marca', 'Irmãos na Obra'));
    esq.appendChild(el('h1', null, 'Relatório de engenharia'));
    esq.appendChild(el('div', 'rl-cli', String(cab.cliente || 'Cliente sem nome')));
    var meta = el('dl', 'rl-meta');
    [['Linha', linhaNome], ['Código', String(cab.codigo == null ? '' : cab.codigo)], ['Emitido em', cab.emitido_em ? dataHora(cab.emitido_em) : ''], ['Emitido por', String(cab.emitido_por || '')]].forEach(function (p) {
      if (!p[1]) return; meta.appendChild(el('dt', null, p[0])); meta.appendChild(el('dd', null, p[1]));
    });
    topo.appendChild(esq); topo.appendChild(meta); raiz.appendChild(topo);

    var pd = R.pendencias || {};
    if (R.preliminar) {
      var pr = el('section', 'rl-prelim');
      pr.appendChild(el('h2', null, 'Versão preliminar'));
      pr.appendChild(el('p', null, 'Este relatório tem pendências e ainda não é a versão final.'));
      blocoPend(pr, 'Campos sem preenchimento', pd.campos);
      blocoPend(pr, 'Documentos que faltam', pd.documentos);
      if (pd.obra_concluida === false) {   // no Solar o marco é "sistema liberado"; no Eletroposto, a última etapa da obra
        var bo = el('div', 'rl-pend'); bo.appendChild(el('h3', null, 'Obra não concluída')); pr.appendChild(bo); }
      raiz.appendChild(pr);
    }

    (Array.isArray(R.secoes) ? R.secoes : []).forEach(function (s) {
      // O servidor não manda dinheiro; esta é a segunda trava.
      var campos = (Array.isArray(s.campos) ? s.campos : []).filter(function (c) { return c && !DINHEIRO.test(valorRel(c.valor)); });
      if (!campos.length) return;
      var sec = el('section', 'rl-sec'); sec.appendChild(el('h2', null, String(s.titulo || '')));
      var dl = el('dl', 'rl-campos');
      campos.forEach(function (c) {
        var it = el('div', 'rl-c'), v = valorRel(c.valor);
        it.appendChild(el('dt', null, String(c.rotulo || '')));
        it.appendChild(el('dd', v ? null : 'sem', v || 'Não informado'));
        dl.appendChild(it);
      });
      sec.appendChild(dl); raiz.appendChild(sec);
    });

    var ob = R.obra;
    if (ob && typeof ob === 'object') {
      var so = el('section', 'rl-sec'); so.appendChild(el('h2', null, 'Obra'));
      var top = el('div', 'rl-obra-top');
      if (ob.modelo_rotulo) top.appendChild(el('span', null, 'Trilho: ' + String(ob.modelo_rotulo)));
      var total = Number(ob.total) || 0, feitas = Number(ob.feitas) || 0;
      top.appendChild(el('span', null, 'Etapas feitas: ' + feitas + ' de ' + total));
      if (ob.previsto) top.appendChild(el('span', null, 'Previsto: ' + valorRel(ob.previsto)));
      so.appendChild(top);
      var bar = el('div', 'rl-bar'), fi = el('i'); fi.style.width = (total ? Math.min(100, Math.round(100 * feitas / total)) : 0) + '%'; bar.appendChild(fi); so.appendChild(bar);
      var et = el('div', 'rl-etapas');
      (Array.isArray(ob.etapas) ? ob.etapas : []).forEach(function (e) {
        var x = el('div', 'rl-et' + (e.feita ? ' feita' : '') + (e.atual ? ' atual' : '')), cx = el('i', null, e.feita ? '✓' : '');
        x.appendChild(cx); x.appendChild(el('span', null, String(e.rotulo || '') + (e.atual ? ' (em andamento)' : ''))); et.appendChild(x);
      });
      so.appendChild(et); raiz.appendChild(so);
    }

    var docs = Array.isArray(R.documentos) ? R.documentos : [];
    var sd = el('section', 'rl-sec'); sd.appendChild(el('h2', null, 'Documentos'));
    var fotos = docs.filter(function (x) { return x && /^image\//i.test(String(x.mime || '')); }), pdfs = docs.filter(function (x) { return x && !/^image\//i.test(String(x.mime || '')); });
    if (!docs.length) sd.appendChild(el('p', 'rl-vazio', 'Nenhum documento anexado.'));
    if (fotos.length) {
      var gf = el('div', 'rl-fotos');
      fotos.forEach(function (x) {
        var fg = el('figure', 'rl-foto'), u = urlHttps(x.url);
        if (u) { var im = el('img'); im.alt = String(x.rotulo || 'Documento'); im.referrerPolicy = 'no-referrer'; im.src = u; fg.appendChild(im); }
        else fg.appendChild(el('div', 'rl-falha', 'Imagem indisponível'));
        fg.appendChild(el('figcaption', null, String(x.rotulo || 'Documento'))); gf.appendChild(fg);
      });
      sd.appendChild(gf);
    }
    if (pdfs.length) {
      var lp = el('div', 'rl-pdfs'); lp.appendChild(el('h3', null, 'Arquivos em PDF anexados'));
      var ul = el('ul'); pdfs.forEach(function (x) { ul.appendChild(el('li', null, String(x.rotulo || 'Documento'))); }); lp.appendChild(ul); sd.appendChild(lp);
    }
    raiz.appendChild(sd);

    var as = el('div', 'rl-ass'), ad = el('div', null, 'Responsável técnico'); ad.appendChild(el('small', null, 'Nome, registro profissional e data')); as.appendChild(ad); raiz.appendChild(as);
  }
  // Espera todas as fotos; a que não chegou vira um aviso no papel (nunca um quadro em branco calado).
  function esperarImagens(raiz) {
    var imgs = Array.prototype.slice.call(raiz.querySelectorAll('img'));
    var uma = function (im) {
      return new Promise(function (ok) {
        if (im.complete) return ok();
        im.addEventListener('load', function () { ok(); }); im.addEventListener('error', function () { ok(); });
      }).then(function () { return (im.decode && im.naturalWidth) ? im.decode().catch(function () {}) : null; });
    };
    var limite = new Promise(function (ok) { setTimeout(ok, 25000); });
    return Promise.race([Promise.all(imgs.map(uma)), limite]).then(function () {
      var falhas = 0;
      imgs.forEach(function (im) {
        if (im.complete && im.naturalWidth > 0) return;
        falhas++;
        var ph = el('div', 'rl-falha', 'Imagem indisponível');
        if (im.parentNode) im.parentNode.replaceChild(ph, im);
      });
      return falhas;
    });
  }
  function fimImpressao() {
    document.documentElement.classList.remove('gc-imprimindo');
    if (tituloAntes != null) { document.title = tituloAntes; tituloAntes = null; }
    $('rel').textContent = '';
  }
  function gerarRelatorio() {
    var codigo = detalhe, l = codigo && linhaPor[codigo];
    if (!l || relOcupado) return;
    relOcupado = true;
    var btn = $('gdRel'); btn.setAttribute('aria-busy', 'true'); btn.disabled = true;
    api('GET', caminhoDoc(l, '/relatorio'), null, true).then(function (x) {
      var j = x.json;
      if (x.status !== 200 || !j || j.ok === false) throw erro('servidor', { msg: x.status === 403 ? 'Você não tem permissão para emitir este relatório.' : msgServidor(x, 'Não consegui gerar o relatório agora. Tente de novo.') });
      montarRelatorio(j);
      return esperarImagens($('rel'));
    }).then(function (falhas) {
      if (falhas) aviso(falhas === 1 ? 'Uma imagem não carregou e saiu como aviso no papel.' : falhas + ' imagens não carregaram e saíram como aviso no papel.');
      if (tituloAntes == null) tituloAntes = document.title;   // duas emissões seguidas sem afterprint no meio não podem guardar o título já trocado
      document.title = 'Relatório de engenharia ' + l.codigo + (l.cliente ? ' ' + l.cliente : '');
      document.documentElement.classList.add('gc-imprimindo');
      window.print();
      /* Reserva para navegador que não dispara afterprint (Safari antigo no iPhone): a vista some sozinha em 2 min,
         para um Ctrl+P depois não imprimir o relatório anterior. No computador o print() segura até fechar o diálogo. */
      setTimeout(function () { if (document.documentElement.classList.contains('gc-imprimindo')) fimImpressao(); }, 120000);
    }).catch(function (e) {
      if (ehLogin(e)) return;
      fimImpressao();
      aviso((e && e.msg) || 'Não consegui gerar o relatório agora. Confira a conexão e tente de novo.');
    }).then(function () { relOcupado = false; btn.removeAttribute('aria-busy'); btn.disabled = false; });
  }

  // ── Controles ──
  var tb = null;
  $('busca').addEventListener('input', function () { clearTimeout(tb); tb = setTimeout(desenharLista, 120); });
  $('fCons').addEventListener('change', desenharLista);
  $('fPend').addEventListener('click', function () {
    var b = $('fPend'); b.setAttribute('aria-checked', b.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
    desenharLista();
  });
  // Atualizar espera as gravações em andamento: ler antes delas terminarem traria o valor velho de volta.
  $('atualizar').addEventListener('click', function () {
    var a = document.activeElement;
    if (a && $('gdCorpo').contains(a) && a.blur) a.blur();
    Promise.all(Object.keys(filas).map(function (k) { return filas[k]; })).then(function () { return carregar(); });
  });
  $('faixaBtn').addEventListener('click', function () { carregar(); });
  $('gdRel').addEventListener('click', gerarRelatorio);
  window.addEventListener('afterprint', fimImpressao);
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || !MOVEL.matches || $('gd').hidden) return;
    var a = document.activeElement, tag = a && a.tagName;
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
    fecharFicha();
  });
  // Mudou entre celular e computador: no computador a ficha fica sempre ao lado; no celular volta para a lista.
  function aoMudarLargura() {
    if (!D) return;
    if (MOVEL.matches) { $('gd').hidden = true; return; }
    if (!detalhe && visiveis.length) detalhe = visiveis[0].codigo;
    marcarAtivo(); desenharFicha(); $('gd').hidden = false;
  }
  if (MOVEL.addEventListener) MOVEL.addEventListener('change', aoMudarLargura);
  window.addEventListener('pagehide', function () { var a = document.activeElement; if (a && a.blur && $('gdCorpo').contains(a)) a.blur(); });

  if (EMB) {
    window.addEventListener('storage', function (e) {
      if (e.key === 'gerador-tema') {
        if (e.newValue === 'escuro') document.documentElement.setAttribute('data-io2-tema', 'escuro');
        else document.documentElement.removeAttribute('data-io2-tema');
      } else if (e.key === 'gerador-visual') {
        try { location.reload(); } catch (x) {}
      }
    });
  }

  if (window.__semSessao) semSessaoEmbutida(); else carregar();
})();
</script>
