<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planilha de clientes | Irmãos na Obra</title>
<meta name="theme-color" content="#0B1220">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" sizes="192x192" href="/gerador/icon-192.png">
<script>
  // Mesma auth do /gerador. Sem sessão, volta para a tela de login.
  (function(){
    var AUTH_KEY = 'irmaos-na-obra-auth-v1';
    var authed = false;
    try { authed = !!localStorage.getItem(AUTH_KEY); } catch(e){}
    // Modo embutido (aba Planilha de clientes do Solar): a página roda dentro de um iframe do /gerador.
    var emb = false;
    try { emb = window.self !== window.top; } catch (e) { emb = true; }
    window.__embutida = emb;
    if (emb) document.documentElement.classList.add('gc-embutida');
    if (!authed) {
      // Navegar aqui carregaria o app inteiro dentro do iframe: no modo embutido só avisa (veja semSessaoEmbutida).
      if (emb) window.__semSessao = true; else location.replace('/gerador');
    }
  })();
</script>
<style>
/* ── Papéis de cor da página ─────────────────────────────────────────────────
   Visual antigo (sem io2): escuro nativo, como os outros subapps.
   Visual novo (html.io2): cada papel aponta para o token do papel, no claro e no escuro.
   Nenhuma cor escrita à mão fora deste bloco. */
:root{
  --gc-bg:#0F172A; --gc-sf:#1E293B; --gc-sf2:#172033; --gc-sf3:#2A3A52; --gc-bd:#334155; --gc-campo:#7C8DA5;
  --gc-tx:#E5E7EB; --gc-tx2:#B4C0D2; --gc-tx3:#98A8BF; --gc-tit:#F8FAFC;
  --gc-link:#7DB4FF; --gc-fill:#1D4ED8; --gc-marcado:#1D4ED8; --gc-sel:#7DB4FF;
  --gc-ok:#4ADE80; --gc-er:#F87171; --gc-av:#FBBF24; --gc-av-sf:#3A2A0C;
  /* Célula obrigatória em branco: vermelho bem claro, sem texto de aviso. No visual antigo é o vermelho translúcido equivalente ao token. */
  --gc-falta:rgba(248,113,113,.16);
  --gc-top:0px; --gc-left:0px; --gc-bottom:0px;
}
html.io2{
  --gc-bg:var(--n-bg); --gc-sf:var(--n-sf); --gc-sf2:var(--n-sf2); --gc-sf3:var(--n-sf3); --gc-bd:var(--n-bd); --gc-campo:var(--io-borda-campo);
  --gc-tx:var(--n-tx); --gc-tx2:var(--n-tx2); --gc-tx3:var(--n-tx3); --gc-tit:var(--io-titulo);
  --gc-link:var(--io-azul-tx); --gc-fill:var(--io-azul); --gc-marcado:var(--io-marcado); --gc-sel:var(--io-azul-tx);
  --gc-ok:var(--io-ok-tx); --gc-er:var(--io-er-tx); --gc-av:var(--io-av-tx); --gc-av-sf:var(--io-av-sf);
  --gc-falta:var(--io-er-sf);
  font-family:var(--io-fonte);
}
/* Dentro da casca: a página ocupa a área de trabalho inteira, da borda do trilho (240 ou 64 px, vem de --sb-w) até a direita. */
html.io2-casca{ --gc-top:var(--top-h); --gc-left:var(--sb-w); }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding:0;overflow:hidden;background:var(--gc-bg);color:var(--gc-tx);
  font-family:var(--io-fonte,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gc-link);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── Estrutura ── */
.gc{position:fixed;top:var(--gc-top);left:var(--gc-left);right:0;bottom:var(--gc-bottom);display:flex;flex-direction:column;background:var(--gc-bg);min-width:0}
.gc-faixa{flex:none;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--gc-av-sf);color:var(--gc-av);border-bottom:1px solid var(--gc-av);font-weight:600;font-size:13px}
.gc-faixa button{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--gc-av);background:transparent;color:var(--gc-av);font-weight:700;font-size:13px}

/* ── Linha de controle ── */
.gc-bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;background:var(--gc-sf);border-bottom:1px solid var(--gc-bd)}
.gc-cab{display:flex;align-items:center;gap:12px}
.gc-cab h1{margin:0;font-size:16px;font-weight:700;color:var(--gc-tit);white-space:nowrap}
.gc-sair{color:var(--gc-link);text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap}
html.io2-casca .gc-cab,html.gc-embutida .gc-cab{display:none}
.gc-busca{position:relative;flex:0 1 260px;min-width:180px}
.gc-busca svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--gc-tx3);pointer-events:none}
.gc-busca input{width:100%;height:38px;padding:0 12px 0 34px;border:1px solid var(--gc-campo);border-radius:10px;background:var(--gc-bg);color:var(--gc-tx)}
.gc-busca input::placeholder{color:var(--gc-tx3);opacity:1}
.gc-sel{height:38px;padding:0 10px;border:1px solid var(--gc-campo);border-radius:10px;background:var(--gc-bg);color:var(--gc-tx);max-width:190px}
.gc-chave{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 4px;border:0;background:transparent;color:var(--gc-tx);font-weight:600;font-size:13.5px}
.gc-chave i{position:relative;flex:none;width:36px;height:20px;border-radius:999px;background:var(--gc-sf3);border:1px solid var(--gc-campo);transition:background .12s}
.gc-chave i::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--gc-tx2);transition:transform .12s}
.gc-chave[aria-checked="true"] i{background:var(--gc-marcado);border-color:var(--gc-marcado)}
.gc-chave[aria-checked="true"] i::after{transform:translateX(16px);background:#fff}
.gc-cont{margin-left:auto;font-size:13.5px;font-weight:600;color:var(--gc-tx);white-space:nowrap;font-variant-numeric:tabular-nums}
.gc-cont b{color:var(--gc-er)}
.gc-btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--gc-campo);background:transparent;color:var(--gc-tx);font-weight:600;font-size:13.5px}
.gc-btn:hover{background:var(--gc-sf3)}
.gc-btn svg{width:16px;height:16px}

/* ── Grade ── */
.gc-corpo{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.gc-rol{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;background:var(--gc-bg)}
.gc-rol:focus-visible{outline-offset:-2px}
.gc-t{border-collapse:separate;border-spacing:0;table-layout:fixed}
.gc-t th,.gc-t td{padding:0 10px;border-right:1px solid var(--gc-bd);border-bottom:1px solid var(--gc-bd);background:var(--gc-sf);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;text-align:left}
.gc-t td{height:38px;position:relative;color:var(--gc-tx);cursor:cell}
.gc-t thead th{position:sticky;z-index:4;background:var(--gc-sf2);color:var(--gc-tit);font-weight:700}
.gc-t tr.g1 th{top:0;height:30px;font-size:12px;letter-spacing:.02em;border-bottom-color:var(--gc-campo)}
.gc-t tr.g2 th{top:30px;height:44px;white-space:normal;line-height:1.2;font-size:12.5px;vertical-align:middle}
.gc-t tr.g2 th span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gc-t th.gi{border-left:2px solid var(--gc-campo)}
.gc-t th.num,.gc-t td.num{text-align:right;font-variant-numeric:tabular-nums}
.gc-t td.fx,.gc-t th.fx{position:sticky;z-index:2}
.gc-t thead th.fx{z-index:6}
.fx0{left:0}.fx1{left:78px}.fx2{left:288px}
.gc-t .fx2{border-right:2px solid var(--gc-campo)}
.gc-t td.fx0{color:var(--gc-tx2);font-variant-numeric:tabular-nums;cursor:default}
.gc-t td.fx1{font-weight:600;color:var(--gc-tit)}
.gc-t tbody tr:hover td.fx0,.gc-t tbody tr:hover td.fx2{background:var(--gc-sf3)}
/* Obrigatória em branco: o fundo vermelho claro vai POR CIMA do fundo sólido (as colunas fixas não podem ser translúcidas). */
.gc-t td.falta,.gd-v.falta{background-image:linear-gradient(var(--gc-falta),var(--gc-falta))}
.gc-t td.calc,.gd-v.calc{color:var(--gc-tx2);background-color:var(--gc-sf2);cursor:default}
.gc-t td.sis::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--gc-link)}
.gc-t td.salvando::after{background:var(--gc-av);animation:gcpisca .8s ease-in-out infinite}
@keyframes gcpisca{50%{opacity:.25}}
.gc-t td.sel{box-shadow:inset 0 0 0 2px var(--gc-sel)}
.gc-t td.edit{padding:0;overflow:visible;box-shadow:inset 0 0 0 2px var(--gc-sel);background:var(--gc-bg)}
.gc-t td.edit input{width:100%;height:100%;border:0;outline:0;padding:0 10px;background:var(--gc-bg);color:var(--gc-tx);font-size:13px}
.gc-t td.edit input.num{text-align:right;font-variant-numeric:tabular-nums}
.gc-prog{display:flex;align-items:center;gap:8px}
.gc-barra{flex:none;width:44px;height:6px;border-radius:999px;background:var(--gc-sf3);overflow:hidden}
.gc-barra i{display:block;height:100%;background:var(--gc-link);border-radius:999px}
.gc-barra.cheio i{background:var(--gc-ok)}
.gc-prog span{font-size:12px;color:var(--gc-tx2);font-variant-numeric:tabular-nums;white-space:nowrap}

/* Menu de lista (computador) */
.gc-menu{position:fixed;z-index:50;min-width:160px;max-height:280px;overflow:auto;padding:4px;border:1px solid var(--gc-campo);border-radius:10px;background:var(--gc-sf);box-shadow:0 8px 24px rgba(0,0,0,.28);outline:0}
.gc-menu div{padding:8px 10px;border-radius:6px;font-size:13.5px;color:var(--gc-tx);cursor:pointer;white-space:nowrap}
.gc-menu div[aria-selected="true"]{background:var(--gc-marcado);color:#fff}
.gc-menu div.sutil{color:var(--gc-tx2);font-style:normal}

/* Estados */
.gc-estado{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:var(--gc-bg);z-index:8}
.gc-estado h2{margin:0 0 6px;font-size:17px;color:var(--gc-tit)}
.gc-estado p{margin:0 0 14px;color:var(--gc-tx2);max-width:420px}
.gc-estado a{color:var(--gc-link);font-weight:600}
.gc-esq{display:flex;flex-direction:column;gap:1px;width:100%;position:absolute;inset:0;background:var(--gc-bg);z-index:7}
.gc-esq i{display:block;height:38px;background:var(--gc-sf);border-bottom:1px solid var(--gc-bd)}
.gc-esq i:nth-child(odd){background:var(--gc-sf2)}

/* Aviso rápido */
.gc-aviso{position:fixed;left:50%;bottom:calc(20px + var(--gc-bottom));transform:translateX(-50%);z-index:60;max-width:min(560px,92vw);padding:10px 16px;border-radius:10px;background:var(--gc-sf3);color:var(--gc-tit);border:1px solid var(--gc-campo);font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.28)}

/* ── Celular: lista e cliente ── */
.gc-cartoes{display:none}
.gd{display:none}
@media (max-width:860px){
  html.io2-casca{ --gc-top:calc(var(--top-h-m) + env(safe-area-inset-top,0px)); --gc-left:0px; --gc-bottom:calc(var(--bot-h) + env(safe-area-inset-bottom,0px)); }
  .gc-bar{padding:10px 12px}
  .gc-busca{flex:1 1 100%}
  .gc-busca input,.gc-sel{height:44px;font-size:16px}
  .gc-sel{flex:1 1 auto;max-width:none}
  .gc-chave{height:44px}
  .gc-btn{height:44px}
  .gc-cont{margin-left:0;flex:1 1 100%}
  .gc-grupo-sel{display:none}
  .gc-rol{display:none}
  .gc-cartoes{display:block;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:10px 12px 16px}
  .gc-cartao{display:block;width:100%;margin:0 0 10px;padding:12px 14px;min-height:72px;text-align:left;border:1px solid var(--gc-bd);border-radius:12px;background:var(--gc-sf)}
  .gc-cartao .l1{display:flex;align-items:baseline;gap:10px}
  .gc-cartao .cod{flex:none;font-size:12.5px;color:var(--gc-tx2);font-variant-numeric:tabular-nums}
  .gc-cartao .nm{flex:1;min-width:0;font-weight:700;color:var(--gc-tit);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gc-cartao .l2{display:flex;align-items:center;gap:10px;margin-top:8px}
  .gc-cartao .l2 .gc-barra{flex:1;width:auto}
  .gc-cartao .fal{flex:none;font-size:12.5px;font-weight:700;color:var(--gc-er);white-space:nowrap}
  .gc-cartao .fal.ok{color:var(--gc-ok)}
  .gd{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--gc-bg)}
  .gd[hidden]{display:none!important}
  .gd-top{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 4px;background:var(--gc-sf);border-bottom:1px solid var(--gc-bd);min-height:60px}
  .gd-volta{flex:none;width:44px;height:44px;border:0;background:transparent;color:var(--gc-link);display:grid;place-items:center;border-radius:10px}
  .gd-volta svg{width:22px;height:22px}
  .gd-id{flex:1;min-width:0}
  .gd-id b{display:block;font-size:16px;color:var(--gc-tit);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gd-id span{display:block;font-size:12.5px;color:var(--gc-tx2)}
  .gd-corpo{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:10px 12px 24px}
  .gd-g{margin:0 0 10px;border:1px solid var(--gc-bd);border-radius:12px;background:var(--gc-sf);overflow:hidden}
  .gd-gh{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:0 14px;border:0;background:transparent;color:var(--gc-tit);font-weight:700;font-size:15px;text-align:left}
  .gd-gh .fal{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--gc-er)}
  .gd-gh svg{flex:none;width:18px;height:18px;transition:transform .12s;color:var(--gc-tx2)}
  .gd-gh[aria-expanded="true"] svg{transform:rotate(90deg)}
  .gd-gb{padding:0 12px 12px;display:grid;gap:10px}
  .gd-f{display:block}
  .gd-f label{display:block;font-size:12.5px;color:var(--gc-tx2);margin:0 0 4px;font-weight:600}
  .gd-v{display:flex;align-items:center;width:100%;min-height:44px;padding:0 12px;border:1px solid var(--gc-bd);border-radius:10px;background-color:var(--gc-bg);color:var(--gc-tx);font-size:16px;text-align:left;overflow-wrap:anywhere}
  .gd-v.num{justify-content:flex-end;font-variant-numeric:tabular-nums}
  .gd-v.sis{border-color:var(--gc-link)}
  .gd-v.edit{padding:0;border-color:var(--gc-sel)}
  .gd-v input,.gd-v select{width:100%;height:44px;border:0;outline:0;padding:0 12px;background:var(--gc-bg);color:var(--gc-tx);font-size:16px;border-radius:10px}
  .gd-v input.num{text-align:right}
  .gd-dica{display:block;margin-top:3px;font-size:12px;color:var(--gc-tx2)}
}
</style>

<script src="/gerador/ui/chave.js"></script>
</head>
<body>

<div class="gc" id="gc">
  <div class="gc-faixa" id="faixa" role="status" hidden>
    <span id="faixaTx">Não consegui ler a planilha agora</span>
    <button type="button" id="faixaBtn">Tentar de novo</button>
  </div>
  <header class="gc-bar" id="bar">
    <div class="gc-cab"><a class="gc-sair" href="/gerador" target="_top">Voltar ao Gerador</a><h1>Planilha de clientes</h1></div>
    <div class="gc-busca">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <label class="sr" for="busca">Buscar por nome ou código</label>
      <input id="busca" type="search" placeholder="Buscar por nome ou código" autocomplete="off" inputmode="search">
    </div>
    <label class="sr" for="fCons">Consultor</label>
    <select class="gc-sel" id="fCons" hidden><option value="">Todos os consultores</option></select>
    <label class="sr" for="fGrupo">Grupo de colunas</label>
    <select class="gc-sel gc-grupo-sel" id="fGrupo"><option value="">Todos os grupos</option></select>
    <button type="button" class="gc-chave" id="fPend" role="switch" aria-checked="false"><i aria-hidden="true"></i>Só com pendência</button>
    <button type="button" class="gc-btn" id="atualizar" title="Ler a planilha e os dados de novo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.5-4M4 4v4h4M4 13a8 8 0 0 0 14.5 4M20 20v-4h-4"/></svg>Atualizar
    </button>
    <div class="gc-cont" id="cont" aria-live="polite"></div>
  </header>
  <div class="gc-corpo" id="corpo">
    <div class="gc-rol" id="rol" tabindex="0" role="grid" aria-label="Grade de clientes">
      <table class="gc-t" id="tab"></table>
    </div>
    <div class="gc-cartoes" id="cartoes"></div>
    <div class="gc-esq" id="esq" hidden></div>
    <div class="gc-estado" id="estado" hidden></div>
  </div>
  <section class="gd" id="gd" hidden aria-label="Cliente">
    <header class="gd-top">
      <button type="button" class="gd-volta" id="gdVolta" aria-label="Voltar para a lista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="gd-id"><b id="gdNome"></b><span id="gdSub"></span></div>
    </header>
    <div class="gd-corpo" id="gdCorpo"></div>
  </section>
</div>
<div class="gc-aviso" id="aviso" role="status" hidden></div>

<script>
(function () {
  'use strict';

  // ── Constantes ──
  var SESSAO_KEY = 'irmaos-na-obra-sessao-v1';

  var SUPABASE_KEY = 'sb_publishable_IK5RV-I0PlQNpb7-cXBQFg_-pSYscO6'; // gitleaks:allow (chave publica de navegador, a mesma do index.html; o .gitleaks.toml libera em dashboard/public)
  var FIX_W = 78 + 210 + 120;       // colunas fixas à esquerda: código, cliente, progresso
  var HEAD_H = 30 + 44;             // cabeçalho em duas linhas
  var LARGURA = { data: 120, dinheiro: 130, inteiro: 96, numero: 110, telefone: 150, lista: 160, texto: 190 };
  var LARGURA_CHAVE = { endereco: 260, obs: 240, homologacao: 210, origem: 200, mao_de_obra: 170, parecer_acesso: 130, sistema_liberado: 150, depoimento: 170, cidade: 170 };
  var MOVEL = window.matchMedia('(max-width:860px)');

  // ── Estado (só em memória: nenhum valor de célula vai para localStorage) ──
  var D = null;                     // última resposta
  var cols = [];                    // catálogo do papel (já cortado pelo servidor)
  var colPor = {};

  var visiveis = [];                // linhas na tela
  var colsGrade = [];               // colunas da rolagem (sem código, cliente e progresso)
  var sel = null;                   // { r, c }: índices em visiveis e em ['cliente'].concat(colsGrade)
  var editor = null;
  var menu = null;
  var detalhe = null;               // código aberto no celular
  var parado = false;
  var carregando = false;

  var $ = function (id) { return document.getElementById(id); };
  var elRol = $('rol'), elTab = $('tab');

  // ── Utilidades ──
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }

    var fal = faltandoDe(l, lista);
    var s = $('gdCorpo').querySelector('.fal[data-g="' + c.grupo.replace(/"/g, '') + '"]');
    if (s) s.textContent = fal ? 'Faltam ' + fal : '';
  }

  // ── Controles ──
  var tb = null;
  $('busca').addEventListener('input', function () { clearTimeout(tb); tb = setTimeout(function () { if (editor) fecharEditor(true); desenhar(); }, 120); });
  $('fCons').addEventListener('change', function () { if (editor) fecharEditor(true); desenhar(); });
  $('fGrupo').addEventListener('change', function () { if (editor) fecharEditor(true); sel = null; desenhar(); });
  $('fPend').addEventListener('click', function () {
    var b = $('fPend'); b.setAttribute('aria-checked', b.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
    if (editor) fecharEditor(true);
    desenhar();
  });
  $('atualizar').addEventListener('click', function () { if (editor) fecharEditor(true); carregar(); });
  $('faixaBtn').addEventListener('click', function () { carregar(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && detalhe && !editor) fecharCliente();
  });
  // Mudou entre computador e celular com um editor aberto: fecha sem gravar surpresa.
  MOVEL.addEventListener && MOVEL.addEventListener('change', function () { if (editor) fecharEditor(true); if (!MOVEL.matches) { detalhe = null; $('gd').hidden = true; } });
  window.addEventListener('pagehide', function () { if (editor) fecharEditor(true); });

  if (EMB) {
    window.addEventListener('storage', function (e) {
      if (e.key === 'gerador-tema') {
        if (e.newValue === 'escuro') document.documentElement.setAttribute('data-io2-tema', 'escuro');
        else document.documentElement.removeAttribute('data-io2-tema');
      } else if (e.key === 'gerador-visual') {
        try { location.reload(); } catch (x) {}
      }
    });
  }

  if (window.__semSessao) semSessaoEmbutida(); else carregar();
})();
</script>
</body>
</html>
