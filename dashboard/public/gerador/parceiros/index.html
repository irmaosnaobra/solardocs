<!DOCTYPE html>

<head>

<meta name="theme-color" content="#0B1220">
<link rel="icon" type="image/png" sizes="192x192" href="/gerador/icon-192.png">
<script>
  // Mesma auth do /gerador. Sem sessão, manda para a tela de login.
  (function(){
    var AUTH_KEY = 'irmaos-na-obra-auth-v1';
    var authed = false;
    try { authed = !!localStorage.getItem(AUTH_KEY); } catch(e){}
    if (!authed) location.replace('/gerador');
  })();
</script>
<link rel="stylesheet" href="/nexus/adm/painel.css">
<link rel="stylesheet" href="/gerador/ui/io2.css" media="not all" data-io2>

</head>
<body class="pn-pg">

<div class="topbar">
  <div class="brand">Parceiros NEXUS <small>Irmãos na Obra</small></div>
  <div class="actions">
    <button id="btn-refresh" onclick="carregar()" title="Recarregar os dados" style="width:36px;padding:8px 0">↻</button>
    <button onclick="location.href='/gerador'">← Voltar</button>
  </div>
</div>

<div class="wrap">

  <div id="painel-raiz" class="pn"></div>
</div>
