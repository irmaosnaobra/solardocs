<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Apresentação de projeto — Irmãos na Obra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/gerador/apresentacao-deck.css">
</head>
<body>
<div id="deck"></div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   APRESENTAÇÃO DE PROJETO — MOTOR DO PADRÃO
   ──────────────────────────────────────────────────────────────────────────
   Esta página NÃO tem conteúdo próprio: ela monta as 21 páginas a partir de
   um único objeto, o window.__DECK. Quem injeta esse objeto é o servidor
   (Puppeteer, via evaluateOnNewDocument) ou o ?d=<base64 do JSON> para prévia
   no navegador.

   O padrão nasceu do deck do Edeilson (02/09/2026) e as regras que ele
   carrega valem para todo cliente:

     1. NENHUM número financeiro é escrito aqui. Todos chegam prontos no
        __DECK, calculados pelo computeEletro() — a mesma função do Simulador.
        Este arquivo formata, não calcula.
     2. Amarelo/dourado é a USINA, verde é o ELETROPOSTO. Página que fala das
        duas metades é neutra (.amb) e colore cada item pela sua vertical
        (.c-sol / .c-ele). Nenhuma cor aparece fora da vertical dela.
     3. Nada de ressalva, alerta ou nota de risco: é proposta de venda. O que
        precisa ser dito vai em linguagem afirmativa.
     4. Foto que não é do terreno do cliente leva legenda dizendo isso.
     5. A ordem das páginas é fixa. É ela que garante 10/10 toda vez, em vez
        de 10/10 uma vez.
   ══════════════════════════════════════════════════════════════════════════ */

// ── entrada ────────────────────────────────────────────────────────────────
function carregarDados() {
  if (window.__DECK) return window.__DECK;
  const q = new URLSearchParams(location.search).get('d');
  if (q) { try { return JSON.parse(decodeURIComponent(escape(atob(q)))); } catch (e) { console.error('__DECK inválido', e); } }
  return null;
}

// ── formatadores ───────────────────────────────────────────────────────────
const brl  = n => 'R$ ' + Math.round(Number(n) || 0).toLocaleString('pt-BR');
const brl2 = n => 'R$ ' + (Number(n) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const num  = n => Math.round(Number(n) || 0).toLocaleString('pt-BR');
const dec  = (n, c = 1) => (Number(n) || 0).toFixed(c).replace('.', ',');
const esc  = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
/** deixa passar o negrito que os textos do __DECK usam, e mais nada */
const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
/** número para dentro de style="": SEMPRE ponto decimal. dec() usa vírgula e é só
 *  para texto — se vazar para o CSS, a regra inteira é descartada pelo navegador
 *  (foi o que quebrou a barra da conta de luz e as colunas do gráfico). */
const css  = (n, c = 2) => (Number(n) || 0).toFixed(c);
const mil  = n => { const v = Math.round(Number(n) || 0); return Math.abs(v) >= 1000 ? (v / 1000).toFixed(0) + ' mil' : String(v); };

// ── blocos reaproveitados ──────────────────────────────────────────────────
function marca(tipo, D) {
  const L = D.logos || {};
  if (tipo === 'sol')  return lock([L.solar], 'ENERGIA SOLAR');
  if (tipo === 'ele')  return lock([L.eletroposto], 'MOBILIDADE ELÉTRICA');
  return lock([L.solar, L.eletroposto], 'SOLAR &middot; MOBILIDADE ELÉTRICA', true);
}
function lock(srcs, sub, duplo) {
  const imgs = srcs.filter(Boolean).map(s => `<img src="${esc(s)}" alt="">`).join('\n    ');
  if (!imgs) return '';
  return `  <div class="brand-tr lockup${duplo ? ' duplo' : ''}">
    ${imgs}
    <div><div class="n1">IRMÃOS NA OBRA</div><div class="n2">${sub}</div></div>
  </div>\n`;
}
const fundo = (src, cls) => src ? `  <div class="bg${cls ? ' ' + cls : ''}" style="background-image:url('${esc(src)}')"></div>\n` : '';
const veu   = cls => `  <div class="scrim ${cls}"></div>\n`;
const barra = () => '  <div class="bar"></div>\n';
const rodape = (esq, pg) => `  <div class="foot">${esq}</div>\n  <div class="pg">${String(pg).padStart(2, '0')}</div>\n`;

/** tem conteúdo de verdade? zero, vazio e "—" contam como não-preenchido. */
const tem = v => v !== null && v !== undefined && String(v).trim() !== '' && String(v).trim() !== '—'
              && !(typeof v === 'number' && !v) && !(Array.isArray(v) && !v.length);

/** linhas: [rotulo, valor, classe?, cruHtml?]
 *  LINHA SEM VALOR NÃO É IMPRESSA. É a regra da tela: campo em branco no
 *  formulário não vira linha vazia na proposta — some. */
function ficha(linhas) {
  const vivas = linhas.filter(l => tem(l[1]));
  if (!vivas.length) return '';
  return `<table class="ficha">` + vivas.map(l =>
    `<tr><td>${l[3] ? l[0] : rich(l[0])}</td><td${l[2] ? ' class="' + l[2] + '"' : ''}>${rich(l[1])}</td></tr>`).join('') + `</table>`;
}
/** KPI sem número sai da fileira, e os que restam se reacomodam sozinhos no flex. */
function kpis(itens) {
  const vivos = itens.filter(k => tem(k.val));
  if (!vivos.length) return '';
  return `<div class="kpis">` + vivos.map(k =>
    `<div class="kpi on"><div class="lbl">${esc(k.lbl)}</div><div class="val"${k.pequeno ? ' style="font-size:46px"' : ''}>${rich(k.val)}${k.un ? `<small>${esc(k.un)}</small>` : ''}</div>${k.sub ? `<div class="sub">${rich(k.sub)}</div>` : ''}</div>`).join('') + `</div>`;
}
/** bloco que só existe se o texto existir — evita título órfão e caixa vazia */
const se = (cond, html) => cond ? html : '';

// ══════════════════════════════════════════════════════════════════════════
// AS 21 PÁGINAS
// ══════════════════════════════════════════════════════════════════════════
function montar(D) {
  const S = D.solar || {}, P = D.posto || {}, C = D.conjunto || {}, F = D.fotos || {}, T = D.textos || {};
  const p = [];
  const N = () => p.length + 1;

  // ── 01 · CAPA ────────────────────────────────────────────────────────────
  p.push(`<section class="slide amb">
${fundo(F.capa || F.terreno)}${veu('left')}
  <div class="wrap" style="justify-content:center">
    <div style="max-width:1080px">
      <div class="eyebrow">APRESENTAÇÃO DE PROJETO</div>
      <h1 class="title" style="font-size:88px">PROJETO<br><span style="color:#fff">${esc(String(D.cliente || '').toUpperCase())}</span></h1>
      <div style="font-size:30px;font-weight:600;letter-spacing:.14em;margin-top:22px">${esc(D.cidade)}</div>
      <div style="margin-top:38px;font-size:25px;color:var(--muted);line-height:1.55;max-width:920px">
        ${D.temSolar && D.temPosto
          ? `Uma <b class="c-sol">usina solar de ${dec(S.kwp)} kWp</b> no telhado que já é seu, e um
             <b class="c-ele">eletroposto de recarga rápida</b> que vende essa mesma energia para
             quem passa na porta.`
          : D.temSolar
          ? `Uma <b class="c-sol">usina solar de ${dec(S.kwp)} kWp</b> sobre o telhado que já é seu,
             gerando ${num(S.geracao)} kWh por mês de energia própria.`
          : `Um <b class="c-ele">eletroposto de recarga rápida ${esc(P.potenciaTxt)}</b> no pátio que
             já é seu, vendendo energia para quem passa na porta.`}
      </div>
      <div style="margin-top:44px"><span class="selo">${esc(D.validade)}</span></div>
    </div>
  </div>
  <div class="foot">APRESENTAÇÃO COMERCIAL &middot; ${esc(D.data)}</div>
</section>`);

  // ── 02 · O TERRENO HOJE ──────────────────────────────────────────────────
  if (tem(F.terreno) || tem(T.terrenoHoje)) p.push(`<section class="slide amb">
  <div class="bg" style="background-image:url('${esc(F.terreno || F.capa)}');background-position:center 52%;filter:brightness(.88) saturate(1)"></div>
  <div class="scrim bottom" style="background:linear-gradient(180deg,rgba(var(--veu),.26) 0%,rgba(var(--veu),.40) 44%,rgba(var(--veu),.98) 100%)"></div>
${marca('amb', D)}
  <div class="wrap" style="justify-content:flex-end">
    <div class="eyebrow">PONTO DE PARTIDA</div>
    <h2 class="title" style="font-size:54px">${rich(T.terrenoTitulo || 'O seu telhado hoje')}</h2>
    <p class="lead" style="margin-top:20px;max-width:1300px">${rich(T.terrenoHoje)}</p>
  </div>
${rodape('IMAGEM DE SATÉLITE DO LOCAL &middot; BASE DO ESTUDO', N())}</section>`);

  // ── 03 · A TESE ──────────────────────────────────────────────────────────
  if (D.temSolar && D.temPosto) p.push(`<section class="slide amb">
${fundo(F.tese, 'dof')}${veu('dark')}${barra()}${marca('amb', D)}
  <div class="wrap">
    <div class="eyebrow">A TESE DO PROJETO</div>
    <h2 class="title" style="max-width:1500px">O mesmo telhado <span class="c-sol">gera</span> a energia<br>e o mesmo pátio <span class="c-ele">vende</span> ela.</h2>
    <div class="rule"></div>
    <div data-row style="display:flex;gap:26px;margin-top:6px">
      ${se(D.temSolar, `<div class="glass" style="flex:1;border-color:#FFC400">
        <div class="eyebrow" style="margin-bottom:14px;color:#FFC400">O QUE PRODUZ</div>
        <div style="font-size:60px;font-weight:800;line-height:1;color:#FFC400">${num(S.geracao)} <span style="font-size:26px;color:var(--muted);font-weight:600">kWh/mês</span></div>
        <p class="lead" style="font-size:22px;margin-top:18px">${dec(S.kwp)} kWp de módulos sobre o telhado existente. Energia própria, gerada no mesmo endereço onde ela é consumida.</p>
      </div>`)}
      <div class="glass" style="flex:1;border-color:#7CE500">
        <div class="eyebrow" style="margin-bottom:14px;color:#7CE500">O QUE VENDE</div>
        <div style="font-size:60px;font-weight:800;line-height:1;color:#7CE500">${brl2(P.preco)} <span style="font-size:26px;color:var(--muted);font-weight:600">por kWh</span></div>
        <p class="lead" style="font-size:22px;margin-top:18px">Um carregador ${esc(P.potenciaTxt)} revende parte dessa energia para o motorista que precisa carregar, mais a taxa de ativação.</p>
      </div>
    </div>
    <div class="glass tint" style="margin-top:30px;border-color:var(--acc);padding:28px 42px">
      <div data-row style="display:flex;align-items:center;gap:34px">
        <div style="white-space:nowrap">
          <div style="font-size:56px;font-weight:800;color:var(--acc);line-height:1">${brl(C.ganhoMes)}<span style="font-size:24px;color:#fff;font-weight:600">/mês</span></div>
          <div style="font-size:19px;color:var(--muted);font-weight:600;margin-top:8px">é o que os dois juntos põem no caixa</div>
        </div>
        <p class="lead" style="font-size:22px;margin:0">
          <b class="c-sol">${brl(C.ecoLiquida)}</b> de energia que a usina abate da sua conta, mais
          <b class="c-ele">${brl(C.lucroPosto)}</b> de lucro na revenda do posto. <b>Cada kWh alocado
          onde rende mais</b> — ${D._pgConjunto ? `e a página ${D._pgConjunto} abre a conta inteira.` : ''}
        </p>
      </div>
    </div>
  </div>
${rodape('APRESENTAÇÃO COMERCIAL &middot; ' + esc(D.data), N())}</section>`);



  // ── O BALANÇO DE ENERGIA ★ ────────────────────────────────────────────
  // A página que separa esta apresentação de uma planilha: ela MOSTRA que a mesma
  // energia não foi contada duas vezes. Só existe com consumo — sem ele não há o
  // que balancear, e um consumo chutado contaminaria justamente a página que
  // sustenta todo o resto.
  const B = D.balanco;
  if (B) {
    const teto = Math.max(B.demanda, B.geracao, 1);
    const w = v => css(v / teto * 100) + '%';
    p.push(`<section class="slide amb denso">
${fundo(F.balanco, 'dof')}${veu('dark')}${barra()}${marca('amb', D)}
  <div class="wrap">
    <div class="eyebrow">A ENERGIA, ANTES DO DINHEIRO</div>
    <h2 class="title">Quem produz, quem consome</h2>
    <div class="rule" style="background:#fff"></div>
    <div class="bal" style="margin-top:8px">
      <div class="rot">A sua conta de luz hoje</div>
      <div class="tr"><div class="b cinza" style="width:${w(B.consumo)}">consumo atual</div></div>
      <div class="val">${num(B.consumo)}<small>kWh</small></div>

      <div class="rot">O que o carregador vende<small>${esc(B.carrosTxt)}</small></div>
      <div class="tr"><div class="b ele" style="width:${w(B.posto)}">o posto</div></div>
      <div class="val">${num(B.posto)}<small>kWh</small></div>

      <div class="risca"></div>

      <div class="rot"><b>Demanda somada</b></div>
      <div class="tr" style="width:${w(B.demanda)}">
        <div class="b cinza" style="width:${css(B.consumo / Math.max(1, B.demanda) * 100)}%"></div>
        <div class="b ele" style="flex:1"></div>
      </div>
      <div class="val">${num(B.demanda)}<small>kWh</small></div>

      <div class="rot" style="color:#FFC400"><b style="color:#FFC400">A usina de ${dec(S.kwp)} kWp gera</b></div>
      <div class="tr"><div class="b sol" style="width:${w(B.geracao)}">${num(B.geracao)} kWh &mdash; cobre ${num(B.coberturaPct)}% de tudo</div></div>
      <div class="val" style="color:#FFC400">${num(B.geracao)}<small>kWh</small></div>
    </div>
    <div class="glass" style="margin-top:32px;padding:28px 40px">
      <p class="lead" style="font-size:23px;margin:0">
        A usina cobre <b>${num(B.coberturaPct)}% de tudo</b>${B.faltaKwh > 0
          ? ` — a sua conta inteira e a maior parte do que o carregador vende. <b>Faltam
             ${num(B.faltaKwh)} kWh por mês, que vêm da rede</b>, e esse custo já está
             descontado do resultado. Não arredondamos para cima.`
          : ` — a sua conta inteira e tudo o que o carregador vende, com folga.`}
      </p>
    </div>
    <p class="nota" style="margin-top:22px">${rich(B.origem)}</p>
  </div>
${rodape('O BALANÇO DE ENERGIA', N())}</section>`);
  // ── 05 · O LAYOUT DAS PLACAS ─────────────────────────────────────────────
  const aguas = (S.aguas || []).map(a => `<li><b>${num(a.placas)} placas</b> ${esc(a.onde)}</li>`).join('\n          ');
  if (D.temSolar && (tem(S.aguas) || tem(F.layout))) p.push(`<section class="slide sol">
${marca('sol', D)}
  <div class="wrap" style="padding:60px 80px">
    <div data-row style="display:flex;gap:44px;height:100%;align-items:center">
      <div style="width:600px;flex-shrink:0">
        <div class="eyebrow">O LAYOUT SOBRE O SEU TELHADO</div>
        <h2 class="title" style="font-size:48px">${num(S.modulos)} placas já têm<br><span class="g">lugar marcado</span></h2>
        <div class="rule" style="margin:22px 0 28px"></div>
        <ul class="bullets tight">
          ${aguas}
          <li><b>${num(S.modulos)} placas posicionadas</b> — ${dec(S.kwp)} kWp, o que está desenhado em verde</li>
        </ul>
        <div class="glass" style="margin-top:28px;padding:26px 30px">
          <div style="font-size:14px;letter-spacing:.22em;font-weight:700;color:var(--acc);margin-bottom:12px">O ORÇAMENTO É EXATAMENTE ESTE SISTEMA</div>
          <p class="lead" style="font-size:21px;margin:0">As ${num(S.modulos)} placas do orçamento são <b>estas</b> — não é estimativa nem média de mercado. <b>O que está desenhado aqui é o sistema que você está comprando</b> — placa por placa, água por água.</p>
        </div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column">
        <div class="quadro" style="height:820px"><img src="${esc(F.layout || F.terreno)}" alt=""></div>
        ${se(tem(F.layoutLegenda), `<p class="legenda" style="margin-top:16px">${rich(F.layoutLegenda)}</p>`)}
      </div>
    </div>
  </div>
${rodape('PARTE 1 &middot; A USINA', N())}</section>`);

  // ── 06 · O SISTEMA E O QUE ESTÁ NO PREÇO ─────────────────────────────────
  if (D.temSolar) p.push(`<section class="slide sol denso">
${fundo(F.sistema, 'dof')}${veu('dark')}${barra()}${marca('sol', D)}
  <div class="wrap">
    <div class="eyebrow">O SISTEMA E O QUE ESTÁ NO PREÇO</div>
    <h2 class="title">O sistema cotado</h2>
    <div class="rule"></div>
    ${kpis([
      { lbl: 'POTÊNCIA',  val: dec(S.kwp), un: 'kWp', sub: `${num(S.modulos)} módulos de ${num(S.wpModulo)} W` },
      { lbl: 'PRODUÇÃO',  val: num(S.geracao), un: 'kWh/mês', sub: `média anual em ${esc(D.cidadeCurta || D.cidade)}` },
      { lbl: 'AUTONOMIA', val: num(S.autonomiaPct), un: '%', sub: 'do consumo estimado' },
    ])}
    <div data-row style="display:flex;gap:34px;margin-top:38px;align-items:flex-start">
      <div style="flex:1">${ficha([
        ['Módulos fotovoltaicos', `${num(S.modulos)} un · ${num(S.wpModulo)} W`, 'c-sol'],
        ['Inversores', esc(S.inversores), 'c-sol'],
        ['Área ocupada no telhado', `${num(S.areaM2)} m²`],
        ['Tarifa de energia considerada', `${brl2(S.tarifa)} /kWh`],
      ])}</div>
      <div style="flex:1">${ficha((S.incluido || []).map(i => [i, 'INCLUÍDO', 'inc']))}</div>
    </div>
    <p class="nota" style="margin-top:28px">${D._pgInvest ? `<b>Tudo o que aparece nesta página está no valor da página ${D._pgInvest}.</b>` : ''} Equipamento, projeto, instalação, homologação e garantias no mesmo preço fechado.</p>
  </div>
${rodape('PARTE 1 &middot; A USINA', N())}</section>`);

  // ── 07 · A ENGENHARIA ────────────────────────────────────────────────────
  const eng = (T.engenharia || []).map(b => `<li>${rich(b)}</li>`).join('\n          ');
  const vant = (T.vantagens || []).map(v => `<div class="glass plain" style="padding:26px 32px;margin-bottom:18px">
          <div style="font-size:38px;font-weight:800;color:var(--acc);line-height:1">${rich(v.n)} <span style="font-size:22px;color:#fff;font-weight:600">${rich(v.t)}</span></div>
          <p class="lead" style="font-size:20px;margin-top:12px">${rich(v.p)}</p>
        </div>`).join('\n        ');
  if (D.temSolar && tem(T.engenharia)) p.push(`<section class="slide sol">
${fundo(F.engenharia, 'dof')}${veu('dark')}${barra()}${marca('sol', D)}
  <div class="wrap">
    <div class="eyebrow">ENGENHARIA E MONTAGEM</div>
    <h2 class="title" style="font-size:52px">A engenharia já esteve <span class="g">no seu telhado</span></h2>
    <div class="rule"></div>
    <div data-row style="display:flex;gap:44px;align-items:flex-start">
      <div style="flex:1"><ul class="bullets tight">
          ${eng}
        </ul></div>
      <div style="width:660px;flex-shrink:0">
        ${vant}
      </div>
    </div>
  </div>
${rodape('PARTE 1 &middot; A USINA', N())}</section>`);

  }




  // ── O PONTO E A ENTRADA DE ENERGIA ★ ──────────────────────────────────
  // A página que prova que alguém foi olhar antes de vir: leitura do endereço à
  // esquerda, e à direita o que a entrada de energia precisa virar, com as fotos
  // do padrão DO CLIENTE. É ela que transforma o transformador de custo em ativo.
  const EN = D.entrada;
  if (EN || tem(T.pontoCards)) {
    const fotosPadrao = (F.padrao || []).slice(0, 3);
    p.push(`<section class="slide ele denso ponto">
${fundo(F.ponto || F.terreno, 'dof')}${veu('dark')}${barra()}${marca('ele', D)}
  <div class="wrap">
    <div class="eyebrow">O PONTO</div>
    <h2 class="title">${rich(T.pontoTitulo || 'Por que este endereço')}</h2>
    <div class="rule"></div>
    <div data-row style="display:flex;gap:44px;align-items:flex-start;margin-top:4px">
      <div style="flex:1">
        ${se(tem(T.pontoCards), `<ul class="bullets tight">${(T.pontoCards || []).map(c => `<li>${rich(c)}</li>`).join('')}</ul>`)}
        ${se(tem(T.pontoFecho), `<p class="nota" style="margin-top:22px">${rich(T.pontoFecho)}</p>`)}
      </div>
      ${se(!!EN, `<div class="glass" style="width:760px;flex-shrink:0;padding:30px 34px">
        <div class="eyebrow" style="margin-bottom:12px">O QUE VI NO SEU PADRÃO</div>
        ${se(fotosPadrao.length > 0, `<div class="tira" style="grid-template-columns:repeat(${fotosPadrao.length},1fr);gap:12px;margin-bottom:14px">
          ${fotosPadrao.map(x => `<figure><img src="${esc(x)}" alt="" style="height:120px"></figure>`).join('')}
        </div>`)}
        ${ficha([
          ['Entrada hoje', EN && EN.correnteHoje],

          <div style="font-size:76px;font-weight:800;line-height:1">${brl(C.investTotal)}<span style="font-size:30px;color:var(--muted);font-weight:600">,00</span></div>
        </div>
        <div style="flex:1;border-left:3px solid rgba(255,255,255,.22);padding-left:44px">
          <div style="font-size:16px;letter-spacing:.26em;font-weight:700;color:#7CE500;margin-bottom:12px">E DEVOLVE POR MÊS</div>
          <div style="font-size:60px;font-weight:800;line-height:1;color:#7CE500">${brl(C.ganhoMes)}</div>
          <div style="font-size:21px;color:var(--muted);font-weight:600;margin-top:10px">o conjunto se paga em <b style="color:#fff">${esc(C.paybackTxt)}</b></div>
        </div>
      </div>
    </div>
    <div data-row style="display:flex;gap:34px;margin-top:30px;align-items:center">
      <div class="glass plain" style="flex:1;padding:28px 34px">
        <div class="eyebrow" style="margin-bottom:12px">FORMA DE PAGAMENTO</div>
        ${se(tem(T.pagamento), `<p class="lead" style="font-size:21px;margin:0">${rich(T.pagamento)}</p>`)}
      </div>
      <div style="width:520px;text-align:center">
        <span class="selo" style="border-color:#FFC400;color:#FFC400;font-size:19px">${esc(D.validade)}</span>
        ${se(tem(T.notaValidade), `<p class="nota" style="margin-top:18px;font-size:18px">${rich(T.notaValidade)}</p>`)}
      </div>
    </div>
  </div>
${rodape('PROPOSTA COMERCIAL &middot; ' + esc(D.data), N())}</section>`);

  // ── 21 · CRONOGRAMA ──────────────────────────────────────────────────────
  const cr = D.cronograma || {};
  const etapas = (cr.etapas || []).map((e, i) =>
    `<div class="et${e.forte ? ' forte' : ''}"><div class="dia">DIA ${num(e.dia)}</div><div class="n">${i + 1}</div>
        <h5>${rich(e.titulo)}</h5><div class="dur">${num(e.dur)}<small>${esc(e.un)}</small></div></div>`).join('\n      ');
  if (D.cronograma && tem(D.cronograma.etapas)) p.push(`<section class="slide amb denso cronograma">
${fundo(F.cronograma, 'dof')}${veu('dark')}${barra()}${marca('amb', D)}
  <div class="wrap">
    <div class="eyebrow">CRONOGRAMA</div>
    <h2 class="title">Do contrato à <span class="c-ele">primeira recarga</span></h2>
    <div class="rule" style="background:#fff"></div>
    <div class="trilho"></div>
    <div class="crono" data-row>
      ${etapas}
    </div>
    <div data-row style="display:flex;gap:34px;margin-top:34px;align-items:center">
      <div class="glass" style="width:500px;padding:28px 36px;border-color:#7CE500">
        <div style="font-size:62px;font-weight:800;line-height:1;color:#7CE500">${num(cr.totalDias)} <span style="font-size:26px;color:#fff;font-weight:600">dias</span></div>
        <div style="font-size:20px;color:var(--muted);font-weight:600;margin-top:8px">do contrato à primeira recarga vendida</div>
      </div>
      <div style="flex:1"><p class="lead" style="font-size:22px;margin:0">${rich(cr.nota)}</p></div>
    </div>
    <div class="contato-crono" style="margin-top:28px;display:flex;align-items:center;gap:40px">
      <div>
        <div style="font-size:15px;letter-spacing:.30em;color:rgba(255,255,255,.55);font-weight:600">FALE COM</div>
        <div style="font-size:38px;font-weight:800;margin-top:6px">${esc(D.vendedor)}</div>
        <div style="font-size:27px;font-weight:600;color:#FFC400;margin-top:4px">${esc(D.contato)}</div>
      </div>
      <div style="flex:1;border-left:3px solid rgba(255,255,255,.2);padding-left:40px">
        ${se(tem(T.fechamento), `<p class="lead" style="font-size:22px;margin:0">${rich(T.fechamento)}</p>`)}
      </div>
    </div>
  </div>
${rodape('PROPOSTA COMERCIAL &middot; ' + esc(D.data), N())}</section>`);

  return p.join('\n');
}

// ── boot ───────────────────────────────────────────────────────────────────
(function () {
  const D = carregarDados();
  if (!D) { document.getElementById('deck').innerHTML = '<div style="color:#fff;padding:60px;font:16px sans-serif">Sem dados: injete window.__DECK ou passe ?d=&lt;base64&gt;.</div>'; return; }
  // as referências cruzadas precisam do número final da página; monta duas vezes,
  // a primeira só para descobrir onde caíram o consolidado e o investimento
  montar(D);
  document.getElementById('deck').innerHTML = montar(D);
  window.__DECK_PRONTO = true;
})();
</script>
</body>
