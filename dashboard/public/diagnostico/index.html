.coluna-ad li svg{flex:none;width:16px;height:16px;margin-top:3px;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.coluna-ad.hoje li svg{stroke:var(--falta)}
.coluna-ad.sd li svg{stroke:var(--tem)}
.passos3{list-style:none;margin:10px 0;padding:0;display:grid;gap:10px;counter-reset:p}
.passos3 li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start;counter-increment:p}
.passos3 li::before{content:counter(p);width:32px;height:32px;border-radius:50%;background:var(--acao);color:var(--sobre-acao);display:grid;place-items:center;font-weight:800}
.passos3 b{display:block}
.passos3 span{color:var(--mudo);font-size:.92rem}
.logos{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.logos img{height:34px;width:auto;max-width:96px;object-fit:contain;border-radius:6px;background:var(--logo-fundo);padding:4px 6px;border:1px solid var(--borda)}
.faixa-conc{background:var(--faixa);color:var(--sobre-faixa);border-radius:14px;padding:14px 16px;margin:16px 0}
.faixa-conc p{margin:0 0 10px;font-weight:700}
.faixa-conc .logos img{background:transparent;border:0;padding:0;height:24px;filter:brightness(0) invert(1)}
.qf{margin:4px 0 10px;font-size:1.05rem}
.fundadores{display:flex;gap:16px;margin:10px 0}
.fundadores figure{margin:0;text-align:center;font-size:.8rem;color:var(--mudo)}
.fundadores img{display:block;width:72px;height:72px;border-radius:50%;object-fit:cover;margin:0 auto 6px;border:2px solid var(--acao)}
.fundadores b{display:block;font-size:.9rem;color:var(--texto)}
/* Consertos da prova no navegador */
.uf-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.op.uf{min-height:48px;align-items:center}
.op.uf b{font-size:1.1rem}
.op.uf small{display:none}
.op[aria-disabled="true"]{opacity:.45}
.esteira-in{padding-right:10px}
.carr-bt{width:44px;height:44px}
.item .ver-bt{min-height:44px}
details.faq summary{padding-block:12px;gap:12px;list-style:none}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"+";margin-left:auto;font-weight:800;font-size:1.25rem;line-height:1;color:var(--acao)}
details.faq[open] summary::after{content:"\2212"}
/* Logo do cliente em cada depoimento */
.dep-cap{display:flex;align-items:center;gap:10px}
.carr-slide .dep-cap img{flex:none;width:48px;height:48px;object-fit:contain;border-radius:10px;background:var(--logo-fundo);border:1px solid var(--borda);padding:5px}
.dep-cap>span{min-width:0}
/* Componentes da landing: botão em degradê com brilho, rótulo em pílula, título com fecho em degradê, faixas alternadas */
.titulo{letter-spacing:-.02em}
.grad{background:var(--acao-grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.cta{background:var(--acao-grad);border:0;border-radius:16px;box-shadow:0 16px 44px var(--acao-sombra),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .15s,box-shadow .15s}
.cta:hover{background:var(--acao-grad);transform:translateY(-2px);box-shadow:0 24px 56px var(--acao-sombra)}
.cta:disabled{transform:none;box-shadow:none}
.bt.prim{background:var(--acao-grad);border:0;color:var(--sobre-acao)}
.bt.prim:hover{background:var(--acao-grad)}
.corpo .rotulo{display:inline-block;padding:5px 12px;border-radius:999px;background:var(--acao-suave);border:1px solid var(--acao-borda);color:var(--marca);letter-spacing:.16em}
.linha-topo .rotulo{color:var(--marca)}
.dia .rotulo{padding:0;background:none;border:0;border-radius:0}
.marca-topo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.02rem;letter-spacing:-.015em;color:var(--texto);margin-bottom:10px}
.marca-topo img{display:block;width:26px;height:26px;border-radius:7px}
.marca-topo b{color:var(--marca);font-weight:800}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--marca);background:var(--acao-suave);border:1px solid var(--acao-borda);margin-top:4px}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--marca);animation:pulsa 1.6s ease-in-out infinite}
@keyframes pulsa{50%{opacity:.35}}
.cartao .big,.oferta .preco{background:var(--acao-grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.oferta{border:2px solid var(--marca);background:var(--faixa);box-shadow:0 30px 60px var(--acao-suave)}
.banda{margin:22px -20px;padding:20px;background:var(--faixa);border-block:1px solid var(--borda)}
.fp{background:var(--papel);color:var(--sobre-papel);border-color:var(--papel-borda)}
.fp-faixa{background:var(--sobre-papel);color:var(--papel);border-bottom:4px solid var(--acao-claro)}
.fp-nums div{border-color:var(--papel-borda)}
.fp .nota{color:var(--papel-mudo)}
.fp .chip{background:var(--papel);color:var(--papel-mudo);border-color:var(--papel-borda)}
.fp .sv-eixo{stroke:var(--papel-borda)}
.rodape-marca{margin:26px 0 6px;padding-top:14px;border-top:1px solid var(--borda);font-size:.8rem;color:var(--mudo);text-align:center}
.rodape-marca b{color:var(--texto)}
.rodape-marca b span{color:var(--marca)}
.folha-in{background:var(--faixa)}
.campo::placeholder{color:var(--mudo);opacity:.75}
/* Ajustes da checagem visual da marca */
.corpo .rotulo{background:var(--pilula-fundo);border-radius:14px;letter-spacing:.12em;line-height:1.35}
.eyebrow{background:var(--pilula-fundo);border-radius:14px;letter-spacing:.1em;line-height:1.35}
.dia .rotulo{background:none;border-radius:0}
.cartao.num{display:block}
.cartao.num .big{display:block;margin-bottom:6px;min-width:0}
.cta:disabled{opacity:1;background:var(--desab-fundo);color:var(--desab-texto);box-shadow:none}
.carr.quadrado .carr-slide img{aspect-ratio:1/1}
.carr:not(.quadrado) .carr-slide img{aspect-ratio:975/1550}
/* Barra inteligente: uma barra só, em degradê, com o marco e a porcentagem ao lado */
.barra{display:block;height:6px;border-radius:3px;background:var(--trilho);overflow:hidden}
.barra i{display:block;height:100%;width:var(--w,0%);background:var(--acao-grad);border-radius:3px;transition:width .5s ease-out}
.linha-topo{flex-wrap:wrap}
.linha-topo .pct{margin-left:auto;font-size:.72rem;font-weight:800;letter-spacing:.02em;color:var(--acao-claro);white-space:nowrap}
/* Página de verdade: a tela inteira no celular, uma coluna central de até 480 px no computador */
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;overflow:hidden}
.app{position:relative;display:flex;flex-direction:column;width:100%;max-width:480px;height:100vh;height:100dvh;margin:0 auto;background:var(--tela);overflow:hidden}
@media(min-width:520px){.app{box-shadow:0 0 0 1px var(--borda),0 24px 60px var(--sombra)}}
.topo{padding-top:max(14px,env(safe-area-inset-top,0px))}
.nota a{color:var(--texto);text-underline-offset:3px}
.msg{font-size:.9rem}
.folha-in .cta+.pular{margin-top:6px}
/* O PNG da Enel tem 94% de margem transparente: sobe a altura e puxa a margem para a marca ficar do tamanho das outras */
.faixa-conc .logos img[src$="/enel.png"]{height:64px;margin:-20px -18px}
</style>

<script id="calc-puro">
'use strict';
/* Dados e contas puras. Nenhum acesso ao DOM. */
const o = (id, r, v, p) => ({ id, r, v, p });
const pt = (id, r, p) => ({ id, r, p });
const BLOCOS = ['Seu perfil', 'Seus desafios', 'Seus objetivos', 'Sua proposta hoje', 'Seu plano'];
const Q = (n, id, bl, t, x) => Object.assign({ tipo: 'q', n, id, bl, t, kind: 'single', aj: '', ops: [] }, x);
const ABRE4 = 'Responda pensando na proposta que você manda hoje.';

const UFS = [['AC', 'Acre'], ['AL', 'Alagoas'], ['AP', 'Amapá'], ['AM', 'Amazonas'], ['BA', 'Bahia'], ['CE', 'Ceará'], ['DF', 'Distrito Federal'], ['ES', 'Espírito Santo'], ['GO', 'Goiás'], ['MA', 'Maranhão'], ['MT', 'Mato Grosso'], ['MS', 'Mato Grosso do Sul'], ['MG', 'Minas Gerais'], ['PA', 'Pará'], ['PB', 'Paraíba'], ['PR', 'Paraná'], ['PE', 'Pernambuco'], ['PI', 'Piauí'], ['RJ', 'Rio de Janeiro'], ['RN', 'Rio Grande do Norte'], ['RS', 'Rio Grande do Sul'], ['RO', 'Rondônia'], ['RR', 'Roraima'], ['SC', 'Santa Catarina'], ['SP', 'São Paulo'], ['SE', 'Sergipe'], ['TO', 'Tocantins']];
const PASSOS = [
  { tipo: 'capa', bl: 0 },
  Q(1, 'papel', 1, 'Qual é o seu papel na venda de energia solar?', { aj: 'Assim o diagnóstico usa a sua realidade.', ops: [o('dono', 'Sou dono de integradora'), o('vendedor', 'Sou vendedor ou representante'), o('engenheiro', 'Sou engenheiro ou projetista e vendo'), o('comecando', 'Estou começando no solar')] }),
  Q(2, 'empresa', 1, 'Como se chama a sua empresa?', { kind: 'text', aj: 'Vamos montar uma prévia da sua proposta com esse nome.', ex: 'Sol do Cerrado Energia', pular: 'Ainda não tem nome? Pular' }),
  Q(3, 'cnpj', 1, 'A sua empresa tem CNPJ?', { aj: 'O SolarDoc gera os documentos em nome da empresa.', ops: [o('sim', 'Sim'), o('empregador', 'Uso o CNPJ da empresa onde trabalho'), o('abrindo', 'Estou abrindo'), o('nao', 'Não tenho')] }),
  Q(4, 'uf', 1, 'Em que estado fica a sua empresa?', { kind: 'uf', aj: 'Depois você escolhe a cidade.', ops: UFS.map(([id, nome]) => o(id, nome)) }),
  Q(5, 'cidade', 1, 'Qual é a sua cidade?', { kind: 'city', aj: 'Toque na sua cidade. Se preferir, digite para achar.', ex: 'Digite para achar' }),
  Q(5, 'clientes', 1, 'Para quem você mais vende?', { kind: 'multi', aj: 'Pode marcar mais de uma.', ops: [o('casas', 'Casas'), o('comercio', 'Comércio e empresas'), o('rural', 'Propriedades rurais'), o('investidor', 'Investidores e usinas')] }),
  Q(6, 'propostas_mes', 1, 'Quantas propostas você faz por mês?', { aj: 'Conte todas, até as que não fecharam.', ops: [o('ate5', 'Até 5', 3), o('6a15', 'De 6 a 15', 10), o('16a30', 'De 16 a 30', 23), o('mais30', 'Mais de 30', 40)] }),
  Q(7, 'vendas_mes', 1, 'Quantas dessas viram venda por mês?', { ops: [o('v0', 'Nenhuma ainda', 0), o('v1a2', '1 ou 2', 1.5), o('v3a5', 'De 3 a 5', 4), o('v6a10', 'De 6 a 10', 8), o('mais10', 'Mais de 10', 12)] }),
  Q(8, 'ticket', 1, 'Quanto vale, em média, um sistema que você vende?', { ops: [o('ate15', 'Até R$ 15 mil', 12000), o('15a30', 'De R$ 15 mil a R$ 30 mil', 22000), o('30a60', 'De R$ 30 mil a R$ 60 mil', 45000), o('mais60', 'Mais de R$ 60 mil', 80000)] }),
  { tipo: 'i1', bl: 1 },
  Q(9, 'como_faz_hoje', 2, 'Como você monta suas propostas hoje?', { ops: [o('word', 'No Word ou no PowerPoint'), o('planilha', 'Numa planilha'), o('canva', 'No Canva'), o('plataforma', 'Numa plataforma ou CRM pago'), o('distribuidor', 'Na ferramenta do distribuidor'), o('whatsapp', 'Mando os valores direto no WhatsApp')] }),
  Q(10, 'gasto_ferramenta', 2, 'Quanto você gasta por mês com ferramenta para fazer proposta?', { ops: [o('nada', 'Nada', 0), o('ate67', 'Até R$ 67', 0), o('g68a150', 'De R$ 68 a R$ 150', 68), o('g151a300', 'De R$ 151 a R$ 300', 151), o('mais300', 'Mais de R$ 300', 301)] }),

  { tipo: 'e1', bl: 2 },

  Q(16, 'erro_proposta', 2, 'Já saiu proposta com erro de valor, de nome ou de formatação?', { pil: 'Imagem', ops: [pt('caro', 'Sim, e me custou caro', 0), pt('atempo', 'Sim, mas percebi a tempo', 3), pt('quase', 'Quase', 5), pt('nunca', 'Nunca', 8)] }),
  Q(17, 'papelada', 2, 'E a papelada depois do sim, como contrato, procuração e recibo?', { pil: 'Papelada', ops: [pt('luta', 'Dá muito trabalho', 0), pt('viro', 'Dá trabalho, mas eu me viro', 5), pt('modelo', 'É tranquilo, tenho modelo pronto', 12), pt('outro', 'Outra pessoa cuida disso', 8)] }),

  Q(19, 'tempo_livre', 3, 'Se você ganhasse tempo na semana, o que faria com ele?', { ops: [o('visitas', 'Faria mais visitas'), o('posvenda', 'Cuidaria de quem já comprou'), o('familia', 'Ficaria mais com a família'), o('cidade_nova', 'Abriria uma cidade nova')] }),
  Q(20, 'imagem', 3, 'Como você quer que o cliente veja a sua empresa?', { ops: [o('profissional', 'A mais profissional da região'), o('rapida', 'A que responde mais rápido'), o('clara', 'A que explica tudo com clareza'), o('confiavel', 'A que entrega o que promete')] }),
  Q(21, 'fechar_primeira', 3, 'O que ajudaria você a fechar já na primeira reunião?', { kind: 'multi', max: 3, aj: 'Marque até 3.', ops: [o('nahora', 'Proposta pronta na hora, no celular'), o('retorno', 'Gráfico de economia e retorno'), o('parcelas', 'Parcelas do financiamento na proposta'), o('bateria', 'Opção com bateria na mesma proposta'), o('contrato', 'Contrato pronto para assinar'), o('marca', 'Proposta com a minha marca')] }),
  Q(22, 'prioridade', 3, 'Numa ferramenta de proposta, o que pesa mais para você?', { ops: [o('rapidez', 'Rapidez'), o('visual', 'Visual bonito'), o('conta', 'Conta certa'), o('preco', 'Preço justo'), o('suporte', 'Suporte no WhatsApp')] }),
  Q(23, 'frase', 3, 'Você se identifica com esta frase?', { destaque: 'Eu perco venda por demora e por proposta que não convence.', ops: [o('muito', 'Muito'), o('pouco', 'Um pouco'), o('nao', 'Não')] }),
  { tipo: 'i3', bl: 3 },
  Q(24, 'tem_marca', 4, 'A sua proposta sai com a sua logo e as cores da empresa?', { pil: 'Imagem', ab: ABRE4, ops: [pt('sim', 'Sim', 9), pt('asvezes', 'Às vezes', 4), pt('nao', 'Não', 0)] }),
  Q(25, 'mostra_economia', 4, 'Ela mostra a economia mês a mês e em quanto tempo o sistema se paga?', { pil: 'Clareza', ab: ABRE4, ops: [pt('sim', 'Sim, as duas coisas', 7), pt('so_total', 'Só o valor total', 3), pt('nao', 'Não', 0)] }),
  Q(26, 'economia_25', 4, 'Ela mostra quanto o cliente economiza em 25 anos?', { pil: 'Clareza', ab: ABRE4, ops: [pt('sim', 'Sim', 5), pt('nao', 'Não', 0), pt('naosei', 'Não sei', 0)] }),

  { tipo: 'e2', bl: 4 },
  Q(28, 'usa_conta', 4, 'Como os dados da conta de luz entram na proposta?', { pil: 'Velocidade', ab: ABRE4, ops: [pt('foto', 'Por foto ou leitura automática', 4), pt('digito', 'Eu digito tudo', 2), pt('nao', 'Não uso a conta', 0)] }),
  Q(29, 'contrato_pronto', 4, 'Você leva o contrato pronto para assinar na primeira reunião?', { pil: 'Papelada', ab: ABRE4, ops: [pt('sim', 'Sim', 13), pt('depois', 'Só mando depois', 5), pt('nao', 'Não uso contrato', 0)] }),
  Q(30, 'modelos', 4, 'Você tem um modelo de proposta para cada tipo de cliente?', { pil: 'Imagem', aj: 'Por exemplo: casa, comércio e banco.', ab: ABRE4, ops: [pt('sim', 'Sim', 8), pt('mesmo', 'Uso o mesmo para todos', 3), pt('nao', 'Não tenho modelo', 0)] }),
  Q(31, 'followup', 4, 'Depois de mandar a proposta, você chama o cliente de novo?', { ab: ABRE4, ops: [o('rotina', 'Sim, tenho uma rotina'), o('lembro', 'Quando eu lembro'), o('nao', 'Não chamo')] }),
  { tipo: 'load', bl: 0 },
  { tipo: 'res', bl: 0 },
  Q(32, 'documentos', 5, 'Quais documentos você quer prontos desde o primeiro dia?', { kind: 'multi', aj: 'Marque quantos quiser.', pre: ['proposta'], ops: [o('proposta', 'Proposta solar'), o('contrato', 'Contrato de compra e venda'), o('procuracao', 'Procuração'), o('recibo', 'Recibo'), o('banco', 'Proposta de banco'), o('servico', 'Contrato de prestação de serviço'), o('vendedor', 'Contrato de vendedor'), o('vistoria', 'Vistoria')] }),
  Q(33, 'modelo', 5, 'Qual estilo de proposta combina com o seu cliente?', { ops: [o('direta', 'Direta, em poucas páginas'), o('completa', 'Completa, com economia de 25 anos e geração mês a mês'), o('ver', 'Quero ver os modelos antes')] }),
  Q(34, 'logo', 5, 'Você já tem a logo da empresa em arquivo?', { ops: [o('sim', 'Sim'), o('achar', 'Tenho, mas preciso achar'), o('nao', 'Ainda não tenho')] }),
  Q(35, 'decisor', 5, 'Quem decide a compra de uma ferramenta na sua empresa?', { ops: [o('eu', 'Eu'), o('socio', 'Eu e meu sócio'), o('chefe', 'Meu chefe')] }),
  Q(36, 'objecao', 5, 'O que poderia te impedir de começar hoje?', { ops: [o('preco', 'O preço'), o('ja_uso', 'Já uso outra ferramenta'), o('aprender', 'Medo de perder tempo aprendendo'), o('validade', 'Dúvida se os documentos têm validade'), o('online', 'Receio de pagar pela internet'), o('nada', 'Nada, quero começar')] }),
  Q(37, 'pagamento', 5, 'Como você prefere pagar?', { cond: (R) => R.cnpj === 'sim' || R.cnpj === 'empregador', ops: [o('cartao', 'Cartão de crédito'), o('pix', 'Pix')] }),
  Q(38, 'quando_comecar', 5, 'Quando você quer mandar a primeira proposta pelo SolarDoc?', { ops: [o('hoje', 'Hoje'), o('semana', 'Esta semana'), o('mes', 'Este mês'), o('pesquisando', 'Só estou pesquisando')] }),
  { tipo: 'g1', bl: 0 },
  { tipo: 'g2', bl: 0 },
  { tipo: 'plano', bl: 0 }
];
const POR_ID = {};
let QN = 0;
PASSOS.forEach((s, i) => { if (s.tipo === 'q') { s.n = ++QN; POR_ID[s.id] = s; } });
const PILARES = [['Velocidade', ['tempo_por_proposta', 'demora_envio', 'usa_conta', 'quando_monta']], ['Clareza', ['cliente_entende', 'mostra_economia', 'economia_25', 'financiamento']], ['Imagem', ['tem_marca', 'erro_proposta', 'modelos']], ['Papelada', ['papelada', 'contrato_pronto']]];
const TIPICO = 9, TOPO = 41; /* só propostas solares por usuário ativo, 30 dias até 23/10/2026 */

const br = (n) => String(Math.round(n * 100) / 100).replace('.', ',');

const opc = (id, v) => { const q = POR_ID[id]; return q ? q.ops.find((x) => x.id === v) : undefined; };
const valor = (R, id) => { const x = opc(id, R[id]); return x ? x.v : undefined; };
const rot = (R, id) => { const x = opc(id, R[id]); return x ? x.r : ''; };
const pontos = (R, id) => { const x = opc(id, R[id]); return x && typeof x.p === 'number' ? x.p : 0; };
const visivel = (s, R) => !s.cond || s.cond(R);
const proximo = (i, R) => { let j = i + 1; while (j < PASSOS.length && !visivel(PASSOS[j], R)) j++; return j; };
const qtdBloco = (b, R) => PASSOS.filter((s) => s.tipo === 'q' && s.bl === b && visivel(s, R)).length;
const posBloco = (i, R) => PASSOS.filter((s, j) => j < i && s.tipo === 'q' && s.bl === PASSOS[i].bl && visivel(s, R)).length;
/* Barra inteligente: rápida no começo e mais lenta no fim (curva r^0,65), sempre subindo, 100% só no plano */
const CURVA = 0.65;
function progresso(i, R) {
  const s = PASSOS[i];
  if (s.tipo === 'capa' || s.tipo === 'load') return null;
  const vis = PASSOS.map((p, j) => j).filter((j) => visivel(PASSOS[j], R));
  const r = Math.max(0, Math.min(1, vis.indexOf(i) / (vis.length - 1)));
  return Math.pow(r, CURVA);
}

  if (R.perdeu_venda === 'varias' || R.perdeu_venda === 'algumas') L.push({ n: '', t: 'Você já perdeu venda para quem chegou antes.', s: 'Chegar antes depende de velocidade na proposta.' });

}

    const v = raw[s.id];
    if (s.kind === 'text') { if (typeof v === 'string') o[s.id] = v.slice(0, 60); }
    else if (s.kind === 'city') { if (typeof v === 'string' && /^.{1,100}-[A-Z]{2}$/.test(v)) o.cidade = v; }
    else if (s.kind === 'multi') { if (Array.isArray(v)) o[s.id] = v.filter((x) => s.ops.some((y) => y.id === x)).slice(0, s.max || 99); }
    else if (typeof v === 'string' && s.ops.some((y) => y.id === v)) o[s.id] = v;
  });
  if (typeof raw.nome === 'string') o.nome = raw.nome.slice(0, 60);
  if (typeof raw.whats === 'string' && /^\d{0,11}$/.test(raw.whats)) o.whats = raw.whats;
  return o;
}
function carregarEstado() {
  const cru = lerLS(LS_KEY);
  if (!cru) return;
  try {
    const d = JSON.parse(cru);
    if (!d || d.v !== 1 || typeof d.t !== 'number' || Date.now() - d.t > VALIDADE || typeof d.i !== 'string' || !(d.i in IDX) || d.i === 'capa') return;
    R = limparR(d.R);
    const e = d.E && typeof d.E === 'object' ? d.E : {};
    E = {
      codigo: /^SD-[A-Z0-9]{4,6}$/.test(e.codigo || '') ? e.codigo : '', eventId: /^sd_[\w-]{8,60}$/.test(e.eventId || '') ? e.eventId : '',
      sig: typeof e.sig === 'string' ? e.sig.slice(0, 4000) : '', ok: e.ok === true, blocos: e.blocos && typeof e.blocos === 'object' ? e.blocos : {}, fez: e.fez && typeof e.fez === 'object' ? e.fez : {}
    };
    S.hist = (Array.isArray(d.hist) ? d.hist : []).filter((k) => typeof k === 'string' && k in IDX).map((k) => IDX[k]);
    S.i = IDX[d.i];
    if (S.i === IDX.load) S.i = IDX.res;
    if (S.i === IDX.plano && !E.codigo) S.i = IDX.g2;
    if (!visivel(PASSOS[S.i], R)) S.i = proximo(S.i, R);
  } catch (err) { /* estado ilegível: começa da capa */ }
}

/* Portão: manda o lead para a API. Se ela falhar, a pessoa vê o plano do mesmo jeito. */
function respostasParaApi() {
  const out = {};
  PASSOS.forEach((s) => {
    if (s.tipo !== 'q' || !visivel(s, R) || !s.ops.length || s.id === 'uf') return;
    const v = R[s.id];
    if (v === undefined || v === '' || (Array.isArray(v) && !v.length)) return;
    out[s.id] = v;
  });
  return out;
}
async function chamar(caminho, corpo, ms) {
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const t = setTimeout(() => { if (ctl) ctl.abort(); }, ms);
  try {
    const r = await fetch(SDR.api + caminho, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo), signal: ctl ? ctl.signal : undefined });
    let j = null;
    try { j = await r.json(); } catch (e) { j = null; }
    return { ok: r.ok, status: r.status, json: j };
  } finally { clearTimeout(t); }
}
async function enviarLead() {
  if (S.enviando) return;
  S.enviando = true;
  const b = $('btn-cont');
  if (b) { b.disabled = true; b.textContent = 'Montando o seu plano'; }
  const resp = respostasParaApi();
  const sig = JSON.stringify([resp, R.nome, R.whats, R.empresa, R.uf, R.cidade]);
  if (!E.eventId) E.eventId = SDR.novoId();
  if (!(E.ok && E.codigo && E.sig === sig)) {
    let cod = '';
    try {
      const m = SDR.meta();
      const r = await chamar('/solardoc/quiz', { nome: (R.nome || '').trim(), whatsapp: R.whats, empresa: (R.empresa || '').trim(), uf: R.uf || '', cidade: R.cidade || '', respostas: resp, utm: SDR.utm(), fbp: m.fbp || '', fbc: m.fbc || '', lp_session: SDR.sid, event_id: E.eventId, url: location.href }, 8000);
      if (r.ok && r.json && r.json.ok && /^SD-[A-Z0-9]{4,6}$/.test(r.json.codigo || '')) cod = r.json.codigo;
      else erro('whatsapp', 'api_' + r.status);
    } catch (err) { erro('whatsapp', 'api_falhou'); }
    E.ok = !!cod; E.codigo = cod || E.codigo || SDR.codigoLocal(); E.sig = sig;
  }
  /* Deixar o WhatsApp não é ir assinar: o destino 'plano' só vira cartao, pix etc. no toque do botão final */
  S.fimK = 'plano';
  SDR.evento('quiz_fim', { destino: 'plano' });
  if (!E.fez.lead) { E.fez.lead = 1; fb('track', 'Lead', { content_name: 'diagnostico_solardoc' }, { eventID: E.eventId }); }
  S.enviando = false;
  avancar();
}

/* Botões do plano */
async function assinarCartao() {
  if (S.pagando) return;
  S.pagando = true;
  fb('track', 'InitiateCheckout', { content_name: 'vip', value: 67, currency: 'BRL' });
  document.querySelectorAll('[data-a="btn"][data-k="cartao"]').forEach((b) => { b.disabled = true; b.textContent = 'Abrindo o pagamento'; });
  const corpo = Object.assign({ plan: 'vip' }, SDR.utm(), { lp_session: SDR.sid }, SDR.meta(), { origem: 'quiz_solardoc' });
  try {
    const r = await chamar('/payments/public-checkout', corpo, 20000);
    if (r.ok && r.json && r.json.url) {
      SDR.marcarSaida(r.json.cancelUrl);
      window.location.href = r.json.url;
      return;
    }
    erro('plano', 'checkout_' + r.status);
  } catch (err) { erro('plano', 'checkout_falhou'); }
  const qs = new URLSearchParams({ mode: 'register', plano: 'vip' });
  const u = SDR.utm();
  SDR.utmKeys.forEach((k) => { if (u[k]) qs.set(k, u[k]); });
  window.location.href = '/auth?' + qs.toString();
}
function acaoFinal(k, el) {
  if (k !== S.fimK) { S.fimK = k; SDR.evento('quiz_fim', { destino: k }); }
  if (k === 'cartao') { assinarCartao(); return; }
  if (k === 'socio') { abrirFolha('socio', el); return; }
  if (!E.codigo) E.codigo = SDR.codigoLocal();
  const url = 'https://wa.me/' + WHATS + '?text=' + encodeURIComponent(MSG[k](E.codigo));
  const w = window.open(url, '_blank');
  if (w) { try { w.opener = null; } catch (err) { /* sem acesso */ } } else window.location.href = url;
}
$('app').addEventListener('click', (e) => {
  if (e.target === $('folha')) { fecharFolha(); return; }
  const t = e.target.closest('[data-a]');
  if (!t) return;
  const a = t.getAttribute('data-a');
  if (a === 'op') escolher(t.getAttribute('data-q'), t.getAttribute('data-o'));
  else if (a === 'cont') continuar();
  else if (a === 'voltar') voltar();
  else if (a === 'pular') { R.empresa = ''; avancar(); }
  else if (a === 'cid') { if (S.lock) return; R.cidade = t.getAttribute('data-o'); document.querySelectorAll('[data-a="cid"]').forEach((b) => b.setAttribute('aria-checked', String(b === t))); S.lock = true; S.timers.push(setTimeout(avancar, 250)); }
  else if (a === 'ver') abrirVer(t.getAttribute('data-k'), t);
  else if (a === 'carr') { const cr = t.closest('.carr'); carrIr(cr, carrIdx(cr.querySelector('.carr-trilho')) + Number(t.getAttribute('data-d'))); }
  else if (a === 'btn') acaoFinal(t.getAttribute('data-k'), t);
  else if (a === 'copiar') copiar(resumo(R));
  else if (a === 'fechar') fecharFolha();
});
$('corpo').addEventListener('input', (e) => {
  const id = e.target.id, v = e.target.value;
  if (id === 'campo-empresa') R.empresa = v;
  else if (id === 'campo-cidade') { if (MUN_ERRO) R.cidade = v.trim() ? v.trim() + '-' + (R.uf || '') : ''; listaCidades(); }
  else if (id === 'campo-nome') R.nome = v;
  else if (id === 'campo-whats') { e.target.value = mascara(v); R.whats = e.target.value.replace(/\D/g, ''); }
  else return;
  atualizaCont();
  salvar();
});
$('corpo').addEventListener('submit', (e) => {
  e.preventDefault();
  if (PASSOS[S.i].kind === 'city' && !MUN_ERRO) { const ops = document.querySelectorAll('[data-a="cid"]'); if (ops.length === 1) { ops[0].click(); return; } }
  continuar();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('folha').hidden) fecharFolha(); });
carregarEstado();
render(true);
carregarMun();
/* Voltou do checkout pelo botão do navegador: a página vem do cache com o botão travado */
window.addEventListener('pageshow', (e) => { if (e.persisted) { S.pagando = false; S.enviando = false; render(true); } });
})();
</script>
